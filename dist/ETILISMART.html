function workDetailModal(){
  if(!s.workDetailId)return "";
  const item=findWorkItemById(s.workDetailId);
  if(!item)return "";
  if(item.kind==="contractor")return contractorWorkDetailModal(item);

  const isRequest=item.kind==="request";
  const canCoreEdit=canEditWorkItemCore(item);
  const canProgressEdit=!isRequest&&canUpdateWorkOrder(item);
  const canDelete=canDeleteWorkItem(item);

  const categories=[
    "Aydınlatma",
    "Klima / Havalandırma",
    "Elektrik Tesisatı",
    "Enerji Hattı",
    "Kamera / Güvenlik",
    "Mekanik İyileştirme",
    "Kaynak / İmalat",
    "Pnömatik Hat",
    "Hidrolik Sistem",
    "Makine Taşıma",
    "Diğer"
  ];
  const priorities=["Düşük","Orta","Yüksek","Acil"];
  const factories=[...new Set([...userFactories(),item.factory].filter(Boolean))];
  const teams=["Elektrik Bakım","Mekanik Bakım"];
  const assignedTeam=item.assignedTeam||workTeamForCategory(item.category);
  const people=workMaintenanceOptions(item.factory,assignedTeam);
  const materials=workMaterials(item);

  const auditRows=[
    ["OLUŞTURAN / İSTEYEN",item.createdBy,item.createdAt],
    ["İNCELEYEN",item.reviewedBy,item.reviewedAt],
    ["ONAYLAYAN",item.approvedBy,item.approvedAt],
    ["REDDEDEN",item.rejectedBy,item.rejectedAt],
    ["İŞ EMRİNE DÖNÜŞTÜREN",item.convertedBy,item.convertedAt],
    ["SON DÜZENLEYEN",item.updatedBy,item.updatedAt],
    ["TAMAMLAYAN",item.completedBy,item.completedAt]
  ].filter(([,name])=>name);

  return `<div class="modal-backdrop work-detail-backdrop" id="workDetailBackdrop">
    <div class="modal work-detail-modal">
      <div class="modal-head">
        <div>
          <span class="work-detail-kind">${isRequest?"İŞ TALEBİ":"İŞ EMRİ"}</span>
          <h2>${esc(item.id)} · ${esc(item.title)}</h2>
          ${!isRequest&&item.procurementRequired?'<b class="procurement-badge">SATIN ALINACAK</b>':""}
          <p>${esc(item.factory)} · ${esc(item.department||"-")} · ${esc(item.location||"-")}</p>
        </div>
        <button type="button" id="closeWorkDetail">×</button>
      </div>

      <div class="work-detail-summary">
        <article><small>DURUM</small><b class="work-status ${esc(workStatusClass(item.status))}">${esc(workStatusLabel(item.status,isRequest?"request":"workorder"))}</b></article>
        <article><small>ÖNCELİK</small><b>${esc(item.priority||"-")}</b></article>
        <article><small>BAKIM EKİBİ</small><b>${esc(assignedTeam||"-")}</b></article>
        <article><small>SORUMLU</small><b>${esc(item.assignedTo||"Atama bekliyor")}</b></article>
      </div>

      <form id="workDetailForm" class="work-detail-form" data-work-id="${esc(item.id)}">
        <div class="field">
          <label>Fabrika</label>
          <select id="workDetailFactory" ${canCoreEdit?"":"disabled"}>
            ${factories.map(factory=>`<option value="${esc(factory)}" ${factory===item.factory?"selected":""}>${esc(factory)}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label>Bölüm</label>
          <input id="workDetailDepartment" value="${esc(item.department||"")}" ${canCoreEdit?"":"disabled"}>
        </div>
        <div class="field">
          <label>Talep / İş Yeri</label>
          <input id="workDetailLocation" value="${esc(item.location||"")}" ${canCoreEdit?"":"disabled"}>
        </div>
        <div class="field">
          <label>Kategori</label>
          <select id="workDetailCategory" ${canCoreEdit?"":"disabled"}>
            ${[...new Set([...categories,item.category].filter(Boolean))].map(category=>`<option value="${esc(category)}" ${category===item.category?"selected":""}>${esc(category)}</option>`).join("")}
          </select>
        </div>
        <div class="field work-detail-title-field">
          <label>Başlık</label>
          <input id="workDetailTitle" maxlength="160" value="${esc(item.title||"")}" ${canCoreEdit?"":"disabled"}>
        </div>
        <div class="field">
          <label>Öncelik</label>
          <select id="workDetailPriority" ${canCoreEdit?"":"disabled"}>
            ${priorities.map(priority=>`<option value="${priority}" ${priority===item.priority?"selected":""}>${priority}</option>`).join("")}
          </select>
        </div>

        ${isRequest?`
          <div class="field">
            <label>İstenen Tamamlanma Tarihi</label>
            <input id="workDetailRequestedDate" type="date" value="${esc(item.requestedDate||"")}" ${canCoreEdit?"":"disabled"}>
          </div>
          <div class="field">
            <label>Sorumlu Bakım Ekibi</label>
            <select id="workDetailTeam" ${canCoreEdit?"":"disabled"}>
              ${teams.map(team=>`<option value="${team}" ${team===assignedTeam?"selected":""}>${team}</option>`).join("")}
            </select>
          </div>
        `:`
          <div class="field">
            <label>Planlanan Başlangıç</label>
            <input id="workDetailPlanStart" type="date" value="${esc(item.planStart||"")}" ${canCoreEdit?"":"disabled"}>
          </div>
          <div class="field">
            <label>Planlanan Bitiş</label>
            <input id="workDetailPlanEnd" type="date" value="${esc(item.planEnd||"")}" ${canCoreEdit?"":"disabled"}>
          </div>
          <div class="field">
            <label>Bakım Ekibi</label>
            <select id="workDetailTeam" ${canCoreEdit?"":"disabled"}>
              ${teams.map(team=>`<option value="${team}" ${team===assignedTeam?"selected":""}>${team}</option>`).join("")}
            </select>
          </div>
          <div class="field">
            <label>Atanan Personel</label>
            <select id="workDetailAssignedTo" ${canCoreEdit?"":"disabled"}>

          </div>
          <div class="field">
            <label>İş Emri Durumu</label>
            <select id="workDetailStatus" ${canProgressEdit?"":"disabled"}>
              ${[
                ["open","Açık"],
                ["assigned","Personele Atandı"],
                ["progress","Devam Ediyor"],
                ["material","Malzeme Bekliyor"],
                ["approval","Bölüm Onayı Bekliyor"],
                ["done","Tamamlandı"],
                ["cancelled","İptal Edildi"]
              ].map(([value,label])=>`<option value="${value}" ${value===item.status?"selected":""}>${label}</option>`).join("")}

          </div>

        </div>`:""}

        ${(canCoreEdit||canProgressEdit)?`<div class="work-detail-save-row">
          <button type="submit" class="primary">Değişiklikleri Kaydet</button>
        </div>`:""}
      </form>

      ${isRequest&&canManageWorkRequest(item)&&!["converted","rejected","cancelled","done"].includes(item.status)?`<section class="work-detail-decision">
        <div><b>Talep İşlemleri</b><p>Talebi inceleyin, onaylayın, reddedin veya iş emrine dönüştürün.</p></div>
        <div class="work-detail-decision-actions">

      </section>`:""}

      ${isRequest&&permissions().createRequest&&item.createdBy===s.user?.name&&["new","reviewing"].includes(item.status)?`<section class="work-detail-decision cancel">

        <button type="button" data-work-request-action="cancelled" data-work-id="${esc(item.id)}" class="danger">Talebi İptal Et</button>
      </section>`:""}

      <section class="work-detail-audit">
        <div class="section-modern-head"><div><h2>Kayıt Geçmişi</h2><p>Talebi isteyen, onaylayan, reddeden ve düzenleyen kullanıcı bilgileri.</p></div></div>
        <div class="work-detail-audit-grid">

        </div>
      </section>

      ${!isRequest?`<section class="work-detail-materials">

        ${canProgressEdit?`<form class="work-material-form work-detail-material-form" data-work-id="${esc(item.id)}">

        </div>
      </section>`:""}

        </div>
        <button type="button" class="danger" id="deleteWorkDetail">${isRequest?"Talebi Sil":"İş Emrini Sil"}</button>
      </section>`:""}
    </div>
  </div>`;
}

function materialSortValue(material,key,usage){
  if(key==="faultCount")return Number(usage?.faultCount)||0;
  if(key==="usage")return Number(usage?.quantity)||0;
  if(["stock","minStock"].includes(key))return Number(material[key])||0;
  return String(material[key]||"").toLocaleLowerCase("tr-TR");
}
function materialSortableHead(key,label){
  const active=s.materialSortKey===key;
  return `<th><button type="button" class="material-sort-button ${active?"active":""}" data-material-sort="${esc(key)}">${esc(label)}<span>${active?(s.materialSortDir==="asc"?"▲":"▼"):"↕"}</span></button></th>`;
}
function materialUsageRows(){
  const map={};
  visibleFaults().forEach(f=>{
    faultUsedMaterials(f).forEach(item=>{
      const material=materialById(item.materialId);
      const key=item.materialId||item.name;
      if(!map[key])map[key]={
        materialId:item.materialId||"",
        name:material?.name||item.name||"Bilinmeyen Malzeme",
        code:material?.code||item.code||"-",
        category:material?.category||item.category||"-",
        quantity:0,
        faultCount:0,
        machines:{}
      };
      map[key].quantity+=Number(item.quantity)||0;
      map[key].faultCount+=1;
      const machine=f.machine||"Belirtilmemiş";
      map[key].machines[machine]=(map[key].machines[machine]||0)+1;
    });
  });
  return Object.values(map);
}

function readWorkshopDrawing(file){
  return new Promise((resolve,reject)=>{
    if(!file)return resolve({name:"",data:""});
    if(file.size>1.5*1024*1024)return reject(new Error("Teknik resim dosyası 1,5 MB sınırını aşıyor."));
    const reader=new FileReader();
    reader.onload=()=>resolve({name:file.name,data:String(reader.result||"")});
    reader.onerror=()=>reject(new Error("Teknik resim okunamadı."));
    reader.readAsDataURL(file);
  });
}
function nextWorkshopId(){
  const values=(s.workshopJobs||[]).map(job=>Number(String(job.id).replace(/\D/g,""))||0);
  return `AT-${Math.max(1000,...values)+1}`;
}
function bindWorkshopPage(){
  document.querySelectorAll("[data-workshop-tab]").forEach(button=>button.onclick=()=>{s.workshopTab=button.dataset.workshopTab==="archive"?"archive":"active";s.workshopDetailId=null;render()});
  const search=document.getElementById("workshopSearch");

  document.querySelectorAll("[data-workshop-sort]").forEach(button=>button.onclick=()=>{const key=button.dataset.workshopSort;if(s.workshopSortKey===key)s.workshopSortDir=s.workshopSortDir==="asc"?"desc":"asc";else{s.workshopSortKey=key;s.workshopSortDir=["date","estimatedHours","quantity"].includes(key)?"desc":"asc"}render()});

  const close=()=>{s.workshopDetailId=null;render()};
  const closeButton=document.getElementById("closeWorkshopDetail");if(closeButton)closeButton.onclick=close;
  const backdrop=document.getElementById("workshopDetailBackdrop");if(backdrop)backdrop.onclick=e=>{if(e.target===backdrop)close()};
  const factory=document.getElementById("workshopFactory"),line=document.getElementById("workshopLine"),department=document.getElementById("workshopDepartment"),machine=document.getElementById("workshopMachine");
  const refreshMachines=()=>{if(machine)machine.innerHTML=catalogMachines(factory.value,line.value,department.value).map(item=>`<option>${esc(item)}</option>`).join("")};
  const refreshDepartments=()=>{const values=roleIsDepartmentLimited()&&s.user?.department?[s.user.department]:catalogDepartments(factory.value,line.value);department.innerHTML=values.map(item=>`<option>${esc(item)}</option>`).join("");refreshMachines()};
  if(factory)factory.onchange=()=>{line.innerHTML=(FACTORIES[factory.value]||[]).map(item=>`<option>${esc(item)}</option>`).join("");refreshDepartments()};
  if(line)line.onchange=refreshDepartments;if(department)department.onchange=refreshMachines;
  const create=document.getElementById("workshopCreateForm");
  if(create)create.onsubmit=async e=>{
    e.preventDefault();if(!canCreateWorkshopRequest()&&!canCreateWorkshopDirect())return;
    try{
      const drawing=await readWorkshopDrawing(document.getElementById("workshopDrawing")?.files?.[0]);
      const values={factory:factory.value,line:line.value,department:department.value,machine:machine.value};
      if(!userCanSeeFactory(values.factory)||!catalogMachines(values.factory,values.line,values.department).includes(values.machine)){alert("Geçersiz fabrika, bölüm veya makine seçimi.");return}
      if(roleIsDepartmentLimited()&&values.department!==s.user.department){alert("Yalnızca kendi bölümünüz için talep açabilirsiniz.");return}
      const partName=document.getElementById("workshopPartName").value.trim();
      const id=nextWorkshopId();
      const direct=canCreateWorkshopDirect()&&!canCreateWorkshopRequest();
      const directStatus=direct?document.getElementById("workshopDirectStatus").value:"Talep Açıldı";
      const now=new Date().toISOString();
      const directHours=direct?Number(document.getElementById("workshopDirectHours").value):null;
      const directNotes=direct?document.getElementById("workshopDirectNotes").value.trim():"";
      s.workshopJobs.push({...values,id,title:document.getElementById("workshopTitle").value.trim(),partName,partCode:document.getElementById("workshopPartCode").value.trim().toLocaleUpperCase("tr-TR")||`ATM-${id.replace(/\D/g,"")}`,partType:document.getElementById("workshopPartType").value,quantity:Number(document.getElementById("workshopQuantity").value),materialSpec:document.getElementById("workshopMaterialSpec").value.trim(),priority:document.getElementById("workshopPriority").value,description:document.getElementById("workshopDescription").value.trim(),technicalDrawingName:drawing.name,technicalDrawingData:drawing.data,status:directStatus,requestedBy:s.user?.name||"",requestedAt:now,approvedBy:direct?s.user.name:"",approvedAt:direct?now:null,startedAt:direct?now:null,completedAt:direct&&directStatus==="Tamamlandı"?now:null,completedBy:direct&&directStatus==="Tamamlandı"?s.user.name:"",estimatedHours:directHours,workNotes:directNotes,linkedMaterialId:""});
      saveWorkshopJobs();s.workshopCreateOpen=false;render();
    }catch(error){alert(error.message)}
  };
  const manage=document.getElementById("workshopManageForm");
  if(manage)manage.onsubmit=e=>{
    e.preventDefault();if(!canManageWorkshopJobs())return;
    const job=s.workshopJobs.find(item=>String(item.id)===String(manage.dataset.workshopId));if(!job)return;
    const previous=job.status;job.status=document.getElementById("workshopStatus").value;job.estimatedHours=Number(document.getElementById("workshopEstimate").value);job.workNotes=document.getElementById("workshopNotes").value.trim();job.updatedBy=s.user.name;job.updatedAt=new Date().toISOString();
    if(["Onaylandı","Üretimde","Kontrol Bekliyor","Tamamlandı"].includes(job.status)&&!job.approvedAt){job.approvedAt=new Date().toISOString();job.approvedBy=s.user.name}
    if(job.status==="Üretimde"&&!job.startedAt)job.startedAt=new Date().toISOString();
    if(job.status==="Tamamlandı"&&previous!=="Tamamlandı"){job.completedAt=new Date().toISOString();job.completedBy=s.user.name}
    saveWorkshopJobs();render();
  };
  document.querySelectorAll("[data-workshop-create-material]").forEach(button=>button.onclick=()=>{
    if(!canManageWorkshopJobs())return;
    const job=s.workshopJobs.find(item=>String(item.id)===String(button.dataset.workshopCreateMaterial));if(!job||job.linkedMaterialId)return;
    const duplicate=MATERIALS.find(item=>String(item.code).toLocaleUpperCase("tr-TR")===String(job.partCode).toLocaleUpperCase("tr-TR"));
    if(duplicate)job.linkedMaterialId=duplicate.id;
    else{
      const material={id:`MAT-AT-${Date.now()}`,code:job.partCode,name:job.partName,category:"Mekanik",unit:"Adet",stock:Number(job.quantity)||1,minStock:0,warehouseLocation:"Mekanik Atölye · Teslim Bekliyor",description:`${job.machine} için atölyede üretildi. Atölye işi: ${job.id}`,custom:true,workshopJobId:job.id,createdBy:s.user.name,createdAt:new Date().toISOString()};
      MATERIALS.push(material);saveMaterials();job.linkedMaterialId=material.id;
    }
    saveWorkshopJobs();render();
  });
}

  return (s.workshopJobs||[]).filter(job=>job.factory===factory&&job.line===line&&job.department===department&&job.machine===machine&&job.status==="Tamamlandı").sort((a,b)=>new Date(b.completedAt||b.requestedAt)-new Date(a.completedAt||a.requestedAt));
}

<script>
/* Planlı bakım verileri */
const MAINTENANCE_TYPES=["Periyodik Bakım","Yağlama","Elektrik Kontrolü","Mekanik Kontrol","Kalibrasyon","Temizlik","Revizyon","Güvenlik Kontrolü"];
const MAINTENANCE_PRIORITIES=["Düşük","Normal","Yüksek","Kritik"];
function dateOnly(d){
  const x=new Date(d);
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
}
function addDays(base,days){
  const d=new Date(base);d.setDate(d.getDate()+days);return d;
}
function generatePlannedMaintenances(){

function maintenanceStatusClass(status){
  return status==="done"?"done":status==="cancelled"?"cancelled":status==="progress"?"progress":"planned";

function canEditPlannedMaintenance(item){
  if(!item||!permissions().editPlanned||!userCanSeeFactory(item.factory))return false;

  if(s.user?.role==="Bölüm Formeni")return !!s.user.department&&item.department===s.user.department;

function plannedMaintenancePage(){
  const current=new Date(s.calendarDate);
  const year=current.getFullYear(),month=current.getMonth();
  const firstDay=new Date(year,month,1);
  const startOffset=(firstDay.getDay()+6)%7;
  const daysInMonth=new Date(year,month+1,0).getDate();
  const previousDays=new Date(year,month,0).getDate();
  const items=visibleMaintenances();
  const today=dateOnly(new Date());
  const upcoming=items.filter(x=>x.date>=today&&x.status!=="done"&&x.status!=="cancelled").sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const overdue=items.filter(x=>x.date<today&&x.status!=="done"&&x.status!=="cancelled");
  const doneThisMonth=items.filter(x=>x.status==="done"&&new Date(x.date).getMonth()===month&&new Date(x.date).getFullYear()===year);
  const cells=[];
  for(let i=0;i<42;i++){
    const dayNum=i-startOffset+1;
    let cellDate,inside=true,label=dayNum;
    if(dayNum<1){label=previousDays+dayNum;cellDate=new Date(year,month-1,label);inside=false}
    else if(dayNum>daysInMonth){label=dayNum-daysInMonth;cellDate=new Date(year,month+1,label);inside=false}
    else cellDate=new Date(year,month,dayNum);
    const key=dateOnly(cellDate);
    const dayItems=items.filter(x=>x.date===key).sort((a,b)=>a.time.localeCompare(b.time));
    cells.push(`<div class="calendar-day ${inside?"":"outside"} ${key===today?"today":""}" data-calendar-date="${key}">
      <div class="calendar-day-number"><span>${label}</span>${dayItems.length?`<b>${dayItems.length}</b>`:""}</div>
      <div class="calendar-events">${dayItems.slice(0,3).map(x=>`<button type="button" class="calendar-event ${maintenanceStatusClass(x.status)}" data-pm-id="${esc(x.id)}" title="${esc(x.title)} · Planlayan: ${esc(x.createdBy||"Sistem / Önceki Kayıt")}"><time>${esc(x.time)}</time><span>${esc(x.machine)}</span></button>`).join("")}${dayItems.length>3?`<small>+${dayItems.length-3} bakım</small>`:""}</div>
    </div>`);
  }
  return `${clockBlock()}
  <section class="desktop-page-title maintenance-title">
    <div><span>BAKIM PLANLAMA</span><h1>Planlı Bakımlar</h1><p>Bakım görevlerini takvim üzerinde planlayın, takip edin ve tamamlayın.</p></div>
    ${canCreatePlannedMaintenance()?'<button class="primary" id="addPlannedMaintenance">+ Yeni Bakım Planla</button>':""}
  </section>
  <section class="maintenance-kpis">
    <article><i class="blue">▦</i><div><small>BU AY PLANLANAN</small><b>${items.filter(x=>new Date(x.date).getMonth()===month&&new Date(x.date).getFullYear()===year).length}</b></div></article>
    <article><i class="amber">◷</i><div><small>YAKLAŞAN BAKIM</small><b>${upcoming.length}</b></div></article>
    <article><i class="red">!</i><div><small>GECİKEN</small><b>${overdue.length}</b></div></article>
    <article><i class="green">✓</i><div><small>BU AY TAMAMLANAN</small><b>${doneThisMonth.length}</b></div></article>
  </section>
  <section class="maintenance-layout">
    <article class="maintenance-calendar-card">
      <div class="calendar-toolbar">
        <div><button type="button" id="calendarPrev">‹</button><button type="button" id="calendarToday">Bugün</button><button type="button" id="calendarNext">›</button></div>
        <h2>${esc(calendarMonthLabel(current))}</h2>
        <div class="calendar-legend"><span><i class="planned"></i>Planlandı</span><span><i class="progress"></i>Devam Ediyor</span><span><i class="done"></i>Tamamlandı</span></div>
      </div>
      <div class="calendar-weekdays">${["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"].map(x=>`<b>${x}</b>`).join("")}</div>
      <div class="maintenance-calendar">${cells.join("")}</div>
    </article>
    <aside class="upcoming-maintenance-panel">
      <div class="upcoming-head"><div><h3>Yaklaşan Bakımlar</h3><p>Sıradaki planlı görevler</p></div><span>${upcoming.length}</span></div>
      <div class="upcoming-list">${upcoming.slice(0,8).map(x=>`<article class="upcoming-item priority-${esc(String(x.priority||"Normal").toLocaleLowerCase("tr-TR").replace("ü","u").replace("ş","s"))}" data-pm-id="${esc(x.id)}" tabindex="0">
        <div class="upcoming-date"><b>${new Date(x.date+"T00:00:00").getDate()}</b><small>${new Date(x.date+"T00:00:00").toLocaleDateString("tr-TR",{month:"short"})}</small></div>
        <div class="upcoming-copy"><div><b>${esc(x.machine)}</b><span>${esc(x.time)}</span></div><p>${esc(x.title)}</p><small>${esc(x.factory)} · ${esc(x.line)}</small><small class="planned-by">Planlayan: ${esc(x.createdBy||"Sistem / Önceki Kayıt")}</small><em>${esc(x.priority)}</em></div>
        ${canEditPlannedMaintenance(x)?`<select class="pm-status" data-id="${esc(x.id)}"><option value="planned" ${x.status==="planned"?"selected":""}>Planlandı</option><option value="progress" ${x.status==="progress"?"selected":""}>Devam Ediyor</option><option value="done" ${x.status==="done"?"selected":""}>Tamamlandı</option><option value="cancelled" ${x.status==="cancelled"?"selected":""}>İptal</option></select>`:""}
      </article>`).join("")||'<div class="compact-empty"><span>✓</span><p>Yaklaşan planlı bakım bulunmuyor.</p></div>'}</div>
    </aside>
  </section>
  ${plannedMaintenanceModal()}${plannedMaintenanceDetailModal()}`;
}

function seededRandom(seed){
  let value=seed % 2147483647;
  return function(){
    value=value*16807%2147483647;
    return (value-1)/2147483646;
  }
}

function generateHistory(){
  const rnd=seededRandom(20260725);
  const factories=Object.keys(FACTORIES);
  const departments=Object.keys(STRUCTURE);
  const types=TYPES;
  const arr=[];
  let id=2000;
  const now=new Date();

  for(let i=0;i<260;i++){
    const factory=factories[Math.floor(rnd()*factories.length)];
    const line=FACTORIES[factory][Math.floor(rnd()*FACTORIES[factory].length)];
    const department=departments[Math.floor(rnd()*departments.length)];
    const machine=STRUCTURE[department][Math.floor(rnd()*STRUCTURE[department].length)];
    const type=types[Math.floor(rnd()*types.length)];
    const subjectList=SUBJECTS[type];
    const subject=subjectList[Math.floor(rnd()*subjectList.length)];
    const daysAgo=2+Math.floor(rnd()*205);
    const start=new Date(now);
    start.setDate(now.getDate()-daysAgo);
    start.setHours(Math.floor(rnd()*24),Math.floor(rnd()*60),0,0);
    const duration=5+Math.floor(rnd()*235);
    const end=new Date(start.getTime()+duration*60000);
    const stopped=rnd()>0.58;
    arr.push({
      id:id++,
      factory,line,department,machine,type,subject,
      description:"Geçmiş örnek arıza kaydı. Müdahale tamamlandı ve kayıt kapatıldı.",
      stopped,photoName:"",status:"done",
      openedBy:deterministicPerson(DEMO_FAULT_OPENERS,id,i),
      assignedTo:"",
      createdAt:start.toISOString(),closedAt:end.toISOString()
    });
    arr[arr.length-1].assignedTo=deterministicPerson(
      maintenanceOptionsForFault(arr[arr.length-1]),arr[arr.length-1].id,i+11
    );
  }

  arr.push(
    {id:1001,factory:"1. Fabrika",line:"1. Hat",department:"Pres Bölümü",machine:"Presler",type:"Hidrolik",subject:"Yağ basıncı düşük",description:"Basınç normal seviyenin altında.",stopped:true,photoName:"",status:"open",openedBy:"Hakan Yıldız",assignedTo:"Üzeyir Toy",createdAt:new Date(Date.now()-42*60000).toISOString(),closedAt:null},
    {id:1002,factory:"2. Fabrika B Blok",line:"2. Hat",department:"Paketleme",machine:"Etiket Yazıcı",type:"Elektrik",subject:"Etiket yazdırmıyor",description:"Yazıcı çevrimiçi ancak çıktı alınamıyor.",stopped:false,photoName:"",status:"progress",openedBy:"Burak Demir",assignedTo:"Mert Yaman",createdAt:new Date(Date.now()-18*60000).toISOString(),closedAt:null}
  );
  return arr;
}

function recentShiftWindows(reference=new Date()){
  const hour=reference.getHours();
  const startHour=hour<8?0:hour<16?8:16;
  const currentStart=new Date(reference);
  currentStart.setHours(startHour,0,0,0);
  return Array.from({length:3},(_,index)=>{
    const start=new Date(currentStart.getTime()-index*8*60*60*1000);
    const end=new Date(start.getTime()+8*60*60*1000);
    return {start,end,label:`${String(start.getHours()).padStart(2,"0")}:00–${String(end.getHours()).padStart(2,"0")}:00`,date:start.toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric"})};
  });
}
function lastThreeShiftReport(){
  const windows=recentShiftWindows();
  const allowedFactory=factory=>s.reportFactory==="Tümü"?userCanSeeFactory(factory):factory===s.reportFactory;
  const inWindow=(date,window)=>{const value=new Date(date);return Number.isFinite(value.getTime())&&value>=window.start&&value<window.end};
  const entries=windows.map(window=>{
    const faults=visibleFaults().filter(item=>allowedFactory(item.factory)&&inWindow(item.closedAt||item.createdAt,window));
    const logs=(s.maintenanceLogs||[]).filter(item=>allowedFactory(item.factory)&&inWindow(item.performedAt||item.createdAt,window));
    const work=(s.workItems||[]).filter(item=>item.kind==="workorder"&&allowedFactory(item.factory)&&inWindow(item.completedAt||item.createdAt,window));
    const planned=(s.plannedMaintenances||[]).filter(item=>allowedFactory(item.factory)&&item.status==="done"&&inWindow(item.updatedAt||`${item.date}T${item.time||"00:00"}`,window));
    const rows=[
      ...faults.map(item=>({type:"Arıza",title:item.subject,location:`${item.factory} · ${item.department} · ${item.machine}`,person:item.assignedTo||"Atama bekliyor",status:item.status==="done"?"Tamamlandı":"Açık"})),
      ...logs.map(item=>({type:item.workType||"Yapılan İş",title:item.title,location:`${item.factory} · ${item.location||"Konum belirtilmedi"}`,person:(item.participants||[]).join(", ")||item.createdBy,status:"Kaydedildi"})),
      ...work.map(item=>({type:"İş Emri",title:item.title,location:`${item.factory} · ${item.department}`,person:item.completedBy||item.assignedTo||"-",status:workStatusLabel(item.status,"workorder")})),
      ...planned.map(item=>({type:"Planlı Bakım",title:item.title,location:`${item.factory} · ${item.department} · ${item.machine}`,person:item.assigned||item.updatedBy||"-",status:"Tamamlandı"}))
    ];
    return {...window,rows,counts:{faults:faults.length,logs:logs.length,work:work.length,planned:planned.length}};
  });

      <div class="shift-report-counts"><span>${entry.counts.faults} arıza</span><span>${entry.counts.logs} yapılan iş</span><span>${entry.counts.work} iş emri</span><span>${entry.counts.planned} planlı bakım</span></div>

    </article>`).join("")}</div>
  </section>`;
}
function reportPage(){
  let base=visibleFaults();
  if(s.reportFactory!=="Tümü")base=base.filter(x=>x.factory===s.reportFactory);
  if(s.reportStart)base=base.filter(x=>new Date(x.createdAt)>=new Date(s.reportStart+"T00:00:00"));
  if(s.reportEnd)base=base.filter(x=>new Date(x.createdAt)<=new Date(s.reportEnd+"T23:59:59"));

  const trend=trendDataFor(base,"trend");
  const shiftTrend=trendDataFor(base,"shiftTrend");
  const departmentData=countBy(chartRangeFaultsFor(base,"department"),"department").slice(0,10).map(([label,value])=>({label,value}));
  const typeData=countBy(chartRangeFaultsFor(base,"type"),"type").map(([label,value])=>({label,value}));
  const downtimeData=countBy(chartRangeFaultsFor(base,"downtime").filter(x=>x.stopped),"department").slice(0,10).map(([label,value])=>({label,value}));
  const statusData=[
    {label:"Yeni",value:chartRangeFaultsFor(base,"status").filter(x=>x.status==="open").length},
    {label:"İşlemde",value:chartRangeFaultsFor(base,"status").filter(x=>x.status==="progress").length},
    {label:"Tamamlandı",value:chartRangeFaultsFor(base,"status").filter(x=>x.status==="done").length}
  ];
  const machineData=countBy(chartRangeFaultsFor(base,"machineRank"),"machine").slice(0,12).map(([label,value])=>({label,value}));
  const completed=base.filter(x=>x.status==="done");
  const stoppedFaults=base.filter(x=>x.stopped);
  const averageMinutes=items=>items.length?Math.round(items.reduce((sum,item)=>sum+durationMs(item)/60000,0)/items.length):0;
  const mttr=averageMinutes(completed);
  const totalDowntimeMinutes=Math.round(stoppedFaults.reduce((sum,item)=>sum+durationMs(item)/60000,0));
  const responseRecords=base.filter(x=>x.claimedAt&&new Date(x.claimedAt)>=new Date(x.createdAt));
  const avgResponse=responseRecords.length?Math.round(responseRecords.reduce((sum,item)=>sum+(new Date(item.claimedAt)-new Date(item.createdAt))/60000,0)/responseRecords.length):0;
  const completionRate=base.length?Math.round(completed.length/base.length*100):0;
  const averageByDepartment=(items,valueFn)=>countBy(items,"department").map(([label])=>{
    const group=items.filter(x=>(x.department||"Belirtilmemiş")===label);
    return {label,value:group.length?Math.round(group.reduce((sum,item)=>sum+valueFn(item),0)/group.length):0};
  }).slice(0,10);
  const responseByDepartment=averageByDepartment(responseRecords,item=>Math.max(0,(new Date(item.claimedAt)-new Date(item.createdAt))/60000));
  const repairByDepartment=averageByDepartment(completed,item=>durationMs(item)/60000);
  const repeatData=countBy(chartRangeFaultsFor(base,"repeatSubject"),"subject").filter(([,value])=>value>1).slice(0,10).map(([label,value])=>({label,value}));
  const personnelMap=new Map();
  completed.forEach(item=>faultParticipants(item).forEach(name=>personnelMap.set(name,(personnelMap.get(name)||0)+1)));
  const personnelData=[...personnelMap.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10).map(([label,value])=>({label,value}));
  const factoryOptions=permissions().allFactories?["Tümü",...Object.keys(FACTORIES)]:["Tümü",...userFactories()];

  return `${clockBlock()}
  <section class="desktop-page-title charts-title">

  </section>
  <section class="charts-global-filter">
    <label>Başlangıç Tarihi<input type="date" id="reportStart" value="${s.reportStart}"></label>
    <label>Bitiş Tarihi<input type="date" id="reportEnd" value="${s.reportEnd}"></label>
    <label>Fabrika<select id="reportFactory">${factoryOptions.map(x=>`<option ${x===s.reportFactory?"selected":""}>${x}</option>`).join("")}</select></label>
    <button class="secondary" id="clearReport">Filtreleri Temizle</button>
  </section>
  <section class="report-summary-grid">
    <article><small>TOPLAM ARIZA</small><b>${base.length}</b><span>seçili filtrelerde</span></article>
    <article><small>TAMAMLANMA ORANI</small><b>%${completionRate}</b><span>${completed.length} tamamlandı</span></article>
    <article><small>ORT. MÜDAHALEYE BAŞLAMA</small><b>${avgResponse} dk</b><span>${responseRecords.length} üstlenme kaydı</span></article>
    <article><small>MTTR</small><b>${mttr} dk</b><span>ortalama onarım süresi</span></article>
    <article><small>TOPLAM DURUŞ</small><b>${Math.floor(totalDowntimeMinutes/60)} sa ${totalDowntimeMinutes%60} dk</b><span>${stoppedFaults.length} duruş kaydı</span></article>
  </section>
  ${lastThreeShiftReport()}
  <section class="charts-dashboard-grid">
    <article class="analytics-chart-card wide">
      <div class="chart-panel-head"><div><h3>Arıza Trendi</h3><p>Zamana göre açılan arıza sayısı</p></div>${chartRangeControlsFor("trend")}</div>
      ${lineChartSVG(trend.length?trend:[{label:"Kayıt Yok",value:0}],"")}
    </article>
    <article class="analytics-chart-card">
      <div class="chart-panel-head"><div><h3>Vardiya Trendi</h3><p>Vardiyalara göre arıza yoğunluğu</p></div>${chartRangeControlsFor("shiftTrend")}</div>
      ${lineChartSVG(shiftTrend.length?shiftTrend:[{label:"Kayıt Yok",value:0}],"")}
    </article>
    <article class="analytics-chart-card">
      <div class="chart-panel-head"><div><h3>Durum Dağılımı</h3><p>Yeni, işlemde ve tamamlanan işler</p></div>${chartRangeControlsFor("status")}</div>
      ${barChartSVG(statusData,"")}
    </article>
    <article class="analytics-chart-card">
      <div class="chart-panel-head"><div><h3>Bölümlere Göre Arıza</h3><p>En yoğun bölümler</p></div>${chartRangeControlsFor("department")}</div>
      ${barChartSVG(departmentData.length?departmentData:[{label:"Kayıt Yok",value:0}],"")}
    </article>
    <article class="analytics-chart-card">
      <div class="chart-panel-head"><div><h3>Arıza Tipleri</h3><p>Elektrik, mekanik ve diğer tipler</p></div>${chartRangeControlsFor("type")}</div>
      ${barChartSVG(typeData.length?typeData:[{label:"Kayıt Yok",value:0}],"")}
    </article>
    <article class="analytics-chart-card">
      <div class="chart-panel-head"><div><h3>Üretim Duruşları</h3><p>Bölümlere göre duruş oluşturan arızalar</p></div>${chartRangeControlsFor("downtime")}</div>
      ${barChartSVG(downtimeData.length?downtimeData:[{label:"Kayıt Yok",value:0}],"")}
    </article>
    <article class="analytics-chart-card wide">
      <div class="chart-panel-head"><div><h3>En Çok Arıza Çıkaran Makineler</h3><p>Makine bazında arıza sıralaması</p></div>${chartRangeControlsFor("machineRank")}</div>
      ${barChartSVG(machineData.length?machineData:[{label:"Kayıt Yok",value:0}],"")}
    </article>
    <article class="analytics-chart-card">
      <div class="chart-panel-head"><div><h3>Ort. Müdahaleye Başlama Süresi</h3><p>Bölümlere göre dakika cinsinden</p></div></div>
      ${barChartSVG(responseByDepartment.length?responseByDepartment:[{label:"Kayıt Yok",value:0}],"")}
    </article>
    <article class="analytics-chart-card">
      <div class="chart-panel-head"><div><h3>Ort. Onarım Süresi</h3><p>Bölümlere göre MTTR (dakika)</p></div></div>
      ${barChartSVG(repairByDepartment.length?repairByDepartment:[{label:"Kayıt Yok",value:0}],"")}
    </article>
    <article class="analytics-chart-card">
      <div class="chart-panel-head"><div><h3>Tekrarlayan Arızalar</h3><p>Aynı arıza konusunun tekrar sayısı</p></div>${chartRangeControlsFor("repeatSubject")}</div>
      ${barChartSVG(repeatData.length?repeatData:[{label:"Tekrarlayan Kayıt Yok",value:0}],"")}
    </article>
    <article class="analytics-chart-card">
      <div class="chart-panel-head"><div><h3>Personel Tamamlama Dağılımı</h3><p>Tamamlanan arızalarda görev alan personeller</p></div></div>
      ${barChartSVG(personnelData.length?personnelData:[{label:"Kayıt Yok",value:0}],"")}
    </article>
  </section>`;
}
function machineState(factory,line,machine){
  const active=s.faults.find(x=>x.factory===factory&&x.line===line&&x.machine===machine&&x.status!=="done");
  if(!active)return {cls:"running",text:"Çalışıyor"};
  if(active.stopped)return {cls:"stopped",text:"Duruş"};
  return {cls:"warning",text:"Arızalı"};
}

function faultDetailModal(){

  const productionText=f.stopped?"Evet — üretim durdu":"Hayır";

    :`<div class="participant-chips">${participants.map(name=>`<span>${esc(name)}</span>`).join("")||'<span>Personel atanmadı</span>'}</div>`;
  const claimButton=canClaimFault(f)?`<button type="button" class="primary fault-claim-button" id="faultClaimButton">Arızayı Üstlen ve Müdahaleyi Başlat</button>`:"";

  const handoverHistory=(f.handovers||[]).length?`<section class="fault-detail-card wide"><div class="section-modern-head"><div><h3>Arıza Devir Geçmişi</h3><p>Vardiyalar arasındaki teslim kayıtları</p></div></div><div class="fault-handover-history">${[...(f.handovers||[])].reverse().map(h=>`<article><span>${fmtDate(h.at)}</span><b>${esc(h.from)} → ${esc(h.to)}</b><small>${esc(h.fromShift||"-")} → ${esc(h.toShift||"-")}</small><p>${esc(h.note||"Devir notu girilmedi.")}</p></article>`).join("")}</div></section>`:"";
  const statusControl=canUpdateFaultStatus(f)?`<select id="faultModalStatus" class="sel fault-modal-status"><option value="open" ${f.status==="open"?"selected":""}>Yeni</option><option value="progress" ${f.status==="progress"?"selected":""}>İşlemde</option><option value="done" ${f.status==="done"?"selected":""}>Tamamlandı</option></select>`:`<span class="status ${esc(f.status)}">${statusLabel(f.status)}</span>`;
  const canEditSolution=canUpdateFaultStatus(f);

function machineModal(){
  if(!s.machineModal)return "";

  const total=hist.length,active=hist.filter(x=>x.status!=="done").length,totalMin=Math.round(hist.reduce((sum,x)=>sum+durationMs(x)/60000,0));
  const mttr=total?Math.round(totalMin/total):0;
  const sorted=[...hist].sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));

      <strong class="maintenance-detail-status ${maintenanceStatusClass(item.status)}">${esc(maintenanceStatusLabel(item.status))}</strong>
    </article>`).join("")||'<div class="compact-empty"><span>▦</span><p>Bu makine için planlı bakım kaydı bulunmuyor.</p></div>'}</div>
  </section>`;
  else if(s.machineTab==="charts")body=`<div class="machine-chart-grid">
    <article class="analytics-chart-card wide"><div class="chart-panel-head"><div><h3>Makine Arıza Trendi</h3><p>${esc(machine)} için zaman bazlı arıza sayısı</p></div>${chartRangeControlsFor("machineTrend")}</div>${lineChartSVG(machineTrend.length?machineTrend:[{label:"Yok",value:0}],"")}</article>
    <article class="analytics-chart-card"><div class="chart-panel-head"><div><h3>Arıza Tipi Dağılımı</h3><p>Makinenin arıza türleri</p></div>${chartRangeControlsFor("machineType")}</div>${barChartSVG(typeData.length?typeData:[{label:"Yok",value:0}],"")}</article>
    <article class="analytics-chart-card"><div class="chart-panel-head"><div><h3>Duruş Nedenleri</h3><p>Üretimi durduran arıza konuları</p></div>${chartRangeControlsFor("machineDowntime")}</div>${barChartSVG(machineDowntime.length?machineDowntime:[{label:"Yok",value:0}],"")}</article>
  </div>`;
  else if(s.machineTab==="workshop"){
    const parts=workshopPartsForMachine(factory,line,department,machine);
    body=`<section class="machine-workshop-parts"><div class="section-modern-head"><div><h3>Atölyede Üretilen Parçalar</h3><p>${esc(machine)} için tamamlanan mekanik atölye işleri</p></div><span class="list-count blue">${parts.length}</span></div><div class="machine-workshop-list">${parts.map(job=>`<article><div><small>${esc(job.partCode||job.id)} · ${esc(job.partType)}</small><b>${esc(job.partName)}</b><span>${job.quantity} adet · ${esc(job.materialSpec||"Malzeme belirtilmedi")}</span></div><div><small>Tamamlanma</small><b>${job.completedAt?fmtDate(job.completedAt):"-"}</b><span>${job.linkedMaterialId?"Malzeme kataloğuna bağlı":"Katalog bağlantısı yok"}</span></div></article>`).join("")||'<div class="compact-empty"><p>Bu makine için tamamlanmış atölye parçası bulunmuyor.</p></div>'}</div></section>`;
  }
  else if(s.machineTab==="documents")body=`<div class="empty-panel"><h3>Makine Dokümanları</h3><p>Bu alana elektrik şeması, mekanik çizim, kullanım kılavuzu ve PLC yedekleri eklenecek.</p><button class="secondary">+ Doküman Ekle</button></div>`;
  else body=`<div class="machine-kpis"><div class="metric"><span>Toplam Arıza</span><b>${total}</b></div><div class="metric"><span>Aktif Arıza</span><b>${active}</b></div><div class="metric"><span>Toplam Duruş</span><b>${totalMin} dk</b></div><div class="metric"><span>MTTR</span><b>${mttr} dk</b></div><div class="metric"><span>MTBF</span><b>${mtbf} sa</b></div><div class="metric wide"><span>En Sık Arıza</span><b>${esc(topSubject)}</b></div></div><div class="machine-info-grid"><div class="info-card"><h4>Makine Bilgileri</h4><p><b>Fabrika:</b> ${esc(factory)}</p><p><b>Hat:</b> ${esc(line)}</p><p><b>Bölüm:</b> ${esc(department||"-")}</p><p><b>Makine:</b> ${esc(machine)}</p><p><b>Son Kaydı Açan:</b> ${esc(hist[0]?.openedBy||"-")}</p><p><b>Durum:</b> ${machineState(factory,line,machine).text}</p></div><div class="info-card"><h4>Son Kayıt</h4>${hist[0]?`<p><b>${esc(hist[0].subject)}</b></p><p>${fmtDate(hist[0].createdAt)}</p><p>${durationText(hist[0])}</p>`:"<p>Kayıt yok.</p>"}</div></div>`;

  return `<div class="modal-backdrop" id="modalCloseBg"><div class="modal machine-modal">
    <div class="modal-head"><div><h2>${esc(machine)}</h2><p>${esc(factory)} · ${esc(line)} · ${esc(department||"-")}</p></div><div class="modal-head-actions"><button type="button" class="machine-qr-button" data-qr-machine="${esc(machine)}" data-qr-factory="${esc(factory)}" data-qr-line="${esc(line)}">QR</button><button id="modalClose">×</button></div></div>
    <div class="tabs"><button data-tab="overview" class="${s.machineTab==="overview"?"active":""}">Genel Bakış</button><button data-tab="history" class="${s.machineTab==="history"?"active":""}">Arıza Geçmişi</button><button data-tab="maintenance" class="${s.machineTab==="maintenance"?"active":""}">Planlı Bakım Geçmişi</button><button data-tab="workshop" class="${s.machineTab==="workshop"?"active":""}">Atölye Parçaları</button>${roleHasCharts()?`<button data-tab="charts" class="${s.machineTab==="charts"?"active":""}">Grafikler</button>`:""}<button data-tab="documents" class="${s.machineTab==="documents"?"active":""}">Dokümanlar</button></div>
    ${body}
  </div></div>`;
}

<script>
/* Uygulama durumu, bildirimler ve ortak yardımcılar */
const NOTIFICATION_STATE_KEY="etilismart_notification_state_v1";
function notificationUserId(){
  return String(s.user?.id||s.user?.name||"guest");
}
function notificationStateMap(){
  return storageJsonRecord(localStorage,NOTIFICATION_STATE_KEY,{});
}
function ensureNotificationBaseline(){
  if(!s.user)return;
  const map=notificationStateMap();
  const key=notificationUserId();
  if(!safeRecord(map[key],null)){
    const initialSeen=new Date(Date.now()-8*60*60*1000).toISOString();
    map[key]={faults:initialSeen,requests:initialSeen};
    storageSet(localStorage,NOTIFICATION_STATE_KEY,JSON.stringify(map));
  }
}
function notificationSeenState(){
  ensureNotificationBaseline();
  const map=notificationStateMap();
  return safeRecord(map[notificationUserId()],{faults:new Date().toISOString(),requests:new Date().toISOString()});
}
function markNotificationsSeen(pageName){
  if(!s.user)return;
  if(!["faults","work"].includes(pageName))return;
  const map=notificationStateMap();
  const key=notificationUserId();
  const current=safeRecord(map[key],{faults:new Date().toISOString(),requests:new Date().toISOString()});
  const now=new Date().toISOString();
  if(pageName==="faults")current.faults=now;
  if(pageName==="work")current.requests=now;
  map[key]=current;
  storageSet(localStorage,NOTIFICATION_STATE_KEY,JSON.stringify(map));
}
function newNotificationCounts(){
  if(!s.user)return {faults:0,requests:0};
  const seen=notificationSeenState();
  const currentName=s.user?.name||"";
  const faults=visibleFaults()
    .filter(fault=>fault.status!=="done")
    .filter(fault=>new Date(fault.createdAt)>new Date(seen.faults))
    .filter(fault=>(fault.openedBy||fault.createdBy||"")!==currentName)
    .length;
  const requests=visibleWorkItems()
    .filter(item=>item.kind==="request"&&["new","reviewing"].includes(item.status))
    .filter(item=>new Date(item.createdAt)>new Date(seen.requests))
    .filter(item=>(item.createdBy||"")!==currentName)
    .length;
  return {faults,requests};
}
function pageNotificationCount(pageName){
  const counts=newNotificationCounts();
  if(pageName==="faults")return counts.faults;
  if(pageName==="work")return counts.requests;
  return 0;
}
function notificationBadge(pageName){
  const count=pageNotificationCount(pageName);
  return count?`<span class="nav-notification" title="${count} yeni kayıt"><b>!</b><small>${count}</small></span>`:"";
}

function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
function opts(items,placeholder="Seçiniz",selected=""){
  const list=Array.isArray(items)?items:[];
  const first=`<option value="" ${selected===""?"selected":""} disabled>${esc(placeholder)}</option>`;
  return first+list.map(item=>`<option value="${esc(item)}" ${item===selected?"selected":""}>${esc(item)}</option>`).join("");
}
function fmtDate(value){
  const d=new Date(value);
  if(Number.isNaN(d.getTime()))return "-";
  return d.toLocaleString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
}
function durationMs(fault){
  const start=new Date(fault.createdAt).getTime();
  const end=fault.closedAt?new Date(fault.closedAt).getTime():Date.now();
  return Math.max(0,end-start);
}
function durationText(fault){
  const totalMinutes=Math.floor(durationMs(fault)/60000);
  const days=Math.floor(totalMinutes/1440);
  const hours=Math.floor((totalMinutes%1440)/60);
  const minutes=totalMinutes%60;
  if(days>0)return `${days} gün ${hours} sa ${minutes} dk`;
  if(hours>0)return `${hours} sa ${minutes} dk`;
  return `${minutes} dk`;
}
function shiftInfo(date=new Date()){
  const h=date.getHours();
  if(h<8)return {name:"00–08 Vardiyası",range:"00:00–08:00",startHour:0,endHour:8};
  if(h<16)return {name:"08–16 Vardiyası",range:"08:00–16:00",startHour:8,endHour:16};
  return {name:"16–00 Vardiyası",range:"16:00–00:00",startHour:16,endHour:24};
}
function isInCurrentShift(fault){
  const now=new Date();
  const shift=shiftInfo(now);
  const start=new Date(now);
  start.setHours(shift.startHour,0,0,0);
  const end=new Date(start);
  if(shift.endHour===24)end.setDate(end.getDate()+1);
  end.setHours(shift.endHour===24?0:shift.endHour,0,0,0);
  const created=new Date(fault.createdAt);
  return created>=start&&created<end;
}
function liveDateTime(){
  const now=new Date();
  return {
    date:now.toLocaleDateString("tr-TR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"}),
    time:now.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit",second:"2-digit"}),
    shift:shiftInfo(now)
  };
}
function clockBlock(){
  const x=liveDateTime();
  const shift=x.shift;
  const now=new Date();
  const next=nextShiftDate(now);
  const remaining=Math.max(0,Math.ceil((next-now)/60000));
  const remainingText=remaining>=60?`${Math.floor(remaining/60)} sa ${remaining%60} dk`:`${remaining} dk`;
  const factory=shiftFactoryName(userFactories()[0]||"1. Fabrika");
  const electrical=activeTeamMembers(factory,"Elektrik Bakım",now);
  const mechanical=activeTeamMembers(factory,"Mekanik Bakım",now);
  const shiftStart=new Date(now);shiftStart.setHours(shift.startHour,0,0,0);
  const shiftEnd=new Date(shiftStart);if(shift.endHour===24)shiftEnd.setDate(shiftEnd.getDate()+1);shiftEnd.setHours(shift.endHour===24?0:shift.endHour,0,0,0);
  const progress=Math.max(0,Math.min(100,Math.round((now-shiftStart)/(shiftEnd-shiftStart)*100)));
  return `<section class="pro-timebar rich-timebar">
    <div class="pro-time-main">
      <div class="pro-calendar-icon">▦</div>
      <div class="pro-date-copy"><small>BUGÜN</small><b id="liveDate">${esc(x.date)}</b><em>${esc(s.user?.name||"")} · ${esc(s.user?.role||"")}</em></div>
    </div>
    <div class="pro-time-divider"></div>
    <div class="pro-time-item"><span class="pro-time-icon">◷</span><div><small>CANLI SAAT</small><b id="liveTime">${esc(x.time)}</b><em>Yerel sistem saati</em></div></div>
    <div class="pro-time-divider"></div>
    <div class="pro-time-item shift-detail"><span class="pro-time-icon shift">⇄</span><div><small>AKTİF VARDİYA</small><b id="liveShift">${esc(shift.name)}</b><em>${esc(shift.range)} · %${progress} tamamlandı</em></div></div>
    <div class="pro-time-divider"></div>
    <div class="pro-time-item"><span class="pro-time-icon">→</span><div><small>SONRAKİ VARDİYA</small><b>${esc(nextShiftLabel(now))}</b><em>${remainingText} sonra</em></div></div>
    <div class="pro-time-divider"></div>
    <div class="pro-time-item crew-summary"><span class="pro-time-icon">♙</span><div><small>${esc(factory)} AKTİF BAKIM</small><b>${electrical.length+mechanical.length} personel</b><em>E: ${electrical.length} · M: ${mechanical.length}</em></div></div>
    <div class="pro-system-state"><i></i><span>Sistem aktif</span></div>
  </section>`;
}

function qrScanIcon(className=""){
  return `<svg class="qr-scan-icon ${esc(className)}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">

function faultSearchMatches(fault,query){
  if(!query)return true;
  const searchable=[
    fault.id,
    fault.factory,
    fault.line,
    fault.department,
    fault.machine,
    fault.type,
    fault.subject,
    fault.description,
    fault.openedBy,
    fault.assignedTo,
    ...(Array.isArray(fault.participants)?fault.participants:[])
  ].join(" ").toLocaleLowerCase("tr-TR");
  return searchable.includes(query.toLocaleLowerCase("tr-TR"));
}
function faultSortValue(fault,key){
  if(key==="duration")return durationMs(fault);
  if(key==="createdAt")return new Date(fault.createdAt).getTime()||0;
  return String(fault?.[key]||"").toLocaleLowerCase("tr-TR");
}
function sortFaultRecords(items){
  const direction=s.faultSortDir==="asc"?1:-1;
  const key=s.faultSortKey||"createdAt";
  return [...items].sort((a,b)=>{
    const av=faultSortValue(a,key),bv=faultSortValue(b,key);
    if(typeof av==="number"&&typeof bv==="number")return (av-bv)*direction;
    const compared=String(av).localeCompare(String(bv),"tr",{numeric:true,sensitivity:"base"});
    if(compared)return compared*direction;
    return (new Date(b.createdAt)-new Date(a.createdAt));
  });
}

function ensureFaultPersonnel(){
  let changed=false;
  s.faults.forEach((fault,index)=>{
    if(!fault.openedBy){
      fault.openedBy=deterministicPerson(DEMO_FAULT_OPENERS,fault.id,index);
      changed=true;
    }
    if(!Object.prototype.hasOwnProperty.call(fault,"assignedTo")||!fault.assignedTo||fault.assignedTo==="Bakım Ekibi"){
      const people=activeMaintenanceForFault(fault);
      fault.assignedTo=deterministicPerson(people,fault.id,index+7)||"Atama Bekliyor";
      fault.assignmentState="pending";
      fault.claimedBy="";
      fault.claimedAt=null;
      changed=true;
    }
  });
  if(changed)save();
}

function canManageShiftTeam(team){

function chartConfig(chartId){

function rangeStartDateFor(chartId){
  const cfg=chartConfig(chartId);

  const n=Math.max(1,Number(cfg.value)||1);
  if(cfg.unit==="hour")return new Date(now.getTime()-n*3600000);
  if(cfg.unit==="shift")return new Date(now.getTime()-n*8*3600000);
  if(cfg.unit==="day")return new Date(now.getTime()-n*86400000);
  const d=new Date(now);d.setMonth(d.getMonth()-n);return d;
}

function periodLabel(d,chartId){
  const unit=chartConfig(chartId).unit;
  if(unit==="hour")return d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
  if(unit==="shift"){
    const h=d.getHours();
    const name=h<8?"00–08":h<16?"08–16":"16–00";
    return `${d.toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit"})} ${name}`;
  }
  if(unit==="day")return d.toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit"});
  return d.toLocaleDateString("tr-TR",{month:"short",year:"2-digit"});
}
function trendDataFor(base,chartId){
  const cfg=chartConfig(chartId);
  const a=chartRangeFaultsFor(base,chartId);
  const now=new Date();
  const n=Math.max(1,Number(cfg.value)||1);
  const buckets=[];
  if(cfg.unit==="hour"){
    for(let i=n-1;i>=0;i--){
      const start=new Date(now.getTime()-(i+1)*3600000),end=new Date(now.getTime()-i*3600000);
      buckets.push({start,end,label:periodLabel(end,chartId),value:0});
    }
  }else if(cfg.unit==="shift"){
    for(let i=n-1;i>=0;i--){
      const end=new Date(now.getTime()-i*8*3600000),start=new Date(end.getTime()-8*3600000);
      buckets.push({start,end,label:periodLabel(start,chartId),value:0});
    }
  }else if(cfg.unit==="day"){
    for(let i=n-1;i>=0;i--){
      const start=new Date(now);start.setDate(now.getDate()-i);start.setHours(0,0,0,0);
      const end=new Date(start);end.setDate(start.getDate()+1);
      buckets.push({start,end,label:periodLabel(start,chartId),value:0});
    }
  }else{
    for(let i=n-1;i>=0;i--){
      const start=new Date(now.getFullYear(),now.getMonth()-i,1);
      const end=new Date(now.getFullYear(),now.getMonth()-i+1,1);
      buckets.push({start,end,label:periodLabel(start,chartId),value:0});
    }
  }
  a.forEach(f=>{
    const t=new Date(f.createdAt);
    const b=buckets.find(x=>t>=x.start&&t<x.end);
    if(b)b.value++;
  });
  return buckets;
}
function chartLabelParts(label){
  const raw=String(label??"");
  // Vardiya etiketlerini: "25.07 08-16" veya benzeri ise iki satıra böl.
  const shiftMatch=raw.match(/^(.{4,12}?)\s+(0?0[-–]0?8|0?8[-–]16|16[-–]24|Vardiya\s*\d+)$/i);
  if(shiftMatch)return [shiftMatch[1],shiftMatch[2]];
  // Uzun tarih-vardiya etiketlerini son boşluktan ikiye böl.
  if(raw.length>12&&raw.includes(" ")){
    const parts=raw.split(/\s+/);
    if(parts.length>=2)return [parts.slice(0,-1).join(" "),parts[parts.length-1]];
  }
  return [raw];
}
function chartShortLabel(label,max=14){
  const raw=String(label??"");
  return raw.length>max?raw.slice(0,max-1)+"…":raw;
}
function lineChartSVG(data,title){
  const safe=data?.length?data:[{label:"Kayıt Yok",value:0}];
  const W=760,H=310,L=48,R=22,T=24,B=safe.length>6?92:64;
  const innerW=W-L-R,innerH=H-T-B,max=Math.max(1,...safe.map(x=>Number(x.value)||0));
  const step=safe.length>1?innerW/(safe.length-1):innerW;
  const points=safe.map((x,i)=>({
    x:L+(safe.length===1?innerW/2:i*step),
    y:T+innerH-(Number(x.value)||0)/max*innerH,
    ...x
  }));
  const path=points.map((p,i)=>(i?"L":"M")+p.x.toFixed(1)+" "+p.y.toFixed(1)).join(" ");
  const rotate=safe.length>6;
  const grid=[0,.25,.5,.75,1].map(r=>{
    const y=T+innerH-innerH*r;
    return `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" class="chart-grid-line"/>
      <text x="${L-8}" y="${y+4}" text-anchor="end" class="chart-y-label">${Math.round(max*r)}</text>`;
  }).join("");
  const labels=points.map((p,i)=>{
    const parts=chartLabelParts(p.label);

      </g>`;
    }
    return `<g transform="translate(${p.x},${T+innerH+18})">
      <title>${esc(String(p.label))}</title>
      <text text-anchor="middle" class="chart-x-label">${esc(label)}</text>
      ${parts[1]?`<text y="13" text-anchor="middle" class="chart-x-label secondary">${esc(chartShortLabel(parts[1],12))}</text>`:""}
    </g>`;
  }).join("");
  return `<div class="chartbox responsive-chartbox">${title?`<h4>${esc(title)}</h4>`:""}
    <div class="chart-scroll-area">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title||"Çizgi grafik")}">
        ${grid}
        <path d="${path}" class="chart-line-path"/>
        ${points.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="4.5" class="chart-point"><title>${esc(String(p.label))}: ${p.value}</title></circle>`).join("")}
        ${labels}
      </svg>
    </div>
  </div>`;
}
function barChartSVG(data,title){
  const safe=data?.length?data:[{label:"Kayıt Yok",value:0}];
  const W=760,H=330,L=52,R=20,T=22,B=safe.length>5?105:72;
  const innerW=W-L-R,innerH=H-T-B,max=Math.max(1,...safe.map(x=>Number(x.value)||0));
  const slot=innerW/safe.length,barW=Math.max(12,Math.min(58,slot*.58));
  const rotate=safe.length>5||safe.some(x=>String(x.label).length>12);
  const grid=[0,.25,.5,.75,1].map(r=>{
    const y=T+innerH-innerH*r;
    return `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" class="chart-grid-line"/>
      <text x="${L-8}" y="${y+4}" text-anchor="end" class="chart-y-label">${Math.round(max*r)}</text>`;
  }).join("");
  const bars=safe.map((d,i)=>{
    const value=Number(d.value)||0;
    const h=value/max*innerH;
    const x=L+i*slot+(slot-barW)/2,y=T+innerH-h,cx=x+barW/2;
    const parts=chartLabelParts(d.label);
    const primary=chartShortLabel(parts[0],rotate?13:16);
    const labelMarkup=rotate
      ? `<g transform="translate(${cx},${T+innerH+17}) rotate(-42)">
          <title>${esc(String(d.label))}</title>
          <text text-anchor="end" class="chart-x-label">${esc(primary)}</text>
          ${parts[1]?`<text y="13" text-anchor="end" class="chart-x-label secondary">${esc(chartShortLabel(parts[1],12))}</text>`:""}
        </g>`
      : `<g transform="translate(${cx},${T+innerH+18})">
          <title>${esc(String(d.label))}</title>
          <text text-anchor="middle" class="chart-x-label">${esc(primary)}</text>
          ${parts[1]?`<text y="13" text-anchor="middle" class="chart-x-label secondary">${esc(chartShortLabel(parts[1],12))}</text>`:""}
        </g>`;
    return `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="7" class="chart-bar"><title>${esc(String(d.label))}: ${value}</title></rect>
      <text x="${cx}" y="${Math.max(T+12,y-7)}" text-anchor="middle" class="chart-value-label">${value}</text>
      ${labelMarkup}`;
  }).join("");
  return `<div class="chartbox responsive-chartbox">${title?`<h4>${esc(title)}</h4>`:""}
    <div class="chart-scroll-area">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title||"Sütun grafik")}">
        ${grid}${bars}
      </svg>
    </div>
  </div>`;

function shiftPerformanceCard(allShiftFaults){
  const completed=allShiftFaults.filter(x=>x.status==="done").length;
  const active=allShiftFaults.filter(x=>x.status!=="done").length;
  const stopped=allShiftFaults.filter(x=>x.stopped).length;
  const total=allShiftFaults.length;
  const completionRate=total?Math.round(completed/total*100):100;
  const avgMinutes=completed.length===0?0:0;
  const resolved=allShiftFaults.filter(x=>x.status==="done");
  const avgResolution=resolved.length?Math.round(resolved.reduce((sum,x)=>sum+durationMs(x)/60000,0)/resolved.length):0;
  const score=Math.max(0,Math.min(100,Math.round(completionRate-(stopped*8)+(total?10:0))));
  return `<section class="shift-performance">
    <div class="performance-head">
      <div><span>ANLIK VARDİYA PERFORMANSI</span><h2>${score}<small>/100</small></h2></div>
      <div class="score-ring" style="--score:${score}"><b>${score}%</b></div>
    </div>

    <div class="performance-metrics">

      <div><small>Üretim Duruşu</small><b>${stopped}</b></div>

}

<script>
const SHIFT_LABELS=["00-08","08-16","16-24"];
const SHIFT_OVERRIDE_KEY="etilismart_shift_overrides_v1";
let SHIFT_OVERRIDES=storageJsonRecord(localStorage,SHIFT_OVERRIDE_KEY,{});
function shiftOverrideKey(factory,team,weekOffset,personId,dayIndex){
  return [shiftFactoryName(factory),team,shiftWeekKey(weekOffset),personId,dayIndex].join("|");
}
function getShiftOverride(factory,team,weekOffset,personId,dayIndex){
  return SHIFT_OVERRIDES[shiftOverrideKey(factory,team,weekOffset,personId,dayIndex)]||"";
}
function setShiftOverride(factory,team,weekOffset,personId,dayIndex,value){
  SHIFT_OVERRIDES[shiftOverrideKey(factory,team,weekOffset,personId,dayIndex)]=value;
  storageSet(localStorage,SHIFT_OVERRIDE_KEY,JSON.stringify(SHIFT_OVERRIDES));
}
const SHIFT_DAY_NAMES=["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"];

function weekMonday(offset=0){
  const d=new Date();
  const day=(d.getDay()+6)%7;
  d.setHours(0,0,0,0);
  d.setDate(d.getDate()-day+offset*7);
  return d;
}
function dateKeyLocal(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function shiftWeekKey(offset=0){return dateKeyLocal(weekMonday(offset))}
function shiftHash(value){
  let h=2166136261;
  for(const ch of String(value)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}
  return Math.abs(h>>>0);
}

function shiftFactoryName(factory){
  return factory==="2. Fabrika A Blok"||factory==="2. Fabrika B Blok"?"2. Fabrika":factory;
}
function shiftFactoryOptions(){
  if(permissions().viewAllShiftFactories)return ["1. Fabrika","2. Fabrika"];
  const allowed=userFactories().map(shiftFactoryName);
  return [...new Set(allowed)].filter(f=>f==="1. Fabrika"||f==="2. Fabrika");
}
function currentMaintenanceCrewForUser(){
  const factory=shiftFactoryName(userFactories()[0]||"1. Fabrika");
  return {
    factory,
    electrical:activeTeamMembers(factory,"Elektrik Bakım").map(x=>x.name),
    mechanical:activeTeamMembers(factory,"Mekanik Bakım").map(x=>x.name)
  };
}
function shiftFactoryMatches(personFactories,shiftFactory){
  if(shiftFactory==="2. Fabrika"){
    return personFactories.includes("2. Fabrika A Blok")||
           personFactories.includes("2. Fabrika B Blok")||
           personFactories.includes("2. Fabrika");
  }
  return personFactories.includes(shiftFactory);
}

function allMaintenanceAccounts(){
  return appUserEntries()
    .filter(([,u])=>u.role==="Bakım Personeli"&&u.team)
    .map(([id,u])=>({id,name:u.name,team:u.team,factories:u.factories}));
}
function personnelForFactory(factory,team){
  return allMaintenanceAccounts().filter(p=>shiftFactoryMatches(p.factories,factory)&&p.team===team);
}
function weekRangeText(offset=0){
  const start=weekMonday(offset),end=new Date(start);end.setDate(end.getDate()+6);
  const a=start.toLocaleDateString("tr-TR",{day:"2-digit",month:"short"});
  const b=end.toLocaleDateString("tr-TR",{day:"2-digit",month:"short",year:"numeric"});
  return `${a} – ${b}`;
}
function currentShiftLabel(date=new Date()){
  return shiftLabelForDate(date);
}
function shiftClass(value){
  if(value==="00-08")return "night";
  if(value==="08-16")return "morning";
  return "evening";
}

/*
  Haftalık dağılım:
  - Her gün 3 vardiya vardır.
  - Ekipte en az 3 kişi bulunduğu sürece her vardiyada en az 1 kişi olur.
  - Fazla personeller vardiyalara dengeli dağıtılır.
  - Dağılım hafta bazında deterministik olarak döner.
*/
function buildTeamWeekSchedule(factory,team,weekOffset=0){
  const people=personnelForFactory(factory,team);
  const monday=weekMonday(weekOffset);
  const weekSeed=shiftHash(factory+team+shiftWeekKey(weekOffset));

  const rows=people.map(p=>({ ...p, days:[] }));

  for(let dayIndex=0;dayIndex<7;dayIndex++){
    const date=new Date(monday);date.setDate(date.getDate()+dayIndex);

    // Haftalık ve günlük dönüş; isim sırası sabit kalmaz.
    const rotated=[...people].sort((a,b)=>{
      const ha=shiftHash(a.id+weekSeed+dayIndex);
      const hb=shiftHash(b.id+weekSeed+dayIndex);
      return ha-hb;
    });

    const assignments={};
    rotated.forEach((person,index)=>{
      // İlk üç kişi üç farklı vardiyaya zorunlu atanır.
      // Diğerleri dengeli biçimde vardiyalara eklenir.
      const shiftIndex=index%3;
      assignments[person.id]=SHIFT_LABELS[shiftIndex];
    });

    rows.forEach(row=>{
      const automatic=assignments[row.id]||SHIFT_LABELS[(shiftHash(row.id+dayIndex+weekSeed))%3];
      const override=getShiftOverride(factory,team,weekOffset,row.id,dayIndex);
      row.days.push({date,shift:override||automatic});
    });
  }
  return rows;
}
function buildTeamMonthSchedule(factory,team,monthDate){
  const selected=new Date(monthDate);
  const first=new Date(selected.getFullYear(),selected.getMonth(),1);
  const dayCount=new Date(selected.getFullYear(),selected.getMonth()+1,0).getDate();
  const dates=Array.from({length:dayCount},(_,index)=>new Date(selected.getFullYear(),selected.getMonth(),index+1));
  const rows=personnelForFactory(factory,team).map(person=>({...person,days:[]}));
  const weekCache=new Map();
  dates.forEach(date=>{
    const offset=weekOffsetForDate(date);
    if(!weekCache.has(offset))weekCache.set(offset,buildTeamWeekSchedule(factory,team,offset));
    const dayIndex=(date.getDay()+6)%7;
    rows.forEach(row=>{
      const weekly=weekCache.get(offset).find(person=>person.id===row.id);
      row.days.push({date,shift:weekly?.days[dayIndex]?.shift||"",weekOffset:offset,dayIndex});
    });
  });
  return {dates,rows};
}
function shiftMonthText(monthDate){
  return new Date(monthDate).toLocaleDateString("tr-TR",{month:"long",year:"numeric"});
}
function activeTeamMembers(factory,team,date=new Date()){
  const dayIndex=(date.getDay()+6)%7;
  const shift=currentShiftLabel(date);
  const offset=weekOffsetForDate(date);
  return buildTeamWeekSchedule(factory,team,offset)
    .filter(row=>row.days[dayIndex]?.shift===shift);
}
function activeMaintenanceForFault(fault,date=new Date()){
  const team=maintenanceDisciplineForFault(fault);
  return activeTeamMembers(shiftFactoryName(fault.factory),team,date).map(p=>p.name);
}
function availableMaintenanceForFault(fault){
  const active=activeMaintenanceForFault(fault);
  return active.length?active:maintenanceOptionsForFault(fault);
}
function personnelSelectOptions(fault){
  const current=fault.assignedTo||"Atama Bekliyor";
  const active=availableMaintenanceForFault(fault);
  const all=maintenanceOptionsForFault(fault);
  const merged=[...new Set(["Atama Bekliyor",...active,...all])];
  return merged.map(name=>{
    const duty=active.includes(name)?" • Aktif vardiyada":"";
    return `<option value="${esc(name)}" ${name===current?"selected":""}>${esc(name+duty)}</option>`;
  }).join("");
}
function shiftSchedulePage(){
  const factories=shiftFactoryOptions();
  s.shiftFactory=shiftFactoryName(s.shiftFactory);
  if(!factories.includes(s.shiftFactory))s.shiftFactory=factories[0]||"1. Fabrika";
  if(!["Elektrik Bakım","Mekanik Bakım"].includes(s.shiftTeam))s.shiftTeam="Elektrik Bakım";

  const rows=buildTeamWeekSchedule(s.shiftFactory,s.shiftTeam,s.shiftWeekOffset)
    .filter(r=>!s.shiftSearch||r.name.toLocaleLowerCase("tr-TR").includes(s.shiftSearch.toLocaleLowerCase("tr-TR")));
  const monthly=s.shiftViewMode==="monthly";
  const monthSchedule=buildTeamMonthSchedule(s.shiftFactory,s.shiftTeam,s.shiftMonthDate);
  const monthRows=monthSchedule.rows.filter(r=>!s.shiftSearch||r.name.toLocaleLowerCase("tr-TR").includes(s.shiftSearch.toLocaleLowerCase("tr-TR")));

  const monday=weekMonday(s.shiftWeekOffset);
  const dates=Array.from({length:7},(_,i)=>{const d=new Date(monday);d.setDate(d.getDate()+i);return d});

  const coverage=dates.map((d,dayIndex)=>{
    const counts={};
    SHIFT_LABELS.forEach(sh=>counts[sh]=rows.filter(r=>r.days[dayIndex]?.shift===sh).length);
    return counts;
  });
  const minimumCoverage=Math.min(...coverage.flatMap(c=>SHIFT_LABELS.map(sh=>c[sh])));
  const shiftTable=monthly?`<section class="shift-table-wrap monthly-shift-wrap">
    <table class="shift-table monthly-shift-table">
      <thead><tr><th>Personel</th>${monthSchedule.dates.map(date=>`<th class="${dateKeyLocal(date)===dateKeyLocal(new Date())?"today":""}"><span>${date.getDate()}</span><small>${SHIFT_DAY_NAMES[(date.getDay()+6)%7]}</small></th>`).join("")}</tr></thead>
      <tbody>${monthRows.map(row=>`<tr><td><button class="shift-person-button" data-shift-person="${esc(row.id)}"><i>${esc(row.name.charAt(0))}</i><span><b>${esc(row.name)}</b><small>ID: ${esc(row.id)}</small></span></button></td>${row.days.map(day=>`<td>${canManageShiftTeam(s.shiftTeam)?`<select class="shift-assignment-select monthly ${shiftClass(day.shift)} ${dateKeyLocal(day.date)===dateKeyLocal(new Date())?"today":""}" data-shift-person-id="${esc(row.id)}" data-shift-day="${day.dayIndex}" data-shift-week-offset="${day.weekOffset}">${SHIFT_LABELS.map(label=>`<option value="${label}" ${day.shift===label?"selected":""}>${label}</option>`).join("")}</select>`:`<span class="shift-cell ${shiftClass(day.shift)}">${esc(day.shift)}</span>`}</td>`).join("")}</tr>`).join("")||`<tr><td colspan="${monthSchedule.dates.length+1}"><div class="compact-empty"><p>Bu ekipte personel bulunamadı.</p></div></td></tr>`}</tbody>
    </table>
  </section>`:`<section class="shift-table-wrap">

"QRMath":function(module,exports,require){
var QRMath = {

	glog : function(n) {
	
		if (n < 1) {
			throw new Error("glog(" + n + ")");
		}
		
		return QRMath.LOG_TABLE[n];
	},
	
	gexp : function(n) {
	
		while (n < 0) {
			n += 255;
		}
	
		while (n >= 256) {
			n -= 255;
		}
	
		return QRMath.EXP_TABLE[n];
	},
	
	EXP_TABLE : new Array(256),
	
	LOG_TABLE : new Array(256)

};
	
for (var i = 0; i < 8; i++) {
	QRMath.EXP_TABLE[i] = 1 << i;
}
for (var i = 8; i < 256; i++) {
	QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4]
		^ QRMath.EXP_TABLE[i - 5]
		^ QRMath.EXP_TABLE[i - 6]
		^ QRMath.EXP_TABLE[i - 8];
}
for (var i = 0; i < 255; i++) {
	QRMath.LOG_TABLE[QRMath.EXP_TABLE[i] ] = i;
}

module.exports = QRMath;

"QRPolynomial":function(module,exports,require){
var QRMath = require('./QRMath');

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};

module.exports = QRPolynomial;

"QRBitBuffer":function(module,exports,require){
function QRBitBuffer() {
	this.buffer = [];
	this.length = 0;
}

QRBitBuffer.prototype = {

	get : function(index) {
		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},
	
	getLengthInBits : function() {
		return this.length;
	},
	
	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}
	
		this.length++;
	}
};

module.exports = QRBitBuffer;

    G18 : (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0),
    G15_MASK : (1 << 14) | (1 << 12) | (1 << 10)    | (1 << 4) | (1 << 1),

    getBCHTypeInfo : function(data) {
        var d = data << 10;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) >= 0) {
            d ^= (QRUtil.G15 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) ) );    
        }
        return ( (data << 10) | d) ^ QRUtil.G15_MASK;
    },

    getBCHTypeNumber : function(data) {
        var d = data << 12;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) >= 0) {
            d ^= (QRUtil.G18 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) ) );    
        }
        return (data << 12) | d;
    },

    getBCHDigit : function(data) {

        var digit = 0;

        while (data !== 0) {
            digit++;
            data >>>= 1;
        }

        return digit;
    },

        return QRUtil.PATTERN_POSITION_TABLE[typeNumber - 1];
    },

        switch (maskPattern) {
            
        case QRMaskPattern.PATTERN000 : return (i + j) % 2 === 0;
        case QRMaskPattern.PATTERN001 : return i % 2 === 0;
        case QRMaskPattern.PATTERN010 : return j % 3 === 0;
        case QRMaskPattern.PATTERN011 : return (i + j) % 3 === 0;
        case QRMaskPattern.PATTERN100 : return (Math.floor(i / 2) + Math.floor(j / 3) ) % 2 === 0;
        case QRMaskPattern.PATTERN101 : return (i * j) % 2 + (i * j) % 3 === 0;
        case QRMaskPattern.PATTERN110 : return ( (i * j) % 2 + (i * j) % 3) % 2 === 0;
        case QRMaskPattern.PATTERN111 : return ( (i * j) % 3 + (i + j) % 2) % 2 === 0;

        default :
            throw new Error("bad maskPattern:" + maskPattern);
        }
    },

    getErrorCorrectPolynomial : function(errorCorrectLength) {

        var a = new QRPolynomial([1], 0);

        for (var i = 0; i < errorCorrectLength; i++) {
            a = a.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0) );
        }

        return a;

        if (1 <= type && type < 10) {

            // 1 - 9

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 10;
            case QRMode.MODE_ALPHA_NUM  : return 9;
            case QRMode.MODE_8BIT_BYTE  : return 8;
            case QRMode.MODE_KANJI      : return 8;
            default :

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 12;
            case QRMode.MODE_ALPHA_NUM  : return 11;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 10;
            default :
                throw new Error("mode:" + mode);
            }

        } else if (type < 41) {

            // 27 - 40

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 14;
            case QRMode.MODE_ALPHA_NUM  : return 13;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 12;
            default :
                throw new Error("mode:" + mode);
            }

        } else {
            throw new Error("type:" + type);
        }
    },

    getLostPoint : function(qrCode) {
        
        var moduleCount = qrCode.getModuleCount();
        var lostPoint = 0;
        var row = 0; 
        var col = 0;

        
        // LEVEL1
        
        for (row = 0; row < moduleCount; row++) {

            for (col = 0; col < moduleCount; col++) {

                var sameCount = 0;
                var dark = qrCode.isDark(row, col);

                for (var r = -1; r <= 1; r++) {

                    if (row + r < 0 || moduleCount <= row + r) {
                        continue;
                    }

                    for (var c = -1; c <= 1; c++) {

                        if (col + c < 0 || moduleCount <= col + c) {
                            continue;
                        }

                        if (r === 0 && c === 0) {
                            continue;
                        }

                        if (dark === qrCode.isDark(row + r, col + c) ) {
                            sameCount++;
                        }
                    }
                }

                if (sameCount > 5) {
                    lostPoint += (3 + sameCount - 5);
                }
            }
        }

        // LEVEL2

        for (row = 0; row < moduleCount - 1; row++) {
            for (col = 0; col < moduleCount - 1; col++) {
                var count = 0;
                if (qrCode.isDark(row,     col    ) ) count++;
                if (qrCode.isDark(row + 1, col    ) ) count++;
                if (qrCode.isDark(row,     col + 1) ) count++;
                if (qrCode.isDark(row + 1, col + 1) ) count++;
                if (count === 0 || count === 4) {
                    lostPoint += 3;
                }
            }
        }

        // LEVEL3

        for (row = 0; row < moduleCount; row++) {
            for (col = 0; col < moduleCount - 6; col++) {
                if (qrCode.isDark(row, col) && 
                        !qrCode.isDark(row, col + 1) && 
                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {
                    lostPoint += 40;
                }
            }
        }

        // LEVEL4
        
        var darkCount = 0;

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }
        
        var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;

        return lostPoint;       
    }

};

module.exports = QRUtil;

					totalDataCount += rsBlocks[i].dataCount;
				}

				for (var x = 0; x < this.dataList.length; x++) {
					var data = this.dataList[x];
					buffer.put(data.mode, 4);
					buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
					data.write(buffer);

				if (buffer.getLengthInBits() <= totalDataCount * 8)

				this.modules[row][col] = null;//(col + row) % 3;
			}
		}
	
		this.setupPositionProbePattern(0, 0);
		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);
		this.setupPositionAdjustPattern();
		this.setupTimingPattern();

			for (var col = 0; col < this.modules[row].length; col++) {
	
				var x = col * cs;
				var dark = this.modules[row][col];
			
				if (dark) {
					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);

				if (this.modules[row][col] !== null) {
					continue;

				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||

			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {

		}

		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}

		this.modules[this.moduleCount - 8][8] = (!test);

		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);

						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}
