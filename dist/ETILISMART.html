<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ETİLİSMART</title><style>
:root{--y:#f2b21a;--d:#15181c;--m:#6b7280;--bg:#f4f6f8;--w:#fff;--l:#e5e7eb;--g:#1f9d63;--r:#d64545}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--d)}button,input,select,textarea{font:inherit}.top{height:68px;background:var(--d);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font-weight:900}.brand span{color:var(--y)}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 68px)}aside{background:#fff;border-right:1px solid var(--l);padding:18px}.nav{width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:10px;margin-bottom:8px}.nav:hover,.nav.active{background:#fff7dc;font-weight:700}main{padding:24px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.head h1{margin:0}.head p{margin:6px 0 0;color:var(--m)}.primary{border:0;background:var(--y);font-weight:800;padding:11px 16px;border-radius:10px}.secondary{border:1px solid var(--l);background:#fff;padding:10px 14px;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.06)}.label{font-size:13px;color:var(--m)}.value{font-size:30px;font-weight:900;margin-top:8px}.section{margin-top:20px}.table{overflow:auto;background:#fff;border:1px solid var(--l);border-radius:16px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:13px;border-bottom:1px solid var(--l);text-align:left}th{font-size:12px;color:var(--m);background:#fafafa}.status{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.open{background:#fff0f0;color:#b52d2d}.progress{background:#fff7dc;color:#8a6400}.done{background:#e7f7ef;color:#147348}.form{max-width:850px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:7px}.full{grid-column:1/-1}label{font-size:13px;font-weight:700}input,select,textarea{border:1px solid #d9dee5;border-radius:10px;padding:11px;background:#fff}textarea{min-height:110px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#121519,#282d33);padding:20px}.loginbox{width:min(430px,100%);background:#fff;border-radius:22px;padding:30px}.logo{width:58px;height:58px;background:var(--y);border-radius:15px;display:grid;place-items:center;font-weight:900;margin-bottom:16px}.notice{padding:12px;background:#eef6ff;color:#1f5f9f;border-radius:10px;font-size:13px;margin:14px 0}.loginbox .field{margin-bottom:14px}.loginbox .primary{width:100%}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:none}.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){main{padding:16px}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.head{align-items:flex-start;flex-direction:column;gap:12px}}
.stop{color:#c62828}.field small{color:var(--m);font-size:12px}.check{justify-content:flex-end;padding-bottom:10px}.check label{display:flex;align-items:center;gap:8px}.check input{width:18px;height:18px}

.livebox{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:18px;box-shadow:var(--shadow)}

.login-error{min-height:20px;color:#c62828;font-size:13px;margin-bottom:8px}
.layoutfilters{display:grid;grid-template-columns:220px 220px 1fr;gap:16px;align-items:end;margin-bottom:18px}

.chartgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:18px 0}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}

.chart-range{display:grid;grid-template-columns:220px 180px 1fr;gap:14px;align-items:end;margin:18px 0}

.section-title-row{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:10px}

.workshop-table{min-width:1180px}.workshop-sort-button{display:flex;align-items:center;justify-content:space-between;gap:5px;width:100%;padding:0;border:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}.workshop-sort-button.active{color:#936800}.workshop-detail-row{cursor:pointer}.workshop-detail-row:hover{background:#fff9e9}.workshop-detail-row td small{display:block;margin-top:3px;color:#7d8992}
.workshop-status{display:inline-flex;padding:6px 8px;border-radius:999px;background:#eef2f4;color:#5f6d76;font-size:7px;font-weight:900}.workshop-status.done,.workshop-status.approved{background:#e7f4ec;color:#287047}.workshop-status.progress{background:#fff1cf;color:#876212}.workshop-status.rejected{background:#fde8e8;color:#a23840}
.workshop-detail-modal{width:min(980px,96vw);max-height:93vh;overflow:auto}.workshop-detail-hero{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.workshop-detail-hero>div{padding:11px;border:1px solid #dfe6ea;border-radius:11px;background:#fafcfd}.workshop-detail-hero small,.workshop-detail-hero b{display:block}.workshop-detail-hero small{font-size:7px;color:#77858e}.workshop-detail-hero b{margin-top:4px;font-size:10px}
.workshop-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.workshop-detail-grid>section{padding:14px;border:1px solid #e0e6ea;border-radius:13px;background:#fff}.workshop-detail-grid>section>span{font-size:7px;font-weight:900;color:#9a700c}.workshop-detail-grid p{font-size:8.5px;line-height:1.5;color:#53616a}.workshop-drawing-link,.workshop-file-name{display:inline-flex;margin-top:7px}.workshop-file-name{font-size:8px;color:#4e748d}.workshop-file-name.empty{color:#929ba2}

.operator-head{align-items:center}
.operator-new-btn{font-size:16px;padding:13px 18px}
.operator-grid{margin-top:18px}

  .operator-head{align-items:stretch}
  .operator-new-btn{width:100%}

.management-section{margin:24px 0}

.chart-panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}

/* QR Kod eklentisi */
.qr-scan-button,.machine-qr-button{border:0;border-radius:11px;background:#111;color:#fff;font-weight:800;cursor:pointer}
.qr-scan-button{padding:11px 16px}
.machine-qr-button{width:auto!important;min-width:52px!important;padding:0 12px!important;font-size:13px!important;background:var(--yellow,#f5b800)!important;color:#111!important}
.modal-head-actions{display:flex;gap:8px;align-items:center}
.qr-modal{width:min(720px,96vw)}
.qr-generator-layout{display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:center}
.qr-code-box{width:250px;min-height:250px;padding:15px;border:1px solid var(--line);border-radius:16px;background:#fff;display:grid;place-items:center}
.qr-code-box img,.qr-code-box canvas{max-width:220px!important;height:auto!important}
.qr-help h3{margin-top:0}.qr-help p{color:var(--m);line-height:1.55}
.qr-reader{width:100%;max-width:480px;margin:0 auto;border-radius:14px;overflow:hidden}
.qr-message{padding:12px;text-align:center;color:var(--m)}
.qr-manual{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);display:grid;gap:8px}
.qr-manual label{font-weight:700;font-size:13px}
.qr-manual textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical}
.qr-filled-info:empty{display:none}.qr-filled-info{margin:0 0 12px;padding:11px 14px;border-radius:11px;background:#e8f7ee;color:#16754d;font-weight:700;font-size:13px}
@media(max-width:680px){
  .qr-generator-layout{grid-template-columns:1fr}
  .qr-code-box{margin:auto}
  .head .qr-scan-button{width:100%;margin-top:10px}
}
@media print{
  body *{visibility:hidden!important}
  .qr-modal,.qr-modal *{visibility:visible!important}
  .qr-modal{position:absolute;left:0;top:0;width:100%;box-shadow:none}
  .qr-close,#printQr,.qr-help p{display:none!important}
}

.qr-machine-hero{display:flex;gap:16px;align-items:center;padding:18px;border-radius:16px;background:var(--soft,#f7f7f7);margin-bottom:16px}
.qr-machine-icon{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:var(--yellow,#f5b800);font-size:30px;color:#111}
.qr-machine-hero h3{margin:8px 0 4px;font-size:22px}.qr-machine-hero p{margin:0;color:var(--m)}
.qr-machine-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qr-machine-grid .info-card{padding:14px;border:1px solid var(--line);border-radius:13px;background:#fff}
.qr-machine-grid .info-card span{display:block;color:var(--m);font-size:12px;margin-bottom:7px}

.home-action-buttons{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.qr-home-symbol{width:54px;height:54px;display:grid;place-items:center;border-radius:14px;background:#f5b800;color:#111;font-size:30px;font-weight:900;flex:0 0 auto}

 .home-action-buttons{width:100%}.home-action-buttons button{flex:1}
 .qr-home-card{align-items:flex-start;flex-wrap:wrap}.qr-home-card button{width:100%}
}

/* === ETİLİSMART PC PRO v1 === */
:root{
  --y:#efb51d;
  --y2:#ffcf52;
  --navy:#151c2b;
  --navy2:#202b40;
  --blue:#2579d8;
  --cyan:#1aa6b7;
  --green:#16a66a;
  --red:#e04454;
  --purple:#7657c8;
  --bg:#f2f5f9;
  --text:#202633;
}
html,body{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
body{background:linear-gradient(180deg,#eef2f7 0,#f7f9fc 380px,#f2f5f9 100%)}
.top{background:linear-gradient(100deg,var(--navy),var(--navy2));box-shadow:0 5px 20px rgba(17,25,39,.18)}
.brand{display:flex;align-items:baseline;gap:3px;font-size:20px;letter-spacing:-.4px}
.brand small{font-size:10px;font-weight:500;color:#b9c2d0;margin-left:12px;letter-spacing:.2px}
.layout{grid-template-columns:250px minmax(0,1fr)}
aside{background:#fff;border-right:1px solid #e1e6ed;padding:20px 14px;box-shadow:5px 0 20px rgba(24,34,50,.025)}
.aside-user{padding:14px;margin-bottom:15px;border-radius:14px;background:linear-gradient(135deg,#f7f8fb,#eef2f7)}
.aside-user b,.aside-user small{display:block}.aside-user small{margin-top:4px;color:#747e8c;font-size:11px}
.nav{display:flex;align-items:center;min-height:45px;font-size:13px;color:#56606f}
.nav:hover,.nav.active{background:linear-gradient(90deg,#fff1b6,#fff9df);color:#1d2430}
.aside-scope{margin-top:22px;padding:13px;border:1px solid #e3e7ed;border-radius:13px;background:#fafbfd}
.aside-scope small,.aside-scope b,.aside-scope span{display:block}.aside-scope small{font-size:9px;letter-spacing:.8px;color:#9299a3}.aside-scope b{font-size:11px;margin-top:6px}.aside-scope span{font-size:10px;color:#7a8390;margin-top:5px}
main{padding:28px 32px 40px;max-width:1600px;width:100%}
.head h1,.app-hero h1,.layout-hero h1{letter-spacing:-.7px}
.head h1{font-size:27px}.head p{font-size:13px}
.card,.line-preview-card,.trend-preview,.top-machines-card{border-color:#e0e5ec;box-shadow:0 7px 24px rgba(22,34,52,.055)}
.primary{background:linear-gradient(135deg,var(--y),var(--y2));color:#202020;box-shadow:0 5px 14px rgba(225,167,12,.2)}
.status.open{background:#ffe8eb;color:#b92739}.status.progress{background:#fff3cc;color:#876300}.status.done{background:#def6ea;color:#0e7045}
.pro-kpi.red{background:linear-gradient(145deg,#fff,#fff8f9)}
.pro-kpi.amber{background:linear-gradient(145deg,#fff,#fffbef)}
.pro-kpi.green{background:linear-gradient(145deg,#fff,#f3fff9)}
.pro-kpi.blue{background:linear-gradient(145deg,#fff,#f3f9ff)}
.top-machines-card{background:#fff;border:1px solid #e3e7ed;border-radius:21px;padding:18px;margin-top:20px}
.top-machine-list{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.top-machine-row{display:flex;align-items:center;gap:11px;border:1px solid #e6e9ee;background:#fbfcfd;border-radius:14px;padding:11px;text-align:left}
.top-machine-row:hover{border-color:#efbf3d;background:#fffbef}
.machine-rank{width:31px;height:31px;display:grid;place-items:center;border-radius:10px;background:#202a3d;color:#fff;font-size:12px;font-weight:900}
.machine-rank-copy{flex:1;min-width:0}.machine-rank-copy b,.machine-rank-copy small{display:block}.machine-rank-copy b{font-size:12px}.machine-rank-copy small{font-size:10px;color:#808894;margin:3px 0 7px}
.machine-rank-copy i{display:block;height:5px;background:#e9edf2;border-radius:999px;overflow:hidden}.machine-rank-copy em{display:block;height:100%;background:linear-gradient(90deg,#efb51d,#f06a49);border-radius:999px}
.top-machine-row strong{font-size:18px;color:#293246}

/* PC arıza tablosu: daha küçük ve tutarlı */
.table-wrap{padding:0!important;overflow:auto;background:#fff}
.table-wrap table{min-width:960px;table-layout:fixed;font-size:12px}
.table-wrap th{padding:11px 12px;font-size:10px;letter-spacing:.35px;text-transform:uppercase;background:#f5f7fa;color:#707987}
.table-wrap td{padding:11px 12px;font-size:12px;line-height:1.35;vertical-align:middle;overflow-wrap:anywhere}
.table-wrap td b{font-size:12px}.table-wrap td small{font-size:10.5px;color:#737c89}
.table-wrap th:nth-child(1),.table-wrap td:nth-child(1){width:135px}
.table-wrap th:nth-child(2),.table-wrap td:nth-child(2){width:150px}
.table-wrap th:nth-child(3),.table-wrap td:nth-child(3){width:170px}
.table-wrap th:nth-child(4),.table-wrap td:nth-child(4){width:auto}
.table-wrap th:nth-child(5),.table-wrap td:nth-child(5){width:135px}
.table-wrap th:nth-child(6),.table-wrap td:nth-child(6){width:105px}
.table-wrap th:nth-child(7),.table-wrap td:nth-child(7){width:135px}
.table-wrap .status{font-size:10px;padding:5px 8px;white-space:nowrap}
.table-wrap select{font-size:11px;min-height:36px;padding:7px 8px}
.stop-tag{display:inline-block;margin-top:5px;background:#ffe5e8;color:#bd2e3e;border-radius:999px;padding:3px 6px;font-size:9px;font-weight:800}

/* Login */
.login-redesign{padding:28px;background:
  radial-gradient(circle at 15% 15%,rgba(239,181,29,.23),transparent 30%),
  linear-gradient(135deg,#101725,#202a3d)}
.login-shell{width:min(1040px,100%);min-height:610px;display:grid;grid-template-columns:1.1fr .9fr;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.3)}
.login-brand-panel{position:relative;padding:58px;background:
  linear-gradient(140deg,rgba(16,23,37,.95),rgba(36,47,69,.92)),
  radial-gradient(circle,#efb51d 1px,transparent 1px);background-size:auto,20px 20px;color:#fff}
.login-brand-mark{width:65px;height:65px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(135deg,#efb51d,#ffd96a);color:#161b24;font-size:24px;font-weight:950;box-shadow:0 12px 30px rgba(239,181,29,.25)}
.login-brand-panel>span{display:block;color:#efb51d;font-size:11px;font-weight:900;letter-spacing:1.4px;margin-top:34px}
.login-brand-panel h1{font-size:38px;line-height:1.14;letter-spacing:-1px;margin:13px 0 18px}.login-brand-panel>p{max-width:500px;color:#c7cfdb;line-height:1.65}
.login-feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:43px}.login-feature-grid div{padding:14px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(255,255,255,.05)}.login-feature-grid b,.login-feature-grid span{display:block}.login-feature-grid b{font-size:21px;color:#efbd32}.login-feature-grid span{font-size:10px;color:#cbd2dc;margin-top:5px}
.login-form-panel{padding:58px;display:flex;flex-direction:column;justify-content:center}.login-title>span{font-size:23px;font-weight:950}.login-title>span span{color:#e8ad13}.login-title>small{display:block;color:#7f8793;margin-top:4px}
.login-form-panel h2{font-size:27px;margin:38px 0 8px}.login-form-panel>p{color:#777f8b;margin:0 0 27px}
.login-form-panel .field{margin-bottom:16px}.login-form-panel label{font-size:12px}.login-form-panel input{min-height:50px;background:#f8fafc;border-color:#dfe4eb}
.login-submit{width:100%;min-height:50px;display:flex;justify-content:space-between;align-items:center;padding:0 18px}
.login-demo-note{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #e5e8ed;margin-top:24px;padding-top:16px;font-size:10px;color:#7c8490}.login-demo-note b{color:#333b47}

/* Mobile arıza kartı taşmasını tamamen düzelt */
@media(max-width:620px){
  .table-wrap tr{padding:10px 13px!important;overflow:hidden}
  .table-wrap td{
    display:grid!important;
    grid-template-columns:112px minmax(0,1fr)!important;
    gap:10px!important;
    align-items:start!important;
    padding:11px 0!important;
    min-height:0!important;
    font-size:13px!important;
  }
  .table-wrap td::before{
    position:static!important;
    width:auto!important;
    font-size:10.5px!important;
    line-height:1.4!important;
  }
  .table-wrap td>*{min-width:0}
  .table-wrap td b{font-size:13px!important}
  .table-wrap td small{font-size:11px!important}
  .table-wrap select{width:100%;max-width:100%;font-size:13px!important}
}
@media(max-width:900px){
  .login-shell{grid-template-columns:1fr;min-height:0}.login-brand-panel{display:none}.login-form-panel{padding:32px 25px}
  main{max-width:none}
  .top-machine-list{grid-template-columns:1fr}
}

/* === Fabrika Şeması - bölüm bazlı görünüm === */
.factory-schema-controls{
  display:grid!important;
  grid-template-columns:1fr 1fr 1fr auto!important;
}
.factory-schema-layout{
  display:grid;
  grid-template-columns:300px minmax(0,1fr);
  gap:16px;
  align-items:start;
}
.factory-department-list,
.factory-machine-area{
  background:#fff;
  border:1px solid #dfe5ec;
  border-radius:20px;
  box-shadow:0 8px 26px rgba(22,34,52,.055);
}
.factory-department-list{
  padding:15px;
  position:sticky;
  top:95px;
}
.factory-department-head h2,
.factory-department-head p{margin:0}
.factory-department-head h2{font-size:17px}
.factory-department-head p{font-size:10px;color:#7d8692;margin-top:4px}
.factory-department-cards{display:grid;gap:8px;margin-top:14px}
.factory-department-card{
  width:100%;
  display:grid;
  grid-template-columns:48px minmax(0,1fr) 18px;
  align-items:center;
  gap:10px;
  padding:11px;
  border:1px solid #e3e7ed;
  border-radius:14px;
  background:#fbfcfd;
  text-align:left;
}
.factory-department-card:hover{background:#fff9e8;border-color:#e8c25d}
.factory-department-card.active{
  background:linear-gradient(135deg,#192335,#263650);
  color:#fff;
  border-color:#263650;
}
.factory-department-card>div{
  width:48px;height:48px;
  display:grid;place-items:center;align-content:center;
  border-radius:12px;
  background:#eef3f9;
}
.factory-department-card.active>div{background:rgba(255,255,255,.1)}
.factory-department-card>div span{font-size:17px;font-weight:900;line-height:1}
.factory-department-card>div small{font-size:8px;margin-top:3px;color:#798391}
.factory-department-card.active>div small{color:#c3ccd8}
.factory-department-card section{min-width:0}
.factory-department-card h3{font-size:12px;margin:0}
.factory-department-card p{font-size:9px;margin:4px 0 0;color:#75808d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.factory-department-card.active p{color:#bdc7d4}
.factory-department-card>b{font-size:20px;color:#8d96a3}
.factory-department-card.active>b{color:#efbd31}

.factory-machine-area{padding:17px;min-width:0}
.factory-machine-head{
  display:flex;justify-content:space-between;align-items:flex-end;
  gap:16px;padding:2px 2px 15px;border-bottom:1px solid #e9ecf0
}
.factory-machine-head span{font-size:9px;font-weight:900;letter-spacing:.9px;color:#d39a00}
.factory-machine-head h2{font-size:23px;margin:5px 0 0}
.factory-machine-head p{font-size:10.5px;color:#77818d;margin:5px 0 0}
.factory-machine-summary{display:flex;gap:8px}
.factory-machine-summary div{min-width:78px;padding:9px 12px;border:1px solid #e1e6ec;border-radius:12px;text-align:right}
.factory-machine-summary small,.factory-machine-summary b{display:block}
.factory-machine-summary small{font-size:8px;color:#818a96;font-weight:900}
.factory-machine-summary b{font-size:20px;margin-top:3px}

.factory-machine-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:11px;
  margin-top:15px;
}
.factory-machine-card{
  min-width:0;
  display:grid;
  grid-template-columns:48px minmax(0,1fr);
  gap:11px;
  position:relative;
  padding:13px;
  border:1px solid #e3e7ed;
  border-radius:16px;
  background:#fbfcfd;
  text-align:left;
  overflow:hidden;
}
.factory-machine-card:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(22,34,52,.08)}
.factory-machine-card.running{border-left:4px solid #19a667}
.factory-machine-card.warning{border-left:4px solid #e1a919;background:#fffaf0}
.factory-machine-card.stopped{border-left:4px solid #df4051;background:#fff5f6}
.factory-machine-icon{
  width:48px;height:48px;display:grid;place-items:center;
  border-radius:13px;background:#eef3f9;font-size:24px
}
.factory-machine-copy{min-width:0}
.factory-machine-copy span{font-size:8px;color:#8a939f;font-weight:800}
.factory-machine-copy h3{font-size:12px;margin:4px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.factory-machine-copy p{font-size:9px;color:#78818d;margin:4px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.factory-machine-status{
  grid-column:1/-1;
  display:flex;align-items:center;gap:6px;
  padding-top:8px;border-top:1px solid #e9ecf0
}
.factory-machine-status i{width:8px;height:8px;border-radius:50%;background:#19a667}
.factory-machine-card.warning .factory-machine-status i{background:#e1a919}
.factory-machine-card.stopped .factory-machine-status i{background:#df4051}
.factory-machine-status b{font-size:9px}

@media(max-width:1250px){
  .factory-machine-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:1000px){
  .factory-schema-layout{grid-template-columns:1fr}
  .factory-department-list{position:static}
  .factory-department-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:900px){
  .factory-schema-controls{grid-template-columns:1fr!important}
  .factory-machine-grid{grid-template-columns:1fr}
  .factory-department-cards{grid-template-columns:1fr}
  .factory-machine-head{align-items:flex-start;flex-direction:column}
  .factory-machine-summary{width:100%}
  .factory-machine-summary div{flex:1}
}


/* === Grafik eksen etiketleri okunabilirlik düzeltmesi === */
.responsive-chartbox{overflow:hidden}

/* Günlük kontroller sade ana görünüm */
.daily-control-kpis-compact{gap:8px;margin-bottom:11px}
.daily-control-kpis-compact article{padding:10px 12px;border-radius:12px;box-shadow:none}
.daily-control-kpis-compact b{font-size:16px;margin:3px 0 1px}
.daily-control-kpis-compact span{font-size:7px}
.daily-primary-section{margin-bottom:11px;padding:14px}
.daily-primary-section .section-modern-head{margin-bottom:10px}
.daily-inline-status{display:grid;gap:2px;min-width:112px;padding:8px 10px;border:1px solid;border-radius:11px;text-align:right;font-size:7px;font-weight:850}
.daily-inline-status b{font-size:9px}
.daily-inline-status.open{border-color:#b4dfc4;background:#edf9f2;color:#277047}
.daily-inline-status.closed{border-color:#efceb8;background:#fff7ef;color:#925b35}
.daily-secondary-panel{margin:0 0 9px;border:1px solid #dbe3e9;border-radius:14px;background:#fff;overflow:hidden}
.daily-secondary-panel>summary{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:11px 13px;list-style:none;cursor:pointer;background:#fbfcfd}
.daily-secondary-panel>summary::-webkit-details-marker{display:none}
.daily-secondary-panel>summary>span{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#edf3f7;color:#39739e;font-size:15px}
.daily-secondary-panel>summary b,.daily-secondary-panel>summary small{display:block}
.daily-secondary-panel>summary b{font-size:10px;color:#2d3e4b}
.daily-secondary-panel>summary small{margin-top:2px;font-size:7.5px;color:#7d8993}
.daily-secondary-panel>summary>i{font-size:15px;color:#788691;transition:transform .18s}
.daily-secondary-panel[open]>summary{border-bottom:1px solid #e2e7eb;background:#f4f8fb}
.daily-secondary-panel[open]>summary>i{transform:rotate(180deg)}
.daily-secondary-content{padding:13px}
.daily-secondary-content .daily-duty-banner,.daily-secondary-content .utility-time-banner{margin-bottom:9px}
.daily-secondary-content .utility-time-banner:last-child{margin-bottom:0}
.daily-utility-reports>.utility-output-card,.daily-utility-reports>.utility-statistics-card{margin-bottom:11px}
.daily-utility-reports>:last-child{margin-bottom:0}


/* Masaüstü ile mobil içerik ve işlem eşdeğerliği */
.mobile-menu-toggle,.mobile-drawer-head,.mobile-nav-overlay{display:none}
@media(max-width:900px){
  .mobile-menu-toggle{
    display:grid!important;
    place-items:center;
    flex:0 0 39px;
    width:39px;height:39px;

    cursor:pointer
  }
  .top{gap:9px}
  .brand{min-width:0;font-size:17px!important}
  .brand small{margin-left:5px!important;font-size:7px!important;white-space:nowrap}
  .top-user{min-width:0}
  .top-user-role{max-width:90px!important}
  .mobile-top-tabs{display:none!important}
  .mobile-nav-overlay{
    display:block;
    position:fixed;
    inset:0;
    z-index:110;
    background:rgba(13,20,30,.52);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s
  }
  .layout>aside{
    display:block!important;
    position:fixed!important;
    z-index:120!important;
    inset:0 auto 0 0;
    width:min(320px,88vw)!important;
    padding:14px!important;
    overflow-y:auto;
    transform:translateX(-102%);
    transition:transform .22s ease;
    box-shadow:18px 0 45px rgba(12,20,31,.24)!important
  }
  .mobile-drawer-head{display:flex;align-items:center;justify-content:space-between;padding:4px 3px 12px}
  .mobile-drawer-head b{font-size:12px;color:#273544}
  .mobile-drawer-head button{display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:10px;background:#eef2f5;color:#344552;font-size:19px}
  body.mobile-menu-open{overflow:hidden}
  body.mobile-menu-open .mobile-nav-overlay{opacity:1;pointer-events:auto}
  body.mobile-menu-open .layout>aside{transform:translateX(0)}
  .pro-system-state{display:flex!important;grid-column:1/-1;margin-left:0!important;justify-content:center}
  .layout-live-dot{display:inline-flex!important}

@media(max-width:620px){

  .daily-primary-section .section-modern-head{display:grid}
  .daily-inline-status{width:100%;text-align:left;grid-template-columns:auto 1fr;align-items:center}
  .daily-reading-grid{grid-template-columns:1fr}
  .daily-secondary-content{padding:10px}
  .daily-secondary-panel>summary small{font-size:7px}

  /* Tablolar masaüstündeki sütunları korur ve yatay kaydırılır. */
  .table-wrap{
    display:block!important;
    overflow-x:auto!important;
    overflow-y:hidden!important;
    padding:0!important;
    border:1px solid #dde3eb!important;
    border-radius:14px!important;
    background:#fff!important;
    box-shadow:none!important;
    -webkit-overflow-scrolling:touch
  }
  .table-wrap table{display:table!important;width:100%!important;min-width:960px!important;table-layout:fixed!important}

  .table-wrap tr{display:table-row!important;width:auto!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;background:transparent!important}
  .table-wrap th,.table-wrap td{display:table-cell!important;width:auto!important;min-height:0!important;padding:10px 12px!important;border-bottom:1px solid #e8ecf0!important;position:static!important;text-align:left!important;font-size:11px!important}
  .table-wrap td::before{display:none!important;content:none!important}

  /* Personel sıralamasındaki masaüstü bilgileri mobilde de korunur. */
  .ranking-list{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* === Operasyon geçmişleri, taşeron işleri ve profesyonel QR görünümü === */
.qr-scan-icon{
  display:block;
  width:23px;
  height:23px;
  flex:0 0 auto;
  overflow:visible;
  color:currentColor
}
.qr-scan-icon .qr-scan-frame,
.qr-scan-icon .qr-scan-line{
  fill:none;
  stroke:currentColor;
  stroke-width:1.65;
  stroke-linecap:round;
  stroke-linejoin:round
}
.qr-scan-icon .qr-scan-line{
  stroke:#f3b71b;
  stroke-width:1.4;
  filter:drop-shadow(0 0 2px rgba(243,183,27,.35))
}
.qr-scan-icon rect,
.qr-scan-icon path:not(.qr-scan-frame):not(.qr-scan-line){
  fill:currentColor;
  stroke:none
}
.qr-scan-icon.large{width:31px;height:31px}
.qr-scan-icon.hero{width:29px;height:29px}
.qr-scan-button,
.qr-home-button{
  display:inline-flex;

  justify-content:center;
  gap:9px
}
.hero-qr .qr-scan-icon{transition:transform .18s ease}
.hero-qr:hover .qr-scan-icon{transform:scale(1.08)}
.qr-home-symbol{font-size:0}
.qr-home-symbol .qr-scan-line{stroke:#fff}

<script>
function safeJson(text,fallback){
  try{return JSON.parse(text)}catch(e){return fallback}
}
function safeArray(value,fallback=[]){
  return Array.isArray(value)?value:fallback;
}
function safeRecordArray(value,fallback=[]){
  return safeArray(value,fallback).filter(item=>item!==null&&typeof item==="object"&&!Array.isArray(item));
}
function safeRecord(value,fallback={}){
  return value!==null&&typeof value==="object"&&!Array.isArray(value)?value:fallback;
}
function storageJsonArray(storage,key,fallback=[]){
  return safeArray(safeJson(storageGet(storage,key,"null"),null),fallback);
}
function storageJsonRecordArray(storage,key,fallback=[]){
  return safeRecordArray(safeJson(storageGet(storage,key,"null"),null),fallback);
}
function storageJsonRecord(storage,key,fallback={}){
  return safeRecord(safeJson(storageGet(storage,key,"null"),null),fallback);
}
function storageGet(storage,key,fallback){
  try{
    const value=storage.getItem(key);
    return value===null?fallback:value;
  }catch(e){
    return fallback;
  }
}
function storageSet(storage,key,value){
  try{storage.setItem(key,value);return true}catch(e){return false}
}
function storageRemove(storage,key){
  try{storage.removeItem(key)}catch(e){}
}
function storageClear(storage){
  try{storage.clear()}catch(e){}
}

</script>

const MACHINE_CATALOG_CUSTOM_KEY="etilismart_custom_machines_v1";
const MACHINE_CATALOG_DELETED_KEY="etilismart_deleted_machines_v1";
let CUSTOM_MACHINE_CATALOG=[];
let DELETED_MACHINE_CATALOG=[];
CUSTOM_MACHINE_CATALOG=storageJsonRecordArray(localStorage,MACHINE_CATALOG_CUSTOM_KEY,[]);
DELETED_MACHINE_CATALOG=storageJsonArray(localStorage,MACHINE_CATALOG_DELETED_KEY,[]).filter(key=>typeof key==="string");
function machineCatalogKey(factory,line,department,machine){
  return [factory,line,department,machine].join("¦");
}
function ensureMachineCatalogFactory(factory){
  if(!MACHINE_CATALOG_2_FACTORY[factory]){
    MACHINE_CATALOG_2_FACTORY[factory]={};
    const lines=FACTORIES[factory]||["1. Hat"];
    lines.forEach(line=>{
      MACHINE_CATALOG_2_FACTORY[factory][line]={};
      Object.entries(STRUCTURE).forEach(([department,machines])=>{
        MACHINE_CATALOG_2_FACTORY[factory][line][department]=[...machines];
      });
    });
  }
  return MACHINE_CATALOG_2_FACTORY[factory];
}
function ensureMachineCatalogPath(factory,line,department){
  ensureMachineCatalogFactory(factory);
  if(!MACHINE_CATALOG_2_FACTORY[factory][line]){
    MACHINE_CATALOG_2_FACTORY[factory][line]={};
    Object.entries(STRUCTURE).forEach(([defaultDepartment,machines])=>{
      MACHINE_CATALOG_2_FACTORY[factory][line][defaultDepartment]=[...machines];
    });
  }
  if(!MACHINE_CATALOG_2_FACTORY[factory][line][department])MACHINE_CATALOG_2_FACTORY[factory][line][department]=[];
  return MACHINE_CATALOG_2_FACTORY[factory][line][department];
}
function applyMachineCatalogChanges(){
  DELETED_MACHINE_CATALOG.forEach(key=>{
    const [factory,line,department,machine]=String(key).split("¦");
    const list=MACHINE_CATALOG_2_FACTORY[factory]?.[line]?.[department];
    if(Array.isArray(list)){
      const index=list.indexOf(machine);
      if(index>=0)list.splice(index,1);
    }
  });
  CUSTOM_MACHINE_CATALOG.forEach(item=>{
    if(!item?.factory||!item?.line||!item?.department||!item?.machine)return;
    const list=ensureMachineCatalogPath(item.factory,item.line,item.department);
    if(!list.includes(item.machine))list.push(item.machine);
  });
}
function saveMachineCatalogChanges(){
  storageSet(localStorage,MACHINE_CATALOG_CUSTOM_KEY,JSON.stringify(CUSTOM_MACHINE_CATALOG));
  storageSet(localStorage,MACHINE_CATALOG_DELETED_KEY,JSON.stringify(DELETED_MACHINE_CATALOG));
}
function addMachineToCatalog(factory,line,department,machine){
  const clean=String(machine||"").trim();
  if(!clean)return {ok:false,message:"Makine adı boş bırakılamaz."};
  const list=ensureMachineCatalogPath(factory,line,department);
  if(list.some(item=>item.toLocaleLowerCase("tr-TR")===clean.toLocaleLowerCase("tr-TR"))){
    return {ok:false,message:"Bu bölümde aynı isimde bir makine zaten bulunuyor."};
  }
  const record={factory,line,department,machine:clean,createdBy:s.user?.name||"",createdAt:new Date().toISOString()};
  CUSTOM_MACHINE_CATALOG.push(record);
  const key=machineCatalogKey(factory,line,department,clean);
  DELETED_MACHINE_CATALOG=DELETED_MACHINE_CATALOG.filter(item=>item!==key);
  list.push(clean);
  saveMachineCatalogChanges();
  return {ok:true};
}
function deleteMachineFromCatalog(factory,line,department,machine){
  const list=ensureMachineCatalogPath(factory,line,department);
  if(!Array.isArray(list))return false;
  const index=list.indexOf(machine);
  if(index<0)return false;
  list.splice(index,1);
  const key=machineCatalogKey(factory,line,department,machine);
  const customIndex=CUSTOM_MACHINE_CATALOG.findIndex(item=>machineCatalogKey(item.factory,item.line,item.department,item.machine)===key);
  if(customIndex>=0)CUSTOM_MACHINE_CATALOG.splice(customIndex,1);
  else if(!DELETED_MACHINE_CATALOG.includes(key))DELETED_MACHINE_CATALOG.push(key);
  saveMachineCatalogChanges();
  return true;
}
function isCustomMachine(factory,line,department,machine){
  const key=machineCatalogKey(factory,line,department,machine);
  return CUSTOM_MACHINE_CATALOG.some(item=>machineCatalogKey(item.factory,item.line,item.department,item.machine)===key);
}
applyMachineCatalogChanges();

function catalogLines(factory){
  if(MACHINE_CATALOG_2_FACTORY[factory]){
    const lines=Object.keys(MACHINE_CATALOG_2_FACTORY[factory]);
    return lines.sort((a,b)=>{
      if(a==="Ortak Alan")return 1;
      if(b==="Ortak Alan")return -1;
      return a.localeCompare(b,"tr",{numeric:true});
    });
  }
  return FACTORIES[factory]||[];
}
function catalogDepartments(factory,line){
  if(MACHINE_CATALOG_2_FACTORY[factory]){
    return Object.keys(MACHINE_CATALOG_2_FACTORY[factory][line]||{});
  }
  return Object.keys(STRUCTURE);
}
function catalogMachines(factory,line,department){
  if(MACHINE_CATALOG_2_FACTORY[factory]){
    return MACHINE_CATALOG_2_FACTORY[factory]?.[line]?.[department]||[];
  }
  return STRUCTURE[department]||[];
}
function allFactoryMachines(factory){
  if(!MACHINE_CATALOG_2_FACTORY[factory])return Object.values(STRUCTURE).flat();
  return Object.values(MACHINE_CATALOG_2_FACTORY[factory])
    .flatMap(departments=>Object.values(departments).flat());
}

function findMachineDepartment(factory,line,machine){
  const departments=catalogDepartments(factory,line);
  return departments.find(department=>catalogMachines(factory,line,department).includes(machine))||"";
}

function faultParticipants(fault){
  return [...new Set(Array.isArray(fault?.participants)?fault.participants.filter(name=>typeof name==="string"&&name.trim()).map(name=>name.trim()):[])];
}
function normalizeFaultParticipants(){
  let changed=false;
  s.faults.forEach(f=>{
    if(!Array.isArray(f.usedMaterials)){f.usedMaterials=[];changed=true}
    if(typeof f.solutionText!=="string"){f.solutionText="";changed=true}
    if(typeof f.solutionBy!=="string"){f.solutionBy="";changed=true}
    if(f.solutionAt===undefined){f.solutionAt=null;changed=true}
    if(!Array.isArray(f.handovers)){f.handovers=[];changed=true}
    if(!Array.isArray(f.assignmentHistory)){f.assignmentHistory=[];changed=true}
    if(!f.assignmentState){
      f.assignmentState=f.status==="progress"||f.status==="done"?"accepted":"pending";
      if(f.status==="open"&&Array.isArray(f.participants)&&f.participants.length===1&&f.participants[0]===f.assignedTo)f.participants=[];
      changed=true;
    }
    if(f.assignmentState==="accepted"){
      if(!f.claimedBy)f.claimedBy=f.assignedTo||faultParticipants(f)[0]||"";
      if(!f.claimedAt)f.claimedAt=f.createdAt||new Date().toISOString();
    }else{
      if(f.claimedBy===undefined)f.claimedBy="";
      if(f.claimedAt===undefined)f.claimedAt=null;
    }
    const normalized=faultParticipants(f);
    if(JSON.stringify(f.participants||[])!==JSON.stringify(normalized)){
      f.participants=normalized;
      changed=true;
    }
  });
  if(changed)save();
}
function isCurrentMaintenanceUserActiveForFault(fault){
  if(s.user?.role!=="Bakım Personeli")return false;
  const account=APP_USERS[s.user.id];
  if(!account)return false;
  const sameFactory=(account.factories||[]).some(f=>shiftFactoryName(f)===shiftFactoryName(fault.factory));
  const sameTeam=account.team===maintenanceDisciplineForFault(fault);
  if(!sameFactory||!sameTeam)return false;
  return activeTeamMembers(shiftFactoryName(fault.factory),account.team).some(p=>p.id===s.user.id||p.name===s.user.name);
}
function currentMaintenanceAccountForFault(fault){
  if(!fault||s.user?.role!=="Bakım Personeli")return null;
  const account=APP_USERS[s.user.id];
  if(!account)return null;
  const sameFactory=(account.factories||[]).some(f=>shiftFactoryName(f)===shiftFactoryName(fault.factory));
  const sameTeam=account.team===maintenanceDisciplineForFault(fault);
  return sameFactory&&sameTeam?account:null;
}
function canClaimFault(fault){
  if(!fault||fault.status==="done"||fault.assignmentState==="accepted")return false;
  if(!currentMaintenanceAccountForFault(fault)||!isCurrentMaintenanceUserActiveForFault(fault))return false;
  const assigned=String(fault.assignedTo||"").trim();
  const activeNames=activeMaintenanceForFault(fault);
  return !assigned
    ||["Atama Bekliyor","Bakım Ekibi"].includes(assigned)
    ||assigned===s.user?.name
    ||!activeNames.includes(assigned);
}
function claimFaultByCurrentUser(fault){
  if(!canClaimFault(fault))return {ok:false,message:"Bu arızayı üstlenme yetkiniz yok veya arıza başka bir personele atanmış."};
  const now=new Date().toISOString();
  const previous=fault.assignedTo||"Atama Bekliyor";
  fault.assignedTo=s.user.name;
  fault.assignmentState="accepted";
  fault.claimedBy=s.user.name;
  fault.claimedAt=now;
  fault.status="progress";
  fault.closedAt=null;
  fault.participants=[...new Set([...faultParticipants(fault),s.user.name])];
  if(!Array.isArray(fault.assignmentHistory))fault.assignmentHistory=[];
  fault.assignmentHistory.push({action:"claimed",from:previous,to:s.user.name,by:s.user.name,at:now,shift:currentShiftLabel()});
  return {ok:true};
}

}
function canManageFaultParticipants(fault){

}

function shiftLabelForDate(date=new Date()){
  const h=date.getHours();
  return h<8?"00-08":h<16?"08-16":"16-24";
}
function weekOffsetForDate(date){
  const target=new Date(date);target.setHours(0,0,0,0);
  const monday=new Date(target);monday.setDate(monday.getDate()-(monday.getDay()+6)%7);
  return Math.round((monday-weekMonday(0))/(7*86400000));
}
function nextShiftDate(date=new Date()){
  const next=new Date(date);
  const h=date.getHours();
  if(h<8)next.setHours(8,0,0,0);
  else if(h<16)next.setHours(16,0,0,0);
  else{next.setDate(next.getDate()+1);next.setHours(0,0,0,0)}
  return next;
}
function nextShiftLabel(date=new Date()){
  return shiftLabelForDate(nextShiftDate(date));
}
function nextShiftMembersForFault(fault){
  const team=maintenanceDisciplineForFault(fault);
  const factory=shiftFactoryName(fault.factory);
  return activeTeamMembers(factory,team,nextShiftDate()).map(p=>p.name).filter(name=>name!==s.user?.name);
}
function canHandoverFault(fault){
  if(!fault||fault.status==="done")return false;
  if(canRedirectFault(fault))return true;
  return s.user?.role==="Bakım Personeli"&&fault.assignmentState==="accepted"&&faultParticipants(fault).includes(s.user?.name)&&
    maintenanceDisciplineForFault(fault)===APP_USERS[s.user.id]?.team;
}
function personnelPerformance(name){
  const assigned=visibleFaults().filter(f=>faultParticipants(f).includes(name));
  const completed=assigned.filter(f=>f.status==="done");
  const active=assigned.filter(f=>f.status!=="done");
  const stopped=assigned.filter(f=>f.stopped);
  const avgMinutes=completed.length?Math.round(completed.reduce((sum,f)=>{
    const start=new Date(f.createdAt).getTime(),end=new Date(f.closedAt||f.createdAt).getTime();
    return sum+Math.max(0,(end-start)/60000);
  },0)/completed.length):0;
  const now=new Date();
  const monthRecords=assigned.filter(f=>{
    const d=new Date(f.closedAt||f.createdAt);
    return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
  });
  const monthCompleted=monthRecords.filter(f=>f.status==="done").length;
  const machineCounts={};
  assigned.forEach(f=>{const key=f.machine||"Belirtilmemiş";machineCounts[key]=(machineCounts[key]||0)+1});
  const topMachines=Object.entries(machineCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return {assigned:assigned.length,completed:completed.length,active:active.length,stopped:stopped.length,avgMinutes,monthCompleted,monthAssigned:monthRecords.length,topMachines,records:assigned};
}
function performanceScore(p){
  if(!p.assigned)return 0;
  const completion=(p.completed/p.assigned)*70;
  const speed=p.avgMinutes?Math.max(0,30-Math.min(30,p.avgMinutes/12)):15;
  return Math.max(0,Math.min(100,Math.round(completion+speed)));
}
function monthlyPerformanceScore(p){
  if(!p.monthAssigned)return 0;
  const completion=(p.monthCompleted/p.monthAssigned)*80;
  const activity=Math.min(20,p.monthAssigned*2);
  return Math.max(0,Math.min(100,Math.round(completion+activity)));
}

function startOfWeek(date=new Date()){
  const d=new Date(date);
  const day=(d.getDay()+6)%7;
  d.setHours(0,0,0,0);
  d.setDate(d.getDate()-day);
  return d;
}
function startOfMonth(date=new Date()){
  return new Date(date.getFullYear(),date.getMonth(),1);
}
function startOfYear(date=new Date()){
  return new Date(date.getFullYear(),0,1);
}
function performanceForPeriod(name,period="monthly"){
  const now=new Date();
  const start=period==="weekly"?startOfWeek(now):period==="yearly"?startOfYear(now):startOfMonth(now);
  const records=visibleFaults().filter(f=>{
    if(!faultParticipants(f).includes(name))return false;
    const d=new Date(f.closedAt||f.createdAt);
    return d>=start&&d<=now;
  });
  const completed=records.filter(f=>f.status==="done");
  const active=records.filter(f=>f.status!=="done");
  const stopped=records.filter(f=>f.stopped);
  const avgMinutes=completed.length?Math.round(completed.reduce((sum,f)=>{
    const startTime=new Date(f.createdAt).getTime();
    const endTime=new Date(f.closedAt||f.createdAt).getTime();
    return sum+Math.max(0,(endTime-startTime)/60000);
  },0)/completed.length):0;
  const score=records.length
    ?Math.max(0,Math.min(100,Math.round((completed.length/records.length)*80+Math.min(20,records.length*2))))
    :0;
  return {assigned:records.length,completed:completed.length,active:active.length,stopped:stopped.length,avgMinutes,score,records};
}
function performancePeriodLabel(period){
  return period==="weekly"?"Haftalık":period==="yearly"?"Yıllık":"Aylık";
}
function nextFourDigitId(){
  const ids=Object.keys(APP_USERS).map(Number).filter(n=>n>=1000&&n<=9999);
  for(let i=7001;i<=9999;i++)if(!ids.includes(i))return String(i);
  return "";
}
function randomFourDigitPassword(){
  return String(1000+Math.floor(Math.random()*9000));
}

function deleteMaintenancePersonnelAccount(id){
  const account=APP_USERS[id];
  if(!account||account.role!=="Bakım Personeli")return {ok:false,message:"Personel hesabı bulunamadı."};
  if(!permissions().manageAllPersonnel)return {ok:false,message:"Personel silme yetkisi yalnızca Bakım Müdüründedir."};

  delete APP_USERS[id];
  DELETED_PERSONNEL_IDS.add(String(id));
  saveDeletedPersonnelIds();
  saveAppUsers();

  // Silinen personeli açık ve geçmiş arıza katılımcılarından kaldır.
  s.faults.forEach(f=>{
    const remaining=faultParticipants(f).filter(name=>name!==account.name);
    f.participants=remaining;
    if(f.assignedTo===account.name){
      f.assignedTo=remaining[0]||"Atama Bekliyor";
      f.assignmentState=remaining.length?"accepted":"pending";
      f.claimedBy=remaining[0]||"";
      f.claimedAt=remaining.length?(f.claimedAt||new Date().toISOString()):null;
      if(!remaining.length&&f.status!=="done")f.status="open";
    }
  });

  s.workItems.forEach(item=>{
    if(item.kind==="workorder"&&item.assignedTo===account.name){
      item.assignedTo="";
      if(item.status==="assigned")item.status="open";
    }
  });

  // Vardiya planındaki kayıtlarını kaldır.
  if(s.shiftPlan&&typeof s.shiftPlan==="object"){
    Object.keys(s.shiftPlan).forEach(key=>{
      const value=s.shiftPlan[key];
      if(Array.isArray(value)){
        s.shiftPlan[key]=value.filter(x=>{
          if(typeof x==="string")return x!==account.name&&x!==id;
          return x?.name!==account.name&&x?.id!==id;
        });
      }else if(value&&typeof value==="object"){
        Object.keys(value).forEach(k=>{
          if(Array.isArray(value[k])){
            value[k]=value[k].filter(x=>{
              if(typeof x==="string")return x!==account.name&&x!==id;
              return x?.name!==account.name&&x?.id!==id;
            });
          }
        });
      }
    });
  }

  if(typeof SHIFT_OVERRIDES==="object"&&SHIFT_OVERRIDES){
    Object.keys(SHIFT_OVERRIDES)
      .filter(key=>key.split("|")[3]===String(id))
      .forEach(key=>delete SHIFT_OVERRIDES[key]);
    storageSet(localStorage,SHIFT_OVERRIDE_KEY,JSON.stringify(SHIFT_OVERRIDES));
  }

  save();
  saveWorkItems();
  return {ok:true,name:account.name};
}

  <div class="modal-backdrop" id="personnelEditorBackdrop" style="display:none">
    <div class="modal personnel-editor-modal">
      <div class="modal-head"><div><span>PERSONEL HESABI</span><h2 id="personnelEditorTitle">Yeni Bakım Personeli</h2></div><button type="button" id="closePersonnelEditor">×</button></div>
      <form id="personnelEditorForm">
        <input type="hidden" id="personnelOriginalId">
        <div class="form-grid">
          <div class="field wide"><label>Ad Soyad</label><input id="personnelName" required></div>
          <div class="field"><label>Fabrika</label><select id="personnelFactory">${factoryOptions.map(x=>`<option>${esc(x)}</option>`).join("")}</select></div>
          <div class="field"><label>Ekip</label><select id="personnelTeam">${teamOptions.map(x=>`<option>${esc(x)}</option>`).join("")}</select></div>
          <div class="field"><label>4 Haneli Kullanıcı ID</label><input id="personnelId" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required></div>
          <div class="field"><label>4 Haneli Şifre</label><div class="password-generate-row"><input id="personnelPassword" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required><button type="button" class="secondary" id="generatePersonnelPassword">Üret</button></div></div>
        </div>
        <div class="modal-actions"><button type="button" class="secondary" id="cancelPersonnelEditor">Vazgeç</button><button class="primary" type="submit">Kaydet</button></div>

}

</script>
<script>
/* Günlük kontrol verileri ve fotoğraflar */
const DAILY_CHECK_KEY="etilismart_daily_facility_checks_v1";

function dailyAsset(id,factory,type,index,team){
  const suffix=index?` ${index}`:"";
  const labels={
    compressor:"Kompresör",
    transformer:"Trafo",
    generator:"Jeneratör",
    ups:"UPS",
    compensation:"Kompanzasyon Panosu",
    breakerRoom:"Kesici Odası",
    breakerPanel:"Kesici Panosu",
    gas:"Gaz Sayacı",
    gasStation:"Gaz İstasyonu",
    fireSystem:"Yangın Sistemi",
    water:"Su Deposu"
  };
  const contractorMonthly=["transformer","breakerRoom","breakerPanel","gasStation","fireSystem"].includes(type);
  return {
    id,
    factory,
    type,
    name:`${labels[type]}${suffix}`,
    team,
    special:type==="water"||type==="gas",
    contractorMonthly
  };
}

const DAILY_CONTROL_ASSETS=[
  dailyAsset("F1-KOMP-1","1. Fabrika","compressor",1,"Mekanik Bakım"),
  ...Array.from({length:3},(_,i)=>dailyAsset(`F1-TR-${i+1}`,"1. Fabrika","transformer",i+1,"Taşeron")),
  dailyAsset("F1-JEN-1","1. Fabrika","generator",1,"Elektrik Bakım"),
  ...Array.from({length:2},(_,i)=>dailyAsset(`F1-UPS-${i+1}`,"1. Fabrika","ups",i+1,"Elektrik Bakım")),
  ...Array.from({length:3},(_,i)=>dailyAsset(`F1-KOMPZ-${i+1}`,"1. Fabrika","compensation",i+1,"Elektrik Bakım")),
  ...Array.from({length:3},(_,i)=>dailyAsset(`F1-KES-${i+1}`,"1. Fabrika","breakerRoom",i+1,"Taşeron")),
  dailyAsset("F1-GAZ-IST","1. Fabrika","gasStation",0,"Periyodik Kontrol"),
  dailyAsset("F1-YANGIN","1. Fabrika","fireSystem",0,"Periyodik Kontrol"),
  dailyAsset("F1-GAZ-1","1. Fabrika","gas",1,"Mekanik Bakım"),
  dailyAsset("F1-SU-1","1. Fabrika","water",1,"Mekanik Bakım"),

  ...Array.from({length:5},(_,i)=>dailyAsset(`F2-TR-${i+1}`,"2. Fabrika","transformer",i+1,"Taşeron")),
  ...Array.from({length:5},(_,i)=>dailyAsset(`F2-KES-${i+1}`,"2. Fabrika","breakerPanel",i+1,"Taşeron")),
  dailyAsset("F2-GAZ-IST","2. Fabrika","gasStation",0,"Periyodik Kontrol"),
  dailyAsset("F2-YANGIN","2. Fabrika","fireSystem",0,"Periyodik Kontrol"),
  ...Array.from({length:2},(_,i)=>dailyAsset(`F2-KOMP-${i+1}`,"2. Fabrika","compressor",i+1,"Mekanik Bakım")),
  ...Array.from({length:2},(_,i)=>dailyAsset(`F2-JEN-${i+1}`,"2. Fabrika","generator",i+1,"Elektrik Bakım")),
  ...Array.from({length:4},(_,i)=>dailyAsset(`F2-UPS-${i+1}`,"2. Fabrika","ups",i+1,"Elektrik Bakım")),
  ...Array.from({length:6},(_,i)=>dailyAsset(`F2-KOMPZ-${i+1}`,"2. Fabrika","compensation",i+1,"Elektrik Bakım")),
  dailyAsset("F2-SU-1","2. Fabrika","water",1,"Mekanik Bakım"),
  dailyAsset("F2-GAZ-1","2. Fabrika","gas",1,"Mekanik Bakım")
];

const DAILY_CONTROL_CUSTOM_CATALOG_KEY="etilismart_custom_daily_controls_v1";
const DAILY_CONTROL_DELETED_CATALOG_KEY="etilismart_deleted_daily_controls_v1";
let CUSTOM_DAILY_CONTROL_ASSETS=[];
let DELETED_DAILY_CONTROL_ASSETS=[];
CUSTOM_DAILY_CONTROL_ASSETS=storageJsonRecordArray(localStorage,DAILY_CONTROL_CUSTOM_CATALOG_KEY,[])
  .filter(asset=>typeof asset.id==="string"
    &&["1. Fabrika","2. Fabrika"].includes(asset.factory)
    &&typeof asset.name==="string"&&asset.name.trim()
    &&["compressor","generator","ups","compensation","gas","water","other"].includes(asset.type)
    &&["Elektrik Bakım","Mekanik Bakım"].includes(asset.team))
  .map(asset=>({
    ...asset,
    id:asset.id.trim(),
    name:asset.name.trim(),
    special:["water","gas"].includes(asset.type),
    contractorMonthly:false,
    custom:true
  }));
DELETED_DAILY_CONTROL_ASSETS=storageJsonArray(localStorage,DAILY_CONTROL_DELETED_CATALOG_KEY,[]).filter(id=>typeof id==="string");
CUSTOM_DAILY_CONTROL_ASSETS.forEach(asset=>{
  if(asset?.id&&!DAILY_CONTROL_ASSETS.some(item=>item.id===asset.id))DAILY_CONTROL_ASSETS.push(asset);
});
for(let index=DAILY_CONTROL_ASSETS.length-1;index>=0;index--){
  if(DELETED_DAILY_CONTROL_ASSETS.includes(DAILY_CONTROL_ASSETS[index].id))DAILY_CONTROL_ASSETS.splice(index,1);
}
function saveDailyControlCatalog(){
  storageSet(localStorage,DAILY_CONTROL_CUSTOM_CATALOG_KEY,JSON.stringify(CUSTOM_DAILY_CONTROL_ASSETS));
  storageSet(localStorage,DAILY_CONTROL_DELETED_CATALOG_KEY,JSON.stringify(DELETED_DAILY_CONTROL_ASSETS));
}
function addDailyControlToCatalog({factory,name,type,team}){
  const clean=String(name||"").trim();
  if(!canManageDailyControlCatalog()||!dailyControlFactories().includes(factory)){
    return {ok:false,message:"Bu fabrika için günlük kontrol tanımlama yetkiniz bulunmuyor."};
  }
  if(!clean)return {ok:false,message:"Kontrol adı boş bırakılamaz."};
  if(!["compressor","generator","ups","compensation","gas","water","other"].includes(type)){
    return {ok:false,message:"Geçerli bir kontrol türü seçiniz."};
  }
  if(!["Elektrik Bakım","Mekanik Bakım"].includes(team)){
    return {ok:false,message:"Geçerli bir sorumlu bakım ekibi seçiniz."};
  }
  if(DAILY_CONTROL_ASSETS.some(item=>item.factory===factory&&item.name.toLocaleLowerCase("tr-TR")===clean.toLocaleLowerCase("tr-TR"))){
    return {ok:false,message:"Bu fabrikada aynı isimde bir günlük kontrol zaten bulunuyor."};
  }
  const asset={
    id:`CUSTOM-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,
    factory,
    type:type||"other",
    name:clean,
    team:team||"Elektrik Bakım",
    special:["water","gas"].includes(type),
    contractorMonthly:false,
    custom:true,
    createdBy:s.user?.name||"",
    createdAt:new Date().toISOString()
  };
  CUSTOM_DAILY_CONTROL_ASSETS.push(asset);
  DAILY_CONTROL_ASSETS.push(asset);
  saveDailyControlCatalog();
  return {ok:true,asset};
}
function deleteDailyControlFromCatalog(id){
  const index=DAILY_CONTROL_ASSETS.findIndex(asset=>asset.id===id&&!asset.contractorMonthly);
  if(index<0)return false;
  DAILY_CONTROL_ASSETS.splice(index,1);
  const customIndex=CUSTOM_DAILY_CONTROL_ASSETS.findIndex(asset=>asset.id===id);
  if(customIndex>=0)CUSTOM_DAILY_CONTROL_ASSETS.splice(customIndex,1);
  else if(!DELETED_DAILY_CONTROL_ASSETS.includes(id))DELETED_DAILY_CONTROL_ASSETS.push(id);
  saveDailyControlCatalog();
  return true;
}

const CONTRACTOR_CHECK_KEY="etilismart_contractor_monthly_checks_v1";
const CONTROL_PHOTO_DB="etilismart_control_photos_v1";
const CONTROL_PHOTO_STORE="photos";

function saveDailyChecks(){
  storageSet(localStorage,DAILY_CHECK_KEY,JSON.stringify(s.dailyChecks||{}));
}
function saveContractorChecks(){
  storageSet(localStorage,CONTRACTOR_CHECK_KEY,JSON.stringify(s.contractorChecks||{}));
}
function monthKeyLocal(date=new Date()){
  const d=date instanceof Date?date:new Date(`${date}-01T12:00:00`);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
function dailyCheckDateKey(value){
  const date=value?new Date(`${value}T12:00:00`):new Date();
  return dateKeyLocal(date);
}
function dateBeforeKey(value,days=1){
  const d=new Date(`${dailyCheckDateKey(value)}T12:00:00`);
  d.setDate(d.getDate()-days);
  return dateKeyLocal(d);
}
function dailyCheckKey(date,factory,assetId){
  return `daily|${dailyCheckDateKey(date)}|${factory}|${assetId}`;
}
function contractorCheckKey(month,factory,assetId){
  return `monthly|${month||monthKeyLocal()}|${factory}|${assetId}`;
}
function dailyCheckRecord(date,factory,assetId){
  return (s.dailyChecks||{})[dailyCheckKey(date,factory,assetId)]||null;
}
function contractorCheckRecord(month,factory,assetId){
  return (s.contractorChecks||{})[contractorCheckKey(month,factory,assetId)]||null;
}
function dailyAssetsForFactory(factory){
  return DAILY_CONTROL_ASSETS.filter(asset=>asset.factory===factory&&!asset.contractorMonthly);
}
function contractorAssetsForFactory(factory){
  return DAILY_CONTROL_ASSETS.filter(asset=>asset.factory===factory&&asset.contractorMonthly);
}
function dailyControlFactories(){
  if(permissions().allFactories||s.user?.role==="Bakım Müdürü"||s.user?.role==="Genel Müdür"){
    return ["1. Fabrika","2. Fabrika"];
  }
  return [...new Set(userFactories().map(shiftFactoryName))]
    .filter(factory=>factory==="1. Fabrika"||factory==="2. Fabrika");
}
function dailyCheckWeekOffset(dateValue){
  const selected=new Date(`${dailyCheckDateKey(dateValue)}T12:00:00`);
  const selectedDay=(selected.getDay()+6)%7;
  selected.setDate(selected.getDate()-selectedDay);
  selected.setHours(0,0,0,0);
  return Math.round((selected-weekMonday(0))/(7*86400000));
}
function dailyDutyMembers(factory,team,dateValue){
  const date=new Date(`${dailyCheckDateKey(dateValue)}T12:00:00`);
  const dayIndex=(date.getDay()+6)%7;
  const offset=dailyCheckWeekOffset(dateValue);
  return buildTeamWeekSchedule(factory,team,offset)
    .filter(person=>person.days[dayIndex]?.shift==="08-16")
    .map(person=>person.name);
}
function dailyAssetCanBeManaged(asset){
  if(!permissions().manageDailyChecks||asset.contractorMonthly)return false;
  if(isDeveloper())return dailyControlFactories().includes(asset.factory);
  if(s.user?.role==="Bakım Müdürü")return true;
  if(!dailyControlFactories().includes(asset.factory))return false;
  if(s.user?.role==="Elektrik Bakım Formeni")return asset.team==="Elektrik Bakım";
  if(s.user?.role==="Mekanik Bakım Formeni")return asset.team==="Mekanik Bakım";
  if(s.user?.role==="Bakım Formeni")return true;
  return s.user?.role==="Genel Müdür";
}
function canCompleteDailyAsset(asset,dateValue){
  if(asset.contractorMonthly)return false;
  if(dailyAssetCanBeManaged(asset))return true;
  if(!permissions().completeDailyChecks||s.user?.role!=="Bakım Personeli")return false;
  if(dailyCheckDateKey(dateValue)!==dateKeyLocal(new Date()))return false;
  if(!dailyControlFactories().includes(asset.factory))return false;
  return dailyDutyMembers(asset.factory,asset.team,dateValue).includes(s.user?.name);
}
function utilityWindowState(dateValue){
  const selected=dailyCheckDateKey(dateValue);
  const today=dateKeyLocal(new Date());
  const now=new Date();
  const minutes=now.getHours()*60+now.getMinutes();
  return {
    selectedIsToday:selected===today,
    inWindow:selected===today&&minutes>=8*60&&minutes<9*60,
    beforeWindow:selected===today&&minutes<8*60,
    afterWindow:selected===today&&minutes>=9*60
  };
}
function canCompleteUtilityAsset(asset,dateValue){
  if(!asset?.special)return false;
  if(dailyAssetCanBeManaged(asset))return true;
  return canCompleteDailyAsset(asset,dateValue)&&utilityWindowState(dateValue).inWindow;
}
function canRecordContractorCheck(asset){
  if(!asset?.contractorMonthly)return false;
  if(!dailyControlFactories().includes(asset.factory))return false;
  return isDeveloper()||["Bakım Müdürü","Elektrik Bakım Formeni","Mekanik Bakım Formeni","Bakım Formeni"].includes(s.user?.role);
}
function dailyAssetTypeLabel(type){
  return ({
    compressor:"Kompresör",
    transformer:"Trafo",
    generator:"Jeneratör",
    ups:"UPS",
    compensation:"Kompanzasyon",
    breakerRoom:"Kesici Odası",
    breakerPanel:"Kesici Panosu",
    gas:"Gaz İstasyonu",
    gasStation:"Gaz İstasyonu",
    fireSystem:"Yangın Sistemi",
    water:"Su Deposu",
    other:"Diğer Ekipman"
  })[type]||type;
}
function dailyAssetIcon(type){
  return ({
    compressor:"◉",
    transformer:"ϟ",
    generator:"⚙",
    ups:"▣",
    compensation:"≈",
    breakerRoom:"▤",
    breakerPanel:"▤",
    gas:"◌",
    water:"◒",
    other:"⚙"
  })[type]||"□";
}
function dailyResultLabel(value){
  return ({
    normal:"Normal",
    cleaned:"Temizlik / küçük müdahale yapıldı",
    warning:"Takip edilmesi gereken durum var",
    fault:"Arıza / uygunsuzluk tespit edildi"
  })[value]||"Belirtilmedi";
}
function dailyResultOptions(record){
  return `
    <option value="">Kontrol sonucu seçiniz</option>
    <option value="normal" ${record?.result==="normal"?"selected":""}>Normal</option>
    <option value="cleaned" ${record?.result==="cleaned"?"selected":""}>Temizlik / küçük müdahale yapıldı</option>
    <option value="warning" ${record?.result==="warning"?"selected":""}>Takip edilmesi gereken durum var</option>
    <option value="fault" ${record?.result==="fault"?"selected":""}>Arıza / uygunsuzluk tespit edildi</option>`;
}
function dailyControlDetailModal(){
  const detail=s.dailyControlDetail;
  if(!detail?.assetId)return "";
  const asset=DAILY_CONTROL_ASSETS.find(item=>item.id===detail.assetId);
  if(!asset)return "";

  const isContractor=detail.kind==="contractor";
  const period=isContractor?s.contractorControlMonth:s.dailyControlDate;
  const record=isContractor
    ?contractorCheckRecord(period,asset.factory,asset.id)
    :dailyCheckRecord(period,asset.factory,asset.id);
  const done=record?.status==="done";
  const photoKey=isContractor
    ?contractorCheckKey(period,asset.factory,asset.id)
    :dailyCheckKey(period,asset.factory,asset.id);
  const periodLabel=isContractor
    ?new Date(`${period}-01T12:00:00`).toLocaleDateString("tr-TR",{month:"long",year:"numeric"})
    :new Date(`${dailyCheckDateKey(period)}T12:00:00`).toLocaleDateString("tr-TR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});
  const assignees=isContractor?[]:dailyDutyMembers(asset.factory,asset.team,period);
  const consumption=!isContractor&&asset.special?utilityConsumption(asset,period,record):null;
  const canAct=isContractor?canRecordContractorCheck(asset):(asset.special?canCompleteUtilityAsset(asset,period):canCompleteDailyAsset(asset,period));
  const canDelete=!isContractor&&canManageDailyControlCatalog();
  const detailKind=isContractor
    ?"AYLIK TAŞERON KONTROLÜ"
    :asset.special
      ?"GÜNLÜK SAYAÇ KONTROLÜ"
      :"GÜNLÜK EKİPMAN KONTROLÜ";
  const windowState=!isContractor&&asset.special?utilityWindowState(period):null;
  const managerOverride=!isContractor&&asset.special&&dailyAssetCanBeManaged(asset)&&!windowState.inWindow;
  const statsDays=[7,14,30].includes(Number(s.utilityStatsDays))?Number(s.utilityStatsDays):14;
  const utilityRows=!isContractor&&asset.special?utilityStatisticsRows(asset.factory,period,statsDays):[];

  const utilityDetails=!isContractor&&asset.type==="water"?`
    <article><small>GELEN SU SAYACI</small><b>${record?.readings?.incoming??"-"} m³</b><span>Günlük kullanım: ${consumption?.incoming??"-"} m³</span></article>
    <article><small>A BLOK SU SAYACI</small><b>${record?.readings?.aBlock??"-"} m³</b><span>Günlük kullanım: ${consumption?.aBlock??"-"} m³</span></article>
    <article><small>B BLOK SU SAYACI</small><b>${record?.readings?.bBlock??"-"} m³</b><span>Günlük kullanım: ${consumption?.bBlock??"-"} m³</span></article>
  `:!isContractor&&asset.type==="gas"?`
    <article><small>GELEN GAZ SAYACI</small><b>${record?.readings?.incoming??"-"} m³</b><span>Günlük kullanım: ${consumption?.incoming??"-"} m³</span></article>
  `:"";

  const utilityCharts=!isContractor&&asset.special?`
    <section class="daily-detail-chart-section">
      <div class="daily-detail-section-head">
        <div><small>SAYAÇ İSTATİSTİĞİ</small><h3>Son ${statsDays} Günlük Tüketim Grafiği</h3><p>Grafikler kümülatif sayaçların geçerli günlük farklarından oluşur.</p></div>
      </div>
      <div class="utility-detail-chart-grid ${asset.type==="water"?"water":"gas"}">
        ${asset.type==="water"?`
          ${utilityTrendChart(utilityRows,row=>row.water?.incoming,"İşletmeye Gelen Su","water")}
          ${utilityTrendChart(utilityRows,row=>row.water?.aBlock,"A Blok Kullanılan Su","water")}
          ${utilityTrendChart(utilityRows,row=>row.water?.bBlock,"B Blok Kullanılan Su","water")}
        `:utilityTrendChart(utilityRows,row=>row.gas?.incoming,"İşletmeye Gelen Gaz","gas")}
      </div>
    </section>
  `:"";

  const regularEditor=!isContractor&&!asset.special&&canAct?`
    <section class="daily-detail-editor">
      <div class="daily-detail-section-head">
        <div><small>YETKİLİ İŞLEM</small><h3>${done?"Kontrol Kaydını Düzenle":"Kontrolü Tamamla"}</h3><p>Sonuç, açıklama ve kontrol fotoğrafını bu pencereden kaydedin.</p></div>
      </div>
      <form class="daily-detail-regular-form" data-asset-id="${esc(asset.id)}">
        <div class="field">
          <label>Kontrol sonucu *</label>
          <select class="daily-check-result" data-asset-id="${esc(asset.id)}">${dailyResultOptions(record)}</select>
        </div>
        <div class="field">
          <label>Kontrol notu</label>
          <textarea class="daily-check-note" data-asset-id="${esc(asset.id)}" rows="3" placeholder="İsteğe bağlı açıklama">${esc(record?.note||"")}</textarea>
        </div>
        <div class="field">
          <label>Kontrol fotoğrafı ${record?.photoStored?"(değiştirmek için seçin)":"*"}</label>
          <input class="daily-check-photo" data-asset-id="${esc(asset.id)}" type="file" accept="image/*" capture="environment" ${record?.photoStored?"":"required"}>
        </div>
        <div class="daily-detail-editor-actions">
          ${done?`<button type="button" class="secondary undo-daily-check" data-asset-id="${esc(asset.id)}">Kontrolü Geri Al</button>`:""}
          <button type="button" class="primary complete-daily-check" data-asset-id="${esc(asset.id)}">${done?"Kontrolü Güncelle":"Fotoğraflı Kontrolü Kaydet"}</button>
        </div>
      </form>
    </section>
  `:"";

  const utilityEditor=!isContractor&&asset.special&&canAct?`
    <section class="daily-detail-editor">
      <div class="daily-detail-section-head">
        <div><small>YETKİLİ SAYAÇ İŞLEMİ</small><h3>${done?"Sayaç Kaydını Düzenle":"Sayaç Değerlerini Kaydet"}</h3><p>Bakım personeli için rutin giriş saati 08:00–09:00'dur; yetkili yöneticiler saat dışında düzeltme yapabilir.</p></div>
      </div>

function dailyCompletionStats(factory,dateValue){
  const assets=dailyAssetsForFactory(factory);
  const done=assets.filter(asset=>dailyCheckRecord(dateValue,factory,asset.id)?.status==="done").length;
  return {
    total:assets.length,
    done,
    pending:assets.length-done,
    percent:assets.length?Math.round(done/assets.length*100):0
  };
}
function contractorCompletionStats(factory,monthValue){
  const assets=contractorAssetsForFactory(factory);
  const done=assets.filter(asset=>contractorCheckRecord(monthValue,factory,asset.id)?.status==="done").length;
  return {
    total:assets.length,
    done,
    pending:assets.length-done,
    percent:assets.length?Math.round(done/assets.length*100):0
  };
}
function dailyCheckHistory(factory,days=7){
  const rows=[];
  for(let i=0;i<days;i++){
    const date=new Date();
    date.setHours(12,0,0,0);
    date.setDate(date.getDate()-i);
    const key=dateKeyLocal(date);
    rows.push({date:key,...dailyCompletionStats(factory,key)});
  }
  return rows;
}
function previousUtilityRecord(asset,dateValue){
  return dailyCheckRecord(dateBeforeKey(dateValue,1),asset.factory,asset.id);
}
function meterDifference(current,previous){
  const c=Number(current),p=Number(previous);
  if(!Number.isFinite(c)||!Number.isFinite(p)||c<p)return null;
  return Number((c-p).toFixed(2));
}
function utilityConsumption(asset,dateValue,record=dailyCheckRecord(dateValue,asset.factory,asset.id)){
  const previous=previousUtilityRecord(asset,dateValue);
  if(!record||!previous)return null;
  if(asset.type==="water"){
    return {
      incoming:meterDifference(record.readings?.incoming,previous.readings?.incoming),
      aBlock:meterDifference(record.readings?.aBlock,previous.readings?.aBlock),
      bBlock:meterDifference(record.readings?.bBlock,previous.readings?.bBlock)
    };
  }
  return {
    incoming:meterDifference(record.readings?.incoming,previous.readings?.incoming)
  };
}
function utilityReadingState(record,previous,fields){
  if(!record||record.status!=="done")return "missing";
  if(!previous||previous.status!=="done")return "missing_previous";
  const currentRaw=fields.map(field=>record.readings?.[field]);
  const previousRaw=fields.map(field=>previous.readings?.[field]);
  if([...currentRaw,...previousRaw].some(value=>value===null||value===undefined||String(value).trim()===""))return "invalid";
  const currentValues=currentRaw.map(Number);
  const previousValues=previousRaw.map(Number);
  if([...currentValues,...previousValues].some(value=>!Number.isFinite(value)))return "invalid";
  if(currentValues.some((value,index)=>value<previousValues[index]))return "reset";
  return "valid";
}
function utilityStatisticsRows(factory,endDate,days=14){
  const normalizedDays=[7,14,30].includes(Number(days))?Number(days):14;
  const waterAsset=dailyAssetsForFactory(factory).find(asset=>asset.type==="water");
  const gasAsset=dailyAssetsForFactory(factory).find(asset=>asset.type==="gas");
  const rows=[];

  for(let offset=normalizedDays-1;offset>=0;offset--){
    const date=dateBeforeKey(endDate,offset);
    const previousDate=dateBeforeKey(date,1);
    const waterRecord=waterAsset?dailyCheckRecord(date,factory,waterAsset.id):null;
    const previousWater=waterAsset?dailyCheckRecord(previousDate,factory,waterAsset.id):null;
    const gasRecord=gasAsset?dailyCheckRecord(date,factory,gasAsset.id):null;
    const previousGas=gasAsset?dailyCheckRecord(previousDate,factory,gasAsset.id):null;
    const waterState=waterAsset?utilityReadingState(waterRecord,previousWater,["incoming","aBlock","bBlock"]):"missing";
    const gasState=gasAsset?utilityReadingState(gasRecord,previousGas,["incoming"]):"missing";
    let water=null;
    let gas=null;

    if(waterState==="valid"){
      const incoming=meterDifference(waterRecord.readings.incoming,previousWater.readings.incoming);
      const aBlock=meterDifference(waterRecord.readings.aBlock,previousWater.readings.aBlock);
      const bBlock=meterDifference(waterRecord.readings.bBlock,previousWater.readings.bBlock);
      water={
        incoming,
        aBlock,
        bBlock,
        balance:Number((incoming-aBlock-bBlock).toFixed(2))
      };
    }
    if(gasState==="valid"){
      gas={incoming:meterDifference(gasRecord.readings.incoming,previousGas.readings.incoming)};
    }
    rows.push({date,water,gas,waterState,gasState});
  }
  return rows;
}
function utilityNumber(value,digits=2){
  if(!Number.isFinite(Number(value)))return "-";
  return Number(value).toLocaleString("tr-TR",{maximumFractionDigits:digits});
}
function utilityValues(rows,selector){
  return rows.map(selector).filter(value=>Number.isFinite(Number(value))).map(Number);
}
function utilitySum(values){
  return Number(values.reduce((sum,value)=>sum+value,0).toFixed(2));
}
function utilityTotal(values){
  return values.length?utilitySum(values):null;
}
function utilityAverage(values){
  return values.length?Number((utilitySum(values)/values.length).toFixed(2)):null;
}
function utilityMaximum(rows,selector){
  return rows.reduce((best,row)=>{
    const value=selector(row);
    return Number.isFinite(Number(value))&&(!best||Number(value)>best.value)
      ?{value:Number(value),date:row.date}
      :best;
  },null);
}
function utilityStateLabel(state){
  return ({
    valid:"Hesaplandı",
    missing:"Kayıt yok",
    missing_previous:"Önceki gün yok",
    invalid:"Geçersiz değer",
    reset:"Sayaç düşüşü / sıfırlama"
  })[state]||"Kayıt yok";
}
function utilityTrendChart(rows,selector,title,theme){
  const values=utilityValues(rows,selector);
  const max=values.length?Math.max(...values):0;
  return `<article class="utility-trend-card ${theme}">
    <div class="utility-trend-head">
      <div><small>GÜNLÜK EĞİLİM</small><h3>${esc(title)}</h3></div>
      <span>En yüksek <b>${values.length?`${utilityNumber(max)} m³`:"-"}</b></span>
    </div>
    <div class="utility-chart-scroll">
      <div class="utility-bar-chart" style="--utility-bars:${rows.length}">
        ${rows.map(row=>{
          const raw=selector(row);
          const value=Number.isFinite(Number(raw))?Number(raw):null;
          const height=value!==null&&max>0?Math.max(3,Math.round(value/max*100)):0;
          const label=new Date(`${row.date}T12:00:00`).toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit"});
          return `<div class="utility-bar-item ${value===null?"missing":""}" title="${value===null?"Geçerli tüketim verisi yok":`${utilityNumber(value)} m³`}">
            <div class="utility-bar-value">${value===null?"–":utilityNumber(value,1)}</div>
            <div class="utility-bar-track"><i style="height:${height}%"></i></div>
            <small>${label}</small>
          </div>`;
        }).join("")}
      </div>
    </div>
  </article>`;
}
function utilityEntryTimingLabel(record){
  if(!record)return "";
  if(record.entryTiming==="on_time")return "08:00–09:00 arasında alındı";
  if(record.entryTiming==="authorized_late")return "Saat dışı yetkili giriş";
  return "Kayıt saati belirtilmedi";
}

function openControlPhotoDb(){
  return new Promise((resolve,reject)=>{
    const request=indexedDB.open(CONTROL_PHOTO_DB,1);
    request.onupgradeneeded=()=>{
      const db=request.result;
      if(!db.objectStoreNames.contains(CONTROL_PHOTO_STORE)){
        db.createObjectStore(CONTROL_PHOTO_STORE);
      }
    };
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error);
  });
}
async function compressControlPhoto(file){
  if(!file)return null;
  const url=URL.createObjectURL(file);
  try{
    const image=await new Promise((resolve,reject)=>{
      const img=new Image();
      img.onload=()=>resolve(img);
      img.onerror=()=>reject(new Error("Fotoğraf okunamadı."));
      img.src=url;
    });
    const maxSize=1280;
    const scale=Math.min(1,maxSize/Math.max(image.naturalWidth,image.naturalHeight));
    const canvas=document.createElement("canvas");
    canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
    canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
    canvas.getContext("2d").drawImage(image,0,0,canvas.width,canvas.height);
    return await new Promise((resolve,reject)=>{
      canvas.toBlob(blob=>blob?resolve(blob):reject(new Error("Fotoğraf sıkıştırılamadı.")),"image/jpeg",0.68);
    });
  }finally{
    URL.revokeObjectURL(url);
  }
}
async function saveControlPhoto(key,file){
  const blob=await compressControlPhoto(file);
  const db=await openControlPhotoDb();
  await new Promise((resolve,reject)=>{
    const tx=db.transaction(CONTROL_PHOTO_STORE,"readwrite");
    tx.objectStore(CONTROL_PHOTO_STORE).put(blob,key);
    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
  });
  db.close();
}
async function getControlPhoto(key){
  const db=await openControlPhotoDb();
  const blob=await new Promise((resolve,reject)=>{
    const tx=db.transaction(CONTROL_PHOTO_STORE,"readonly");
    const request=tx.objectStore(CONTROL_PHOTO_STORE).get(key);
    request.onsuccess=()=>resolve(request.result||null);
    request.onerror=()=>reject(request.error);
  });
  db.close();
  return blob;
}
async function deleteControlPhoto(key){
  const db=await openControlPhotoDb();
  await new Promise((resolve,reject)=>{
    const tx=db.transaction(CONTROL_PHOTO_STORE,"readwrite");
    tx.objectStore(CONTROL_PHOTO_STORE).delete(key);
    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
  });
  db.close();
}
async function showControlPhoto(key,title="Kontrol Fotoğrafı"){
  try{
    const blob=await getControlPhoto(key);
    if(!blob){
      alert("Fotoğraf kaydı bulunamadı.");
      return;
    }
    const url=URL.createObjectURL(blob);
    const viewer=document.createElement("div");
    viewer.className="control-photo-viewer";
    viewer.innerHTML=`<div class="control-photo-dialog"><div><b>${esc(title)}</b><button type="button">×</button></div><img alt="${esc(title)}"></div>`;
    viewer.querySelector("img").src=url;
    const close=()=>{
      URL.revokeObjectURL(url);
      viewer.remove();
    };
    viewer.querySelector("button").onclick=close;
    viewer.onclick=e=>{if(e.target===viewer)close()};
    document.body.appendChild(viewer);
  }catch(error){
    console.error(error);
    alert("Fotoğraf görüntülenemedi.");
  }
}

function workStatusClass(status){return String(status||"open").replaceAll("_","-")}

  return `${prefix}-${Math.max(base,...nums)+1}`;
}

  if(!permissions().manageRequests)return false;
  if(!workItemFactoryVisible(item))return false;
  const team=item.assignedTeam||workTeamForCategory(item.category);
  if(s.user?.role==="Elektrik Bakım Formeni")return team==="Elektrik Bakım";
  if(s.user?.role==="Mekanik Bakım Formeni")return team==="Mekanik Bakım";
  if(s.user?.role==="Bakım Formeni")return true;
  return false;
}
function canUpdateWorkOrder(item){
  if(!item||item.kind!=="workorder")return false;
  if(isDeveloper())return workItemFactoryVisible(item);
  if(s.user?.role==="Bakım Müdürü")return true;
  if(canManageWorkRequest(item))return true;
  return !!permissions().updateAssignedWorkOrders&&item.assignedTo===s.user?.name;
}
function canManageContractorWork(item=null){
  if(item&&item.kind!=="contractor")return false;
  if(item&&!workItemFactoryVisible(item))return false;
  if(isDeveloper())return true;
  return ["Bakım Müdürü","Elektrik Bakım Formeni","Mekanik Bakım Formeni","Bakım Formeni"].includes(s.user?.role);
}
function canEditWorkItemCore(item){
  if(!item)return false;
  if(item.kind==="contractor")return canManageContractorWork(item);
  if(isDeveloper())return workItemFactoryVisible(item);
  if(s.user?.role==="Bakım Müdürü")return true;
  if(canManageWorkRequest(item))return true;
  if(item.kind==="request"&&permissions().allDepartmentForemanRights&&workItemFactoryVisible(item))return true;
  return item.kind==="request"
    &&permissions().createRequest
    &&item.createdBy===s.user?.name
    &&["new","reviewing"].includes(item.status);
}
function canDeleteWorkItem(item){
  if(!item)return false;
  if(item.kind==="contractor")return canManageContractorWork(item);
  if(item.kind==="workorder"){
    return canManageWorkRequest(item);
  }
  if(item.kind==="request"){
    if(permissions().allDepartmentForemanRights)return workItemFactoryVisible(item);
    return s.user?.role==="Bölüm Formeni"
      &&workItemFactoryVisible(item)
      &&item.department===s.user?.department;
  }
  return false;
}
function deleteWorkItemById(id){
  const item=findWorkItemById(id);
  if(!item)return {ok:false,message:"Kayıt bulunamadı."};
  if(!canDeleteWorkItem(item)){
    return {
      ok:false,
      message:item.kind==="request"
        ?"İş taleplerini yalnızca ilgili bölüm formeni silebilir."
        :item.kind==="contractor"
          ?"Taşeron işlerini yalnızca bakım formenleri veya bakım müdürü yönetebilir."
          :"İş emirlerini yalnızca bakım müdürü veya yetkili bakım formeni silebilir."
    };
  }

  if(item.kind==="request"){
    const linked=s.workItems.find(x=>x.kind==="workorder"&&String(x.sourceRequestId)===String(item.id));
    if(linked){
      return {
        ok:false,
        message:`Bu talebe bağlı ${linked.id} numaralı iş emri bulunuyor. Önce bağlı iş emrini silmelisiniz.`
      };
    }
  }

  if(item.kind==="workorder"&&item.sourceRequestId){
    const request=findWorkItemById(item.sourceRequestId);
    if(request){
      request.status="approved";
      request.convertedBy="";
      request.convertedAt=null;
      request.completedAt=null;
    }
  }

  s.workItems=s.workItems.filter(x=>String(x.id)!==String(id));
  saveWorkItems();
  return {ok:true,item};
}
function visibleWorkItems(){
  let items=[...s.workItems];
  if(s.user?.role==="Bakım Müdürü"||permissions().allFactories){}
  else items=items.filter(workItemFactoryVisible);
  if(s.user?.role==="Bölüm Formeni")items=items.filter(x=>x.department===s.user.department);
  if(s.user?.role==="Bakım Personeli")items=items.filter(x=>x.kind==="workorder"&&x.assignedTo===s.user.name);
  return items.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
}
function workMaterials(item){return safeRecordArray(item?.usedMaterials,[])}
function workSearchMatches(item,query){
  if(!query)return true;
  const searchable=[
    item.id,item.kind,item.factory,item.department,item.location,item.title,item.category,
    item.priority,item.description,item.createdBy,item.assignedTeam,item.assignedTo,
    item.workDescription,item.contractorCompany,item.startDate,item.endDate,
    workStatusLabel(item.status,item.kind)
  ].join(" ").toLocaleLowerCase("tr-TR");
  return searchable.includes(query.toLocaleLowerCase("tr-TR"));
}
