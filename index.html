<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ETİLİSMART</title><style>:root{--y:#f2b21a;--d:#15181c;--m:#6b7280;--bg:#f4f6f8;--w:#fff;--l:#e5e7eb;--g:#1f9d63;--r:#d64545}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--d)}button,input,select,textarea{font:inherit}.top{height:68px;background:var(--d);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font-weight:900}.brand span{color:var(--y)}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 68px)}aside{background:#fff;border-right:1px solid var(--l);padding:18px}.nav{width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:10px;margin-bottom:8px}.nav:hover,.nav.active{background:#fff7dc;font-weight:700}main{padding:24px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.head h1{margin:0}.head p{margin:6px 0 0;color:var(--m)}.primary{border:0;background:var(--y);font-weight:800;padding:11px 16px;border-radius:10px}.secondary{border:1px solid var(--l);background:#fff;padding:10px 14px;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.06)}.label{font-size:13px;color:var(--m)}.value{font-size:30px;font-weight:900;margin-top:8px}.section{margin-top:20px}.table{overflow:auto;background:#fff;border:1px solid var(--l);border-radius:16px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:13px;border-bottom:1px solid var(--l);text-align:left}th{font-size:12px;color:var(--m);background:#fafafa}.status{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.open{background:#fff0f0;color:#b52d2d}.progress{background:#fff7dc;color:#8a6400}.done{background:#e7f7ef;color:#147348}.form{max-width:850px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:7px}.full{grid-column:1/-1}label{font-size:13px;font-weight:700}input,select,textarea{border:1px solid #d9dee5;border-radius:10px;padding:11px;background:#fff}textarea{min-height:110px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#121519,#282d33);padding:20px}.loginbox{width:min(430px,100%);background:#fff;border-radius:22px;padding:30px}.logo{width:58px;height:58px;background:var(--y);border-radius:15px;display:grid;place-items:center;font-weight:900;margin-bottom:16px}.notice{padding:12px;background:#eef6ff;color:#1f5f9f;border-radius:10px;font-size:13px;margin:14px 0}.loginbox .field{margin-bottom:14px}.loginbox .primary{width:100%}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:none}.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){main{padding:16px}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.head{align-items:flex-start;flex-direction:column;gap:12px}}
.stop{color:#c62828}.field small{color:var(--m);font-size:12px}.check{justify-content:flex-end;padding-bottom:10px}.check label{display:flex;align-items:center;gap:8px}.check input{width:18px;height:18px}

.livebox{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:18px;box-shadow:var(--shadow)}
.livebox strong{display:block;text-transform:capitalize;font-size:14px}
.livebox span{display:block;font-size:25px;font-weight:900;margin-top:3px}
.shiftpill{background:#fff7dc;border:1px solid #f5d675;border-radius:13px;padding:9px 14px;text-align:right}
.shiftpill b,.shiftpill small{display:block}
.shiftpill small{color:#6b7280;margin-top:3px}
.login-error{min-height:20px;color:#c62828;font-size:13px;margin-bottom:8px}
.layoutfilters{display:grid;grid-template-columns:220px 220px 1fr;gap:16px;align-items:end;margin-bottom:18px}
.legend{display:flex;justify-content:flex-end;gap:18px;padding-bottom:10px;font-size:13px}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}
.dot.running{background:#20a464}.dot.warning{background:#f0a500}.dot.stopped{background:#d64545}
.plant-map{display:flex;flex-direction:column;gap:16px}
.dept-block{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:var(--shadow)}
.dept-title{font-weight:900;margin-bottom:13px;display:flex;align-items:center;gap:9px}
.dept-title span{width:27px;height:27px;border-radius:8px;background:var(--yellow);display:grid;place-items:center;font-size:12px}
.flow-row{display:flex;align-items:stretch;overflow-x:auto;padding-bottom:5px}
.machine-card{min-width:145px;max-width:145px;border-radius:12px;padding:12px;border:2px solid #ddd;background:#fafafa}
.machine-card.running{border-color:#20a464;background:#edfaf4}
.machine-card.warning{border-color:#f0a500;background:#fff8e5}
.machine-card.stopped{border-color:#d64545;background:#fff0f0}
.machine-name{font-size:12px;font-weight:800;line-height:1.3;min-height:46px}
.machine-status{font-size:11px;margin-top:8px;font-weight:800}
.machine-card.running .machine-status{color:#14804c}
.machine-card.warning .machine-status{color:#9b6900}
.machine-card.stopped .machine-status{color:#b52d2d}
.arrow{display:grid;place-items:center;min-width:28px;font-size:20px;color:#9aa1aa}
@media(max-width:800px){
  .livebox{align-items:flex-start;gap:12px}
  .livebox span{font-size:20px}
  .layoutfilters{grid-template-columns:1fr}
  .legend{justify-content:flex-start;flex-wrap:wrap}
}

.dashboard-filter{margin-bottom:18px;max-width:300px}
.report-filter{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:14px;align-items:end;margin-bottom:18px}
.report-filter button{height:43px}
.report-cards .value small{font-size:14px}
.machine-link{border:0;background:none;padding:0;color:#8a6500;text-decoration:underline;cursor:pointer;font:inherit;font-weight:700}
.machine-card{cursor:pointer;text-align:left;font-family:inherit}
.machine-card:hover{transform:translateY(-2px);box-shadow:0 7px 18px rgba(0,0,0,.08)}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,20,26,.58);display:flex;align-items:center;justify-content:center;padding:24px;z-index:999}
.modal{background:#fff;border-radius:18px;width:min(1100px,96vw);max-height:88vh;overflow:auto;padding:20px;box-shadow:0 22px 70px rgba(0,0,0,.28)}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
.modal-head h2{margin:0}.modal-head p{margin:4px 0 0;color:var(--m)}
.modal-head button{border:0;background:#f1f3f5;border-radius:10px;width:36px;height:36px;font-size:24px;cursor:pointer}
.machine-summary{display:flex;gap:16px;margin-bottom:14px}
.machine-summary span{background:#fff7dc;border:1px solid #f3d46d;border-radius:10px;padding:9px 12px}
.duration{white-space:nowrap}
@media(max-width:800px){
  .report-filter{grid-template-columns:1fr}
  .modal{padding:12px}
}

.chartgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:18px 0}
.chartgrid.single{grid-template-columns:1fr}
.chartbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.chartbox h4{margin:0 0 8px}
.chartbox svg{width:100%;height:auto}
.chartbox text{font-size:11px;fill:#69717c}
.chartbox .axis{stroke:#cfd5dc;stroke-width:1}
.chartbox .line{fill:none;stroke:#d7a900;stroke-width:4}
.chartbox .point{fill:#d7a900}
.chartbox .bar{fill:#d7a900}
.chartbox .val{font-weight:700;fill:#333}
.machine-modal{width:min(1180px,97vw)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--line);background:#f7f8fa;border-radius:10px;padding:9px 13px;cursor:pointer}
.tabs button.active{background:var(--yellow);border-color:var(--yellow);font-weight:800}
.machine-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.metric{background:#fafafa;border:1px solid var(--line);border-radius:12px;padding:14px}
.metric span,.metric b{display:block}
.metric span{color:var(--m);font-size:12px}
.metric b{font-size:22px;margin-top:5px}
.metric.wide{grid-column:span 3}
.metric.wide b{font-size:16px}
.machine-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.info-card,.empty-panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.info-card h4,.empty-panel h3{margin-top:0}
@media(max-width:900px){
  .chartgrid,.machine-info-grid{grid-template-columns:1fr}
  .machine-kpis{grid-template-columns:1fr 1fr}
  .metric.wide{grid-column:span 2}
}

.chart-range{display:grid;grid-template-columns:220px 180px 1fr;gap:14px;align-items:end;margin:18px 0}
.range-note{color:var(--m);font-size:13px;padding-bottom:10px}
.scope-badge{display:inline-block;margin-top:8px;background:#fff7dc;border:1px solid #f0d16b;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}
.hidden{display:none!important}
@media(max-width:800px){
  .chart-range{grid-template-columns:1fr}
  .range-note{padding-bottom:0}
}

.section-title-row{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:10px}
.section-title-row h3{margin:0}
.section-title-row p{margin:4px 0 0;color:var(--m);font-size:13px}
.count-badge{background:#fff7dc;border:1px solid #efd36f;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800;white-space:nowrap}
@media(max-width:700px){
  .section-title-row{align-items:flex-start;flex-direction:column}
}

.operator-head{align-items:center}
.operator-new-btn{font-size:16px;padding:13px 18px}
.operator-grid{margin-top:18px}
@media(max-width:700px){
  .operator-head{align-items:stretch}
  .operator-new-btn{width:100%}
}

.management-section{margin:24px 0}
.management-section .chartgrid{grid-template-columns:1fr 1fr}
@media(max-width:900px){
  .management-section .chartgrid{grid-template-columns:1fr}
}

.chart-panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.chart-panel .chartbox{border:0;box-shadow:none;padding:0;margin-top:10px}
.chart-panel .chartbox>h4{display:none}
.chart-panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;border-bottom:1px solid var(--line);padding-bottom:12px}
.chart-panel-head h4{margin:0}
.chart-panel-head small{display:block;color:var(--m);margin-top:4px}
.chart-local-controls{display:grid;grid-template-columns:130px 110px;gap:8px;min-width:250px}
.chart-local-controls .field label{font-size:11px}
.chart-local-controls select,.chart-local-controls input{padding:7px 8px;font-size:13px}
@media(max-width:700px){
  .chart-panel-head{flex-direction:column}
  .chart-local-controls{grid-template-columns:1fr 1fr;min-width:0;width:100%}
}


/* QR Kod eklentisi */
.qr-scan-button,.machine-qr-button{border:0;border-radius:11px;background:#111;color:#fff;font-weight:800;cursor:pointer}
.qr-scan-button{padding:11px 16px}
.machine-qr-button{width:auto!important;min-width:52px!important;padding:0 12px!important;font-size:13px!important;background:var(--yellow,#f5b800)!important;color:#111!important}
.modal-head-actions{display:flex;gap:8px;align-items:center}
.qr-modal{width:min(720px,96vw)}
.qr-generator-layout{display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:center}
.qr-code-box{width:250px;min-height:250px;padding:15px;border:1px solid var(--line);border-radius:16px;background:#fff;display:grid;place-items:center}
.qr-code-box img,.qr-code-box canvas{max-width:220px!important;height:auto!important}
.qr-help h3{margin-top:0}.qr-help p{color:var(--m);line-height:1.55}
.qr-reader{width:100%;max-width:480px;margin:0 auto;border-radius:14px;overflow:hidden}
.qr-message{padding:12px;text-align:center;color:var(--m)}
.qr-manual{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);display:grid;gap:8px}
.qr-manual label{font-weight:700;font-size:13px}
.qr-manual textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical}
.qr-filled-info:empty{display:none}.qr-filled-info{margin:0 0 12px;padding:11px 14px;border-radius:11px;background:#e8f7ee;color:#16754d;font-weight:700;font-size:13px}
@media(max-width:680px){
  .qr-generator-layout{grid-template-columns:1fr}
  .qr-code-box{margin:auto}
  .head .qr-scan-button{width:100%;margin-top:10px}
}
@media print{
  body *{visibility:hidden!important}
  .qr-modal,.qr-modal *{visibility:visible!important}
  .qr-modal{position:absolute;left:0;top:0;width:100%;box-shadow:none}
  .qr-close,#printQr,.qr-help p{display:none!important}
}

.qr-machine-hero{display:flex;gap:16px;align-items:center;padding:18px;border-radius:16px;background:var(--soft,#f7f7f7);margin-bottom:16px}
.qr-machine-icon{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:var(--yellow,#f5b800);font-size:30px;color:#111}
.qr-machine-hero h3{margin:8px 0 4px;font-size:22px}.qr-machine-hero p{margin:0;color:var(--m)}
.qr-machine-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qr-machine-grid .info-card{padding:14px;border:1px solid var(--line);border-radius:13px;background:#fff}
.qr-machine-grid .info-card span{display:block;color:var(--m);font-size:12px;margin-bottom:7px}
.qr-machine-grid .info-card b{font-size:15px}
.qr-last-fault{margin-top:16px;padding:16px;border:1px solid var(--line);border-radius:14px}
.qr-last-fault h4{margin:0 0 10px}.qr-last-fault p{margin:5px 0;color:var(--m)}.qr-last-fault p b{color:var(--text,#111)}
.qr-machine-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
@media(max-width:680px){
  .qr-machine-grid{grid-template-columns:repeat(2,1fr)}
  .qr-machine-actions{flex-direction:column-reverse}
  .qr-machine-actions button{width:100%}
}


.home-action-buttons{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qr-home-button{border:1px solid #111;background:#111;color:#fff;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
.qr-home-card{display:flex;align-items:center;gap:16px;padding:18px 20px;margin:0 0 18px;border-radius:16px;background:linear-gradient(135deg,#fff7d1,#fff);border:1px solid #f0d56b;box-shadow:0 5px 18px rgba(0,0,0,.05)}
.qr-home-symbol{width:54px;height:54px;display:grid;place-items:center;border-radius:14px;background:#f5b800;color:#111;font-size:30px;font-weight:900;flex:0 0 auto}
.qr-home-card div:nth-child(2){display:flex;flex-direction:column;gap:5px;flex:1}
.qr-home-card b{font-size:17px}.qr-home-card span{font-size:13px;color:var(--m)}
@media(max-width:680px){
 .home-action-buttons{width:100%}.home-action-buttons button{flex:1}
 .qr-home-card{align-items:flex-start;flex-wrap:wrap}.qr-home-card button{width:100%}
}


/* Yönetici mobil görünümü */
.top-user{display:flex;align-items:center;gap:8px}
.top-user-role{font-size:12px;color:#c9cdd2}
.mobile-bottom-nav{display:none}

@media(max-width:900px){
  body{padding-bottom:76px}
  .top{
    height:58px;
    padding:0 12px;
    position:sticky;
    top:0;
    z-index:50;
    box-shadow:0 3px 14px rgba(0,0,0,.18)
  }
  .brand{font-size:17px}
  .top-user{gap:7px;min-width:0}
  .top-user-name{display:none}
  .top-user-role{
    display:block;
    max-width:118px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    color:#fff;
    font-size:11px
  }
  .top .secondary{padding:7px 9px;font-size:11px;border-color:#444;background:#24282d;color:#fff}
  .layout{min-height:calc(100vh - 58px)}
  main{padding:14px 12px 22px}
  .head{margin-bottom:14px;gap:10px}
  .head h1{font-size:23px;line-height:1.15}
  .head p{font-size:13px}
  .head>.primary,.head>.home-action-buttons{width:100%}
  .home-action-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .home-action-buttons button{width:100%;padding:11px 8px;font-size:13px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card{padding:14px;border-radius:13px;box-shadow:0 4px 14px rgba(0,0,0,.045)}
  .value{font-size:25px}
  .label{font-size:12px}
  .section{margin-top:14px}
  .dashboard-filter{max-width:none;margin-bottom:12px}
  .qr-home-card{margin-bottom:12px;padding:14px;gap:12px}
  .qr-home-symbol{width:46px;height:46px;font-size:24px}
  .qr-home-card b{font-size:15px}
  .qr-home-card span{font-size:12px;line-height:1.4}
  .clock-block{grid-template-columns:1fr 1fr!important;gap:8px!important}
  .clock-block>*:last-child{grid-column:1/-1}
  .report-filter,.layoutfilters{grid-template-columns:1fr!important;gap:10px!important}
  .chart-grid,.charts-grid,.machine-info-grid,.machine-kpis{grid-template-columns:1fr!important}
  .plant-map{overflow:hidden}
  .dept-block{padding:12px!important}
  .flow-row{overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
  .machine-card{min-width:135px;max-width:135px}
  .modal-backdrop{padding:0!important;align-items:flex-end!important}
  .modal{
    width:100%!important;
    max-width:none!important;
    max-height:92vh!important;
    border-radius:20px 20px 0 0!important;
    padding:16px!important;
    overflow:auto
  }
  .modal-head h2{font-size:20px}
  .tabs{overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
  .tabs button{flex:0 0 auto}
  .qr-machine-grid{grid-template-columns:1fr 1fr}
  .actions{position:sticky;bottom:0;background:#fff;padding-top:10px}
  .actions button{flex:1}
  .mobile-bottom-nav{
    position:fixed;
    left:0;right:0;bottom:0;
    height:68px;
    display:flex;
    align-items:stretch;
    background:#fff;
    border-top:1px solid var(--l);
    box-shadow:0 -5px 18px rgba(0,0,0,.10);
    z-index:90;
    padding-bottom:env(safe-area-inset-bottom)
  }
  .mobile-bottom-nav button{
    flex:1;
    min-width:0;
    border:0;
    background:#fff;
    color:#777;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    padding:5px 2px
  }
  .mobile-bottom-nav button span{font-size:20px;line-height:1}
  .mobile-bottom-nav button small{font-size:10px;white-space:nowrap}
  .mobile-bottom-nav button.active{color:#111;background:#fff8df;font-weight:800}
}

@media(max-width:620px){
  .formgrid{grid-template-columns:1fr}
  input,select,textarea{font-size:16px} /* iPhone otomatik yakınlaştırmayı engeller */
  .table-wrap{padding:0;background:transparent;border:0;box-shadow:none;overflow:visible}
  .table-wrap table,.table-wrap tbody,.table-wrap tr,.table-wrap td{display:block;width:100%}
  .table-wrap thead{display:none}
  .table-wrap tr{
    background:#fff;
    border:1px solid var(--l);
    border-radius:14px;
    margin-bottom:10px;
    padding:7px 12px;
    box-shadow:0 4px 13px rgba(0,0,0,.045)
  }
  .table-wrap td{
    min-height:36px;
    padding:9px 0 9px 42%;
    border-bottom:1px dashed #e7e9ec;
    position:relative;
    text-align:left;
    overflow-wrap:anywhere
  }
  .table-wrap td:last-child{border-bottom:0}
  .table-wrap td::before{
    content:attr(data-label);
    position:absolute;
    left:0;
    top:10px;
    width:38%;
    color:var(--m);
    font-size:11px;
    font-weight:700
  }
  .table-wrap .sel{width:100%;padding:9px}
  .status{display:inline-block}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid .card{min-width:0}
  .value{font-size:22px}
  .head .primary{width:100%}
  .report-cards{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .report-cards .card:last-child{grid-column:1/-1}
}

@media(max-width:380px){
  main{padding-left:9px;padding-right:9px}
  .grid{gap:7px}
  .card{padding:11px}
  .value{font-size:20px}
  .mobile-bottom-nav button small{font-size:9px}
}


.mobile-top-tabs{display:none}
@media(max-width:900px){
  body{padding-bottom:0!important}
  .mobile-bottom-nav{display:none!important}
  .mobile-top-tabs{
    display:flex;
    position:sticky;
    top:58px;
    z-index:49;
    width:100%;
    overflow-x:auto;

function seededRandom(seed){
  let value=seed % 2147483647;
  return function(){
    value=value*16807%2147483647;
    return (value-1)/2147483646;
  }
}

function generateHistory(){
  const rnd=seededRandom(20260725);
  const factories=Object.keys(FACTORIES);
  const departments=Object.keys(STRUCTURE);
  const types=TYPES;
  const arr=[];
  let id=2000;
  const now=new Date();

  for(let i=0;i<260;i++){
    const factory=factories[Math.floor(rnd()*factories.length)];
    const line=FACTORIES[factory][Math.floor(rnd()*FACTORIES[factory].length)];
    const department=departments[Math.floor(rnd()*departments.length)];
    const machine=STRUCTURE[department][Math.floor(rnd()*STRUCTURE[department].length)];
    const type=types[Math.floor(rnd()*types.length)];
    const subjectList=SUBJECTS[type];
    const subject=subjectList[Math.floor(rnd()*subjectList.length)];
    const daysAgo=2+Math.floor(rnd()*205);
    const start=new Date(now);
    start.setDate(now.getDate()-daysAgo);
    start.setHours(Math.floor(rnd()*24),Math.floor(rnd()*60),0,0);
    const duration=5+Math.floor(rnd()*235);
    const end=new Date(start.getTime()+duration*60000);
    const stopped=rnd()>0.58;
    arr.push({
      id:id++,
      factory,line,department,machine,type,subject,
      description:"Geçmiş örnek arıza kaydı. Müdahale tamamlandı ve kayıt kapatıldı.",
      stopped,photoName:"",status:"done",
      createdAt:start.toISOString(),closedAt:end.toISOString()
    });
  }

  arr.push(
    {id:1001,factory:"1. Fabrika",line:"1. Hat",department:"Pres Bölümü",machine:"Presler",type:"Hidrolik",subject:"Yağ basıncı düşük",description:"Basınç normal seviyenin altında.",stopped:true,photoName:"",status:"open",createdAt:new Date(Date.now()-42*60000).toISOString(),closedAt:null},
    {id:1002,factory:"2. Fabrika B Blok",line:"2. Hat",department:"Paketleme",machine:"Etiket Yazıcı",type:"Elektrik",subject:"Etiket yazdırmıyor",description:"Yazıcı çevrimiçi ancak çıktı alınamıyor.",stopped:false,photoName:"",status:"progress",createdAt:new Date(Date.now()-18*60000).toISOString(),closedAt:null}
  );
  return arr;
}

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

function fmtDate(value){
  const d=new Date(value);
  if(Number.isNaN(d.getTime()))return "-";
  return d.toLocaleString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
}
function durationMs(fault){
  const start=new Date(fault.createdAt).getTime();
  const end=fault.closedAt?new Date(fault.closedAt).getTime():Date.now();
  return Math.max(0,end-start);
}
function durationText(fault){
  const totalMinutes=Math.floor(durationMs(fault)/60000);
  const days=Math.floor(totalMinutes/1440);
  const hours=Math.floor((totalMinutes%1440)/60);
  const minutes=totalMinutes%60;
  if(days>0)return `${days} gün ${hours} sa ${minutes} dk`;
  if(hours>0)return `${hours} sa ${minutes} dk`;
  return `${minutes} dk`;
}
function shiftInfo(date=new Date()){
  const h=date.getHours();
  if(h<8)return {name:"00–08 Vardiyası",range:"00:00–08:00",startHour:0,endHour:8};
  if(h<16)return {name:"08–16 Vardiyası",range:"08:00–16:00",startHour:8,endHour:16};
  return {name:"16–00 Vardiyası",range:"16:00–00:00",startHour:16,endHour:24};
}
function isInCurrentShift(fault){
  const now=new Date();
  const shift=shiftInfo(now);
  const start=new Date(now);
  start.setHours(shift.startHour,0,0,0);
  const end=new Date(start);
  if(shift.endHour===24)end.setDate(end.getDate()+1);
  end.setHours(shift.endHour===24?0:shift.endHour,0,0,0);
  const created=new Date(fault.createdAt);
  return created>=start&&created<end;
}

function periodLabel(d,chartId){
  const unit=chartConfig(chartId).unit;
  if(unit==="hour")return d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
  if(unit==="shift"){
    const h=d.getHours();
    const name=h<8?"00–08":h<16?"08–16":"16–00";
    return `${d.toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit"})} ${name}`;
  }
  if(unit==="day")return d.toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit"});
  return d.toLocaleDateString("tr-TR",{month:"short",year:"2-digit"});
}
function trendDataFor(base,chartId){
  const cfg=chartConfig(chartId);
  const a=chartRangeFaultsFor(base,chartId);
  const now=new Date();
  const n=Math.max(1,Number(cfg.value)||1);
  const buckets=[];
  if(cfg.unit==="hour"){
    for(let i=n-1;i>=0;i--){
      const start=new Date(now.getTime()-(i+1)*3600000),end=new Date(now.getTime()-i*3600000);
      buckets.push({start,end,label:periodLabel(end,chartId),value:0});
    }
  }else if(cfg.unit==="shift"){
    for(let i=n-1;i>=0;i--){
      const end=new Date(now.getTime()-i*8*3600000),start=new Date(end.getTime()-8*3600000);
      buckets.push({start,end,label:periodLabel(start,chartId),value:0});
    }
  }else if(cfg.unit==="day"){
    for(let i=n-1;i>=0;i--){
      const start=new Date(now);start.setDate(now.getDate()-i);start.setHours(0,0,0,0);
      const end=new Date(start);end.setDate(start.getDate()+1);
      buckets.push({start,end,label:periodLabel(start,chartId),value:0});
    }
  }else{
    for(let i=n-1;i>=0;i--){
      const start=new Date(now.getFullYear(),now.getMonth()-i,1);
      const end=new Date(now.getFullYear(),now.getMonth()-i+1,1);
      buckets.push({start,end,label:periodLabel(start,chartId),value:0});
    }
  }
  a.forEach(f=>{
    const t=new Date(f.createdAt);
    const b=buckets.find(x=>t>=x.start&&t<x.end);
    if(b)b.value++;
  });
  return buckets;
}

function machineCodeFor(factory,line,machine){
  const registered=Object.values(MACHINE_QR_REGISTRY).find(x=>x.factory===factory&&x.line===line&&x.machine===machine);
  if(registered)return registered.machineCode;
  const dept=findMachineDepartment(machine);
  const f=factory.startsWith("1.")?"F1":factory.includes("A Blok")?"F2A":"F2B";
  const l=(line.match(/\d+/)||["1"])[0];
  const depCodes={"Masse Bölümü":"MAS","Pres Bölümü":"PRS","Sır Bantları":"SIR","Fırınlar":"FRN","Polisaj":"POL","Paketleme":"PAK"};
  const idx=Math.max(0,(STRUCTURE[dept]||[]).indexOf(machine))+1;
  return `${f}-H${l}-${depCodes[dept]||"GEN"}-${String(idx).padStart(3,"0")}`;
}

function lineChartSVG(data,title){
  const safe=data.length?data:[{label:"Yok",value:0}];
  const w=680,h=250,pL=42,pR=18,pT=22,pB=52,max=Math.max(...safe.map(x=>x.value),1);
  const usableW=w-pL-pR,usableH=h-pT-pB;
  const pts=safe.map((x,i)=>`${pL+i*usableW/Math.max(safe.length-1,1)},${pT+usableH-x.value*usableH/max}`).join(" ");
  const labelStep=Math.max(1,Math.ceil(safe.length/7));
  return `<div class="chartbox chart-scroll"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(title)}">
    ${[0,.25,.5,.75,1].map(r=>`<line x1="${pL}" y1="${pT+usableH*r}" x2="${w-pR}" y2="${pT+usableH*r}" class="gridline"/>`).join("")}
    <path d="M ${pts.replaceAll(" "," L ")} L ${w-pR} ${h-pB} L ${pL} ${h-pB} Z" class="area"/>
    <polyline points="${pts}" class="line"/>
    ${safe.map((x,i)=>{const cx=pL+i*usableW/Math.max(safe.length-1,1),cy=pT+usableH-x.value*usableH/max;return `<circle cx="${cx}" cy="${cy}" r="4" class="point"><title>${esc(x.label)}: ${x.value}</title></circle>${i%labelStep===0||i===safe.length-1?`<text x="${cx}" y="${h-19}" text-anchor="middle">${esc(String(x.label).slice(0,8))}</text>`:""}`}).join("")}
  </svg></div>`;
}
function barChartSVG(data,title){
  const safe=data.length?data:[{label:"Yok",value:0}];
  const w=680,h=260,pL=42,pR=18,pT=25,pB=66,max=Math.max(...safe.map(x=>x.value),1);
  const usableW=w-pL-pR,usableH=h-pT-pB;
  const slot=usableW/Math.max(safe.length,1),bw=Math.min(56,slot*.58);
  return `<div class="chartbox chart-scroll"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(title)}">
    ${[0,.25,.5,.75,1].map(r=>`<line x1="${pL}" y1="${pT+usableH*r}" x2="${w-pR}" y2="${pT+usableH*r}" class="gridline"/>`).join("")}
    ${safe.map((x,i)=>{const xPos=pL+i*slot+(slot-bw)/2,bh=x.value*usableH/max,y=pT+usableH-bh,label=String(x.label);return `<rect x="${xPos}" y="${y}" width="${bw}" height="${Math.max(bh,2)}" rx="7" class="bar"><title>${esc(label)}: ${x.value}</title></rect><text x="${xPos+bw/2}" y="${h-34}" text-anchor="middle">${esc(label.length>12?label.slice(0,11)+"…":label)}</text><text x="${xPos+bw/2}" y="${Math.max(16,y-7)}" text-anchor="middle" class="val">${x.value}</text>`}).join("")}
  </svg></div>`;
}

const qrLibraryState={generator:null,scanner:null};
function loadExternalScript(src){
  return new Promise((resolve,reject)=>{
    const existing=[...document.scripts].find(x=>x.src===src);
    if(existing){
      if(existing.dataset.loaded==="1")return resolve();
      existing.addEventListener("load",resolve,{once:true});
      existing.addEventListener("error",reject,{once:true});
      return;
    }
    const script=document.createElement("script");
    script.src=src;
    script.async=true;
    script.onload=()=>{script.dataset.loaded="1";resolve()};
    script.onerror=()=>reject(new Error("Kütüphane yüklenemedi"));
    document.head.appendChild(script);
  });
}
async function ensureQrGenerator(){
  if(typeof QRCode!=="undefined")return true;
  if(!qrLibraryState.generator){
    qrLibraryState.generator=loadExternalScript("https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js");
  }
  try{await qrLibraryState.generator;return typeof QRCode!=="undefined"}
  catch(e){qrLibraryState.generator=null;return false}
}
async function ensureQrScanner(){
  if(typeof Html5Qrcode!=="undefined")return true;
  if(!qrLibraryState.scanner){
    qrLibraryState.scanner=loadExternalScript("https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js");
  }
  try{await qrLibraryState.scanner;return typeof Html5Qrcode!=="undefined"}
  catch(e){qrLibraryState.scanner=null;return false}
}

function machineQrPayload(factory,line,department,machine){
  return JSON.stringify({
    app:"ETILISMART",
    version:1,
    action:"machine-info",
    factory,
    line,
    department,
    machine
  });
}
function findMachineDepartment(machine){
  return Object.entries(STRUCTURE).find(([,machines])=>machines.includes(machine))?.[0]||"";
}
function openQrScanner(){
  s.qrModal={mode:"scan"};
  render();
  setTimeout(startQrScanner,80);
}
function openQrGenerator(factory,line,machine){
  s.qrModal={mode:"generate",factory,line,machine,department:findMachineDepartment(machine)};
  render();
  setTimeout(renderMachineQr,40);
}
function closeQrModal(){
  stopQrScanner();
  s.qrModal=null;
  render();
}
async function startQrScanner(){
  const reader=document.getElementById("qr-reader");
  if(!reader)return;
  const scannerReady=await ensureQrScanner();
  if(!scannerReady){
    const msg=document.getElementById("qrMessage");
    if(msg)msg.textContent="QR tarama özelliği yüklenemedi. İnternet bağlantısını kontrol edin; uygulamanın diğer bölümleri çalışmaya devam eder.";
    return;
  }
  stopQrScanner();
  s.qrScanner=new Html5Qrcode("qr-reader");
  s.qrScanner.start(
    {facingMode:"environment"},
    {fps:10,qrbox:{width:240,height:240}},
    decoded=>{
      applyQrPayload(decoded);
      stopQrScanner();
    },
    ()=>{}
  ).catch(err=>{
    const msg=document.getElementById("qrMessage");
    if(msg)msg.textContent="Kamera açılamadı. Kamera izni verin veya QR içeriğini aşağıdaki alana yapıştırın.";
  });
}
function stopQrScanner(){
  if(s.qrScanner){
    const scanner=s.qrScanner;
    s.qrScanner=null;
    scanner.stop().catch(()=>{}).finally(()=>scanner.clear().catch(()=>{}));
  }
}
function applyQrPayload(raw){
  try{
    const clean=String(raw||"").trim();
    let data=null;

    if(MACHINE_QR_REGISTRY[clean]){
      data=MACHINE_QR_REGISTRY[clean];
    }else{
      const parsed=JSON.parse(clean);
      if(parsed.app!=="ETILISMART"||!["new-fault","machine-info"].includes(parsed.action)){
        throw new Error("Geçersiz QR");
      }
      data=parsed;
    }

    if(!data.factory||!data.line||!data.machine)throw new Error("Eksik makine bilgisi");
    stopQrScanner();
    s.qrModal={
      mode:"machine-info",
      machineCode:data.machineCode||clean,
      factory:data.factory,
      line:data.line,
      department:data.department||findMachineDepartment(data.machine),
      machine:data.machine
    };
    render();
  }catch(e){
    const msg=document.getElementById("qrMessage");
    if(msg)msg.textContent="QR kod tanınmadı. Geçerli bir ETİLİSMART makine kodu okutun.";
  }
}

function newf(){
  return `${clockBlock()}<div class="head"><div><h1>Arıza Kaydı Oluştur</h1><p>Yeni arıza kaydını sisteme ekleyin.</p></div><button type="button" class="qr-scan-button" id="openQrScanner">▣ QR Kod Tara</button></div>
  <div id="qrFilledInfo" class="qr-filled-info"></div>
  <div class="card form"><form id="fault"><div class="formgrid">
  <div class="field"><label>Fabrika</label><select id="factory" required>${opts(Object.keys(FACTORIES))}</select></div>
  <div class="field"><label>Hat</label><select id="line" required disabled>${opts([],"Önce fabrika seçiniz")}</select></div>
  <div class="field"><label>Bölüm</label><select id="department" required>${opts(Object.keys(STRUCTURE))}</select></div>
  <div class="field"><label>Makine</label><select id="machine" required disabled>${opts([],"Önce bölüm seçiniz")}</select></div>
  <div class="field"><label>Arıza Tipi</label><select id="type" required>${opts(TYPES)}</select></div>
  <div class="field"><label>Arıza Konusu</label><input id="subject" required></div>
  <div class="field full"><label>Arıza Açıklaması</label><textarea id="desc" required></textarea></div>
  <div class="field"><label>Fotoğraf</label><input type="file" id="photo" accept="image/*" capture="environment"></div>
  <div class="field check"><label><input type="checkbox" id="stopped"> Üretim durdu mu?</label></div>
  </div><div class="actions"><button type="button" class="secondary" data-p="dashboard">İptal</button><button class="primary">Kaydı Oluştur</button></div></form></div>`;
}
function reportPage(){
  let a=visibleFaults();
  if(s.reportFactory!=="Tümü")a=a.filter(x=>x.factory===s.reportFactory);
  if(s.reportStart)a=a.filter(x=>new Date(x.createdAt)>=new Date(s.reportStart+"T00:00:00"));
  if(s.reportEnd)a=a.filter(x=>new Date(x.createdAt)<=new Date(s.reportEnd+"T23:59:59"));
  a.sort((x,y)=>new Date(y.createdAt)-new Date(x.createdAt));
  const total=a.length,stop=a.filter(x=>x.stopped).length,avg=total?Math.round(a.reduce((sum,x)=>sum+durationMs(x)/60000,0)/total):0;
  const typeData=countBy(chartRangeFaultsFor(a,"type"),"type").map(([label,value])=>({label,value}));
  const factoryOptions=s.user?.role==="Fabrika Müdürü" ? [s.user.factory] : ["Tümü",...Object.keys(FACTORIES)];
  return `${clockBlock()}<div class="head"><div><h1>Geçmiş Arıza Raporu</h1><p>${roleIsDepartmentLimited()?esc(s.user.department)+" bölümüne ait kayıtlar":"Yetki alanınızdaki geçmiş kayıtlar"}</p></div></div>
  <div class="card report-filter"><div class="field"><label>Başlangıç Tarihi</label><input type="date" id="reportStart" value="${s.reportStart}"></div><div class="field"><label>Bitiş Tarihi</label><input type="date" id="reportEnd" value="${s.reportEnd}"></div><div class="field"><label>Fabrika</label><select id="reportFactory">${factoryOptions.map(x=>`<option ${x===s.reportFactory||factoryOptions.length===1?"selected":""}>${x}</option>`).join("")}</select></div><button class="secondary" id="clearReport">Filtreyi Temizle</button></div>
  <div class="grid report-cards"><div class="card"><div class="label">Toplam Kayıt</div><div class="value">${total}</div></div><div class="card"><div class="label">Üretim Duruşu</div><div class="value">${stop}</div></div><div class="card"><div class="label">Ortalama Süre</div><div class="value">${avg}<small> dk</small></div></div></div>
  <div class="chart-panel">
    <div class="chart-panel-head"><h4>Seçilen Dönemde Arıza Tipleri</h4>${chartRangeControlsFor("type")}</div>
    ${barChartSVG(typeData.length?typeData:[{label:"Kayıt Yok",value:0}],"Arıza Tipleri")}
  </div>${table(a)}`;
}
function machineState(factory,line,machine){
  const active=s.faults.find(x=>x.factory===factory&&x.line===line&&x.machine===machine&&x.status!=="done");
  if(!active)return {cls:"running",text:"Çalışıyor"};
  if(active.stopped)return {cls:"stopped",text:"Duruş"};
  return {cls:"warning",text:"Arızalı"};
}
function layoutPage(){
  const factory=s.layoutFactory,lines=FACTORIES[factory]||[];
  if(!lines.includes(s.layoutLine))s.layoutLine=lines[0];
  const line=s.layoutLine;
  const departments=Object.entries(STRUCTURE).filter(([dept])=>!roleIsDepartmentLimited()||dept===s.user.department);
  const states=departments.flatMap(([,machines])=>machines.map(machine=>machineState(factory,line,machine)));
  const running=states.filter(x=>x.cls==="running").length,warning=states.filter(x=>x.cls==="warning").length,stopped=states.filter(x=>x.cls==="stopped").length;
  return `${clockBlock()}<div class="head mobile-page-head"><div><span class="page-eyebrow">DİJİTAL FABRİKA HARİTASI</span><h1>Hat Yerleşim Planı</h1><p>Prosesi bölüm bölüm izleyin; makine kartına dokunarak bakım geçmişini açın.</p></div></div>
  <div class="layout-control-panel card"><div class="field"><label>Fabrika</label><select id="layoutFactory">${opts(Object.keys(FACTORIES),"Seçiniz",factory)}</select></div><div class="field"><label>Hat</label><select id="layoutLine">${opts(lines,"Seçiniz",line)}</select></div><div class="layout-live"><span class="live-pulse"></span><div><b>Canlı görünüm</b><small>Makine durumları arıza kayıtlarından hesaplanır</small></div></div></div>
  <div class="layout-status-summary"><div><i class="dot running"></i><span>Çalışıyor</span><b>${running}</b></div><div><i class="dot warning"></i><span>Arızalı</span><b>${warning}</b></div><div><i class="dot stopped"></i><span>Duruş</span><b>${stopped}</b></div></div>
  <div class="plant-map visual-plant-map">${departments.map(([dept,machines],di)=>{const deptStates=machines.map(m=>machineState(factory,line,m));const activeCount=deptStates.filter(x=>x.cls!=="running").length;return `<section class="dept-block visual-dept"><header class="dept-header"><div class="dept-number">${String(di+1).padStart(2,"0")}</div><div><h3>${esc(dept)}</h3><p>${machines.length} makine · ${activeCount?`${activeCount} dikkat gerektiriyor`:"Tümü çalışıyor"}</p></div><span class="dept-health ${activeCount?"attention":"healthy"}">${activeCount?"Kontrol":"Normal"}</span></header><div class="process-track">${machines.map((m,i)=>{const ms=machineState(factory,line,m);const code=machineCodeFor(factory,line,m);return `<div class="process-step"><button class="machine-card visual-machine-card ${ms.cls}" data-machine="${esc(m)}" data-mf="${esc(factory)}" data-ml="${esc(line)}"><div class="machine-visual">${machineVisual(m)}</div><div class="machine-copy"><span class="machine-code">${esc(code)}</span><h4>${esc(m)}</h4><span class="machine-status-pill"><i></i>${esc(ms.text)}</span></div><span class="machine-chevron">${uiIcon("chevron")}</span></button>${i<machines.length-1?`<div class="flow-arrow">${uiIcon("arrow")}</div>`:""}</div>`}).join("")}</div></section>`}).join("")}</div>`;
}
function machineModal(){
  if(!s.machineModal)return "";
  const {factory,line,machine}=s.machineModal;
  const department=findMachineDepartment(machine);
  const code=machineCodeFor(factory,line,machine);
  const state=machineState(factory,line,machine);
  const hist=visibleFaults().filter(x=>x.factory===factory&&x.line===line&&x.machine===machine).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const total=hist.length,active=hist.filter(x=>x.status!=="done").length,totalMin=Math.round(hist.reduce((sum,x)=>sum+durationMs(x)/60000,0));
  const mttr=total?Math.round(totalMin/total):0;
  const sorted=[...hist].sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
  let mtbf=0;if(sorted.length>1){let sum=0,count=0;for(let i=1;i<sorted.length;i++){sum+=(new Date(sorted[i].createdAt)-new Date(sorted[i-1].createdAt))/3600000;count++}mtbf=Math.round(sum/count)}
  const typeData=countBy(hist,"type").map(([label,value])=>({label,value}));
  const monthMap={};hist.forEach(x=>{const d=new Date(x.createdAt);const k=d.toLocaleDateString("tr-TR",{month:"short",year:"2-digit"});monthMap[k]=(monthMap[k]||0)+1});
  const trend=Object.entries(monthMap).slice(-8).map(([label,value])=>({label,value}));
  const topSubject=countBy(hist,"subject")[0]?.[0]||"-";
  let body="";
  if(s.machineTab==="history")body=table(hist);
  else if(s.machineTab==="charts")body=`<div class="chartgrid modal-chart-grid">${lineChartSVG(trend.length?trend:[{label:"Yok",value:0}],"Makine Arıza Trendi")}${barChartSVG(typeData.length?typeData:[{label:"Yok",value:0}],"Arıza Tipi Dağılımı")}</div>`;
  else if(s.machineTab==="documents")body=`<div class="empty-panel document-drop"><div class="document-icon">${uiIcon("report")}</div><h3>Makine Dokümanları</h3><p>Elektrik şeması, mekanik çizim, kullanım kılavuzu ve PLC yedekleri bu alanda tutulacak.</p><button class="secondary">+ Doküman Ekle</button></div>`;
  else body=`<div class="machine-kpis"><div class="metric"><span>Toplam Arıza</span><b>${total}</b></div><div class="metric"><span>Aktif Arıza</span><b>${active}</b></div><div class="metric"><span>Toplam Duruş</span><b>${totalMin} dk</b></div><div class="metric"><span>MTTR</span><b>${mttr} dk</b></div><div class="metric"><span>MTBF</span><b>${mtbf} sa</b></div><div class="metric wide"><span>En Sık Arıza</span><b>${esc(topSubject)}</b></div></div><div class="machine-info-grid"><div class="info-card"><h4>Makine Kimliği</h4><p><b>Kod:</b> ${esc(code)}</p><p><b>Bölüm:</b> ${esc(department)}</p><p><b>Fabrika:</b> ${esc(factory)}</p><p><b>Hat:</b> ${esc(line)}</p></div><div class="info-card"><h4>Son Kayıt</h4>${hist[0]?`<p><b>${esc(hist[0].subject)}</b></p><p>${fmtDate(hist[0].createdAt)}</p><p>${durationText(hist[0])}</p>`:"<p>Kayıt yok.</p>"}</div></div>`;
  return `<div class="modal-backdrop" id="modalCloseBg"><div class="modal machine-modal"><div class="modal-head machine-modal-head"><div class="machine-modal-visual">${machineVisual(machine)}</div><div class="machine-modal-title"><span class="status ${state.cls==="running"?"done":state.cls==="stopped"?"open":"progress"}">${esc(state.text)}</span><h2>${esc(machine)}</h2><p>${esc(department)} · ${esc(factory)} / ${esc(line)}</p><small>${esc(code)}</small></div><div class="modal-head-actions"><button type="button" class="machine-qr-button" data-qr-machine="${esc(machine)}" data-qr-factory="${esc(factory)}" data-qr-line="${esc(line)}">${uiIcon("qr")}<span>QR</span></button><button id="modalClose" aria-label="Kapat">×</button></div></div><div class="machine-modal-actions"><button type="button" class="primary" id="machineFaultCreate">${uiIcon("plus")} Bu Makine İçin Arıza Aç</button></div><div class="tabs"><button data-tab="overview" class="${s.machineTab==="overview"?"active":""}">Genel Bakış</button><button data-tab="history" class="${s.machineTab==="history"?"active":""}">Arıza Geçmişi</button>${roleHasCharts()?`<button data-tab="charts" class="${s.machineTab==="charts"?"active":""}">Grafikler</button>`:""}<button data-tab="documents" class="${s.machineTab==="documents"?"active":""}">Dokümanlar</button></div>${body}</div></div>`;
}
function page(){
  if(isOperator() && !["dashboard","new"].includes(s.page))s.page="dashboard";
  if(s.page==="new")return newf();
  if(s.page==="faults")return `${clockBlock()}<div class="head"><div><h1>Arıza Kayıtları</h1><p>Tüm kayıtlar</p></div><button class="primary" data-p="new">+ Yeni Arıza</button></div>${table([...visibleFaults()].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)),true)}`;
  if(s.page==="layout")return layoutPage();
  if(s.page==="report")return roleHasCharts()?reportPage():dashboard();
  return dashboard();
}
function mobileNav(){
  const items=isOperator()
    ?[["dashboard","home","Ana Sayfa"],["new","plus","Arıza Aç"]]
    :[["dashboard","home","Panel"],["new","plus","Arıza Aç"],["faults","faults","Arızalar"],...(roleHasCharts()?[["report","report","Rapor"]]:[]),["layout","layout","Hatlar"]];
  return `<nav class="mobile-top-tabs" aria-label="Mobil menü">${items.map(([page,icon,label])=>`<button type="button" data-p="${page}" class="${s.page===page?"active":""}">${uiIcon(icon)}<small>${label}</small></button>`).join("")}</nav>`;
}
function app(){
  const alerts=visibleFaults().filter(x=>x.status!=="done").length;
  const initials=(s.user?.name||"ES").split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase();
  return `<header class="top"><div class="brand-wrap"><div class="brand-mark">E</div><div class="brand">ETİLİ<span>SMART</span><small>Bakım Yönetim Sistemi</small></div></div>
    <div class="top-user"><div class="user-avatar">${esc(initials)}</div><div class="top-user-copy"><b>${esc(s.user?.name||"")}</b><small>${esc(s.user?.role||"")}</small></div>${!isOperator()?`<button type="button" class="top-alert" data-p="faults" aria-label="Aktif arızalar">${uiIcon("bell")}${alerts?`<span>${alerts>99?"99+":alerts}</span>`:""}</button>`:""}<button id="out" class="logout-button" aria-label="Çıkış">${uiIcon("logout")}<span>Çıkış</span></button></div>
  </header>${mobileNav()}<div class="layout"><aside><div class="aside-title">MENÜ</div>${isOperator()?`${nav("dashboard","Ana Panel")}${nav("new","Arıza Kaydı Oluştur")}`:`${nav("dashboard","Ana Panel")}${nav("new","Arıza Kaydı Oluştur")}${nav("faults","Arıza Kayıtları")}${roleHasCharts()?nav("report","Geçmiş Arıza Raporu"):""}${nav("layout","Hat Yerleşim Planı")}`}</aside><main>${page()}</main></div>
  <button type="button" id="mobileQrFab" class="mobile-qr-fab" aria-label="QR kod tara">${uiIcon("qr")}<span>QR Tara</span></button>${machineModal()}${qrModal()}`;
}
function render(){document.getElementById("app").innerHTML=s.login?app():login();bind();updateClockAndDurations()}
function bind(){
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{s.page=b.dataset.p;render()});
  const l=document.getElementById("login");
  const roleEl=document.getElementById("role");
  const deptWrap=document.getElementById("loginDepartmentWrap");
  if(roleEl)roleEl.onchange=()=>{deptWrap.classList.toggle("hidden",!["Bölüm Formeni","Bölüm Yöneticisi"].includes(roleEl.value))};
  if(l)l.onsubmit=e=>{
    e.preventDefault();
    if(document.getElementById("password").value!=="1234"){document.getElementById("loginError").textContent="Şifre hatalı.";return;}
    s.user={
      name:document.getElementById("name").value,
      role:roleEl.value,
      factory:document.getElementById("loginFactory").value,
      department:["Bölüm Formeni","Bölüm Yöneticisi"].includes(roleEl.value)?document.getElementById("loginDepartment").value:""
    };
    s.dashboardFactory=s.user.role==="Fabrika Müdürü"?s.user.factory:"Tümü";
    s.reportFactory=s.dashboardFactory;
    s.login=true;
    storageSet(sessionStorage,"eslogin","1");
    storageSet(sessionStorage,"esuser",JSON.stringify(s.user));
    render();
  };
  const out=document.getElementById("out");if(out)out.onclick=()=>{storageClear(sessionStorage);s.login=false;s.user=null;render()};
  const df=document.getElementById("dashboardFactory");if(df)df.onchange=()=>{s.dashboardFactory=df.value;render()};
  document.querySelectorAll(".chart-unit").forEach(el=>el.onchange=()=>{
    const id=el.dataset.chart;
    if(!s.chartRanges[id])s.chartRanges[id]={unit:"day",value:30};
    s.chartRanges[id].unit=el.value;
    render();
  });
  document.querySelectorAll(".chart-value").forEach(el=>el.onchange=()=>{
    const id=el.dataset.chart;
    if(!s.chartRanges[id])s.chartRanges[id]={unit:"day",value:30};
    s.chartRanges[id].value=Math.max(1,Number(el.value)||1);
    render();
  });
  const factoryEl=document.getElementById("factory"),lineEl=document.getElementById("line");if(factoryEl)factoryEl.onchange=()=>{const a=FACTORIES[factoryEl.value]||[];lineEl.innerHTML=opts(a);lineEl.disabled=!a.length};
  const depEl=document.getElementById("department"),machineEl=document.getElementById("machine");if(depEl)depEl.onchange=()=>{const a=STRUCTURE[depEl.value]||[];machineEl.innerHTML=opts(a);machineEl.disabled=!a.length};
  const f=document.getElementById("fault");if(f)f.onsubmit=e=>{e.preventDefault();const now=new Date().toISOString();s.faults.push({id:Math.max(...s.faults.map(x=>x.id))+1,factory:factoryEl.value,line:lineEl.value,department:depEl.value,machine:machineEl.value,type:document.getElementById("type").value,subject:document.getElementById("subject").value,description:document.getElementById("desc").value,stopped:document.getElementById("stopped").checked,photoName:document.getElementById("photo").files[0]?.name||"",status:"open",createdAt:now,closedAt:null});save();s.page="faults";render();alert("Arıza kaydı oluşturuldu.")};
  document.querySelectorAll(".sel").forEach(x=>x.onchange=()=>{let f=s.faults.find(y=>y.id==x.dataset.id);f.status=x.value;if(x.value==="done"&&!f.closedAt)f.closedAt=new Date().toISOString();if(x.value!=="done")f.closedAt=null;save();render()});
  const rf=document.getElementById("reportFactory"),rs=document.getElementById("reportStart"),re=document.getElementById("reportEnd");if(rf)rf.onchange=()=>{s.reportFactory=rf.value;render()};if(rs)rs.onchange=()=>{s.reportStart=rs.value;render()};if(re)re.onchange=()=>{s.reportEnd=re.value;render()};
  const cr=document.getElementById("clearReport");if(cr)cr.onclick=()=>{s.reportFactory="Tümü";s.reportStart="";s.reportEnd="";render()};
  const lf=document.getElementById("layoutFactory"),ll=document.getElementById("layoutLine");if(lf)lf.onchange=()=>{s.layoutFactory=lf.value;s.layoutLine=(FACTORIES[lf.value]||[])[0]||"";render()};if(ll)ll.onchange=()=>{s.layoutLine=ll.value;render()};
  document.querySelectorAll("[data-machine]").forEach(b=>b.onclick=()=>{s.machineModal={factory:b.dataset.mf,line:b.dataset.ml,machine:b.dataset.machine};s.machineTab="overview";render()});
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{s.machineTab=b.dataset.tab;render()});
  const mc=document.getElementById("modalClose");if(mc)mc.onclick=()=>{s.machineModal=null;render()};
  const mb=document.getElementById("modalCloseBg");if(mb)mb.onclick=e=>{if(e.target===mb){s.machineModal=null;render()}};

  const openQr=document.getElementById("openQrScanner");
  if(openQr)openQr.onclick=openQrScanner;
  const openQrCard=document.getElementById("openQrScannerCard");
  if(openQrCard)openQrCard.onclick=openQrScanner;
  const mobileQrFab=document.getElementById("mobileQrFab");
  if(mobileQrFab)mobileQrFab.onclick=openQrScanner;
  const machineFaultCreate=document.getElementById("machineFaultCreate");
  if(machineFaultCreate)machineFaultCreate.onclick=openFaultFormFromMachine;
  document.querySelectorAll(".machine-qr-button").forEach(b=>b.onclick=()=>openQrGenerator(b.dataset.qrFactory,b.dataset.qrLine,b.dataset.qrMachine));
  document.querySelectorAll(".qr-close").forEach(b=>b.onclick=closeQrModal);
  document.querySelectorAll(".qr-backdrop").forEach(bg=>bg.onclick=e=>{if(e.target===bg)closeQrModal()});
  const applyManual=document.getElementById("applyQrManual");
  if(applyManual)applyManual.onclick=()=>applyQrPayload(document.getElementById("qrManualText").value.trim());
  const createFaultFromQr=document.getElementById("createFaultFromQr");
  if(createFaultFromQr)createFaultFromQr.onclick=openFaultFormFromQr;
  const printQr=document.getElementById("printQr");
  if(printQr)printQr.onclick=()=>window.print();

}
function startEtiliSmart(){
  setInterval(updateClockAndDurations,1000);
  try{
    render();
  }catch(error){
  console.error(error);
  const app=document.getElementById("app");
  if(app)app.innerHTML=`<div style="max-width:720px;margin:60px auto;padding:24px;font-family:Arial,sans-serif;background:#fff;border:1px solid #ddd;border-radius:16px">
    <h2 style="margin-top:0">ETİLİSMART açılırken bir hata oluştu</h2>
    <p>Tarayıcıdaki eski kayıtları temizleyip sayfayı yenileyin.</p>
    <button id="resetEtiliSmart" style="border:0;border-radius:10px;padding:11px 16px;background:#f2b21a;font-weight:700">Kayıtları Temizle ve Yenile</button>
    <pre style="white-space:pre-wrap;color:#a00">${String(error.message||error)}</pre>
  </div>`;
  const resetButton=document.getElementById("resetEtiliSmart");
  if(resetButton){
    resetButton.addEventListener("click",function(){
      storageRemove(localStorage,K);
      storageRemove(sessionStorage,"eslogin");
      storageRemove(sessionStorage,"esuser");
      location.reload();
    });
  }
  }
}
if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",startEtiliSmart);
}else{
  startEtiliSmart();
}
</script></body></html>
