<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15181c"><title>ETİLİSMART</title><style>:root{--y:#f2b21a;--yellow:#f2b21a;--d:#15181c;--m:#6b7280;--bg:#f4f6f8;--w:#fff;--l:#e5e7eb;--line:#e5e7eb;--g:#1f9d63;--r:#d64545;--shadow:0 8px 24px rgba(0,0,0,.06)}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--d)}button,input,select,textarea{font:inherit}.top{height:68px;background:var(--d);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font-weight:900}.brand span{color:var(--y)}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 68px)}aside{background:#fff;border-right:1px solid var(--l);padding:18px}.nav{width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:10px;margin-bottom:8px}.nav:hover,.nav.active{background:#fff7dc;font-weight:700}main{padding:24px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.head h1{margin:0}.head p{margin:6px 0 0;color:var(--m)}.primary{border:0;background:var(--y);font-weight:800;padding:11px 16px;border-radius:10px}.secondary{border:1px solid var(--l);background:#fff;padding:10px 14px;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.06)}.label{font-size:13px;color:var(--m)}.value{font-size:30px;font-weight:900;margin-top:8px}.section{margin-top:20px}.table{overflow:auto;background:#fff;border:1px solid var(--l);border-radius:16px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:13px;border-bottom:1px solid var(--l);text-align:left}th{font-size:12px;color:var(--m);background:#fafafa}.status{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.open{ </style></head><body><div id="app"></div><script>
const K="etilismart_faults_v5";

const FACTORIES={
  "1. Fabrika":["1. Hat","2. Hat","3. Hat"],
  "2. Fabrika B Blok":["1. Hat","2. Hat"],
  "2. Fabrika A Blok":["1. Hat","2. Hat","3. Hat"]
};

const STRUCTURE={
  "Masse Bölümü":["Beşiker","Değirmen Üstü Konveyörler","Değirmenler","Karıştırma Havuzları","Elekler","Spray Dryer","Silo Üstü Konveyör Bantları","Silo","Silo Altı Konveyör Bantları"],
  "Pres Bölümü":["Presler","Pres Rulo ve Kayışlar","Mengil"],
  "Sır Bantları":["Konveyör Bantlar","Su Atma","Engop Atma","Sır Atma","Sır Tankları","Dijital Baskı"],
  "Fırınlar":["Fırın Girişi Elevatör","Fırın Girişi Kayışlar","Fırın Girişi Rulolar","Fırın","Fırın Çıkışı Rulolar","Fırın Çıkışı Kayışlar","Fırın Çıkışı Şematik"],
  "Polisaj":["Nano","Parlatma","Kareleme","Kalibre","Su Emme","Kayışlar"],
  "Paketleme":["Kalite Masası","Stoker","Paketleme","Bantlar","Etiket Yazıcı","Deste Birleştirici","Deste Çevirici","Paletizer","Streçleme"]
};

const ROLES=["Operatör","Bakım Personeli","Bölüm Formeni","Bölüm Yöneticisi","Bakım Formeni","Bakım Müdürü","Fabrika Müdürü","Genel Müdür"];
const TYPES=["Elektrik","Mekanik","Otomasyon","Pnömatik","Hidrolik","Diğer"];

const SUBJECTS={
  "Elektrik":["Motor termik attı","Sigorta açtı","Kontaktör çekmiyor","Sensör beslemesi yok","Kablo bağlantısı gevşek","Sürücü alarmı","Faz hatası","Etiket yazıcı enerjisiz"],
  "Mekanik":["Rulman sesi","Kayış gevşek","Zincir uzaması","Redüktör yağ kaçağı","Rulo sıkışması","Kaplin aşınması","Titreşim yüksek","Mekanik sürtünme"],
  "Otomasyon":["PLC haberleşme hatası","Encoder senkron hatası","Servo alarmı","HMI bağlantı hatası","Program çevrim hatası","Pozisyon sapması","Profinet bağlantı kesildi","Reçete yüklenemedi"],
  "Pnömatik":["Hava kaçağı","Piston yavaş","Valf bobini arızalı","Basınç düşük","Vakum oluşmuyor","Regülatör ayarsız"],
  "Hidrolik":["Yağ basıncı düşük","Hidrolik kaçak","Valf sıkışması","Pompa sesi","Yağ sıcaklığı yüksek","Filtre tıkalı"],
  "Diğer":["Operatör bildirimi","Temizlik ihtiyacı","Ayar problemi","Malzeme sıkışması","Kalite kaynaklı duruş"]
};

function seededRandom(seed){
  let value=seed % 2147483647;
  return function(){
    value=value*16807%2147483647;
    return (value-1)/2147483646;
  }
}

function generateHistory(){
  const rnd=seededRandom(20260725);
  const factories=Object.keys(FACTORIES);
  const departments=Object.keys(STRUCTURE);
  const types=TYPES;
  const arr=[];
  let id=2000;
  const now=new Date();

  for(let i=0;i<260;i++){
    const factory=factories[Math.floor(rnd()*factories.length)];
    const line=FACTORIES[factory][Math.floor(rnd()*FACTORIES[factory].length)];
    const department=departments[Math.floor(rnd()*departments.length)];
    const machine=STRUCTURE[department][Math.floor(rnd()*STRUCTURE[department].length)];
    const type=types[Math.floor(rnd()*types.length)];
    const subjectList=SUBJECTS[type];
    const subject=subjectList[Math.floor(rnd()*subjectList.length)];
    const daysAgo=2+Math.floor(rnd()*205);
    const start=new Date(now);
    start.setDate(now.getDate()-daysAgo);
    start.setHours(Math.floor(rnd()*24),Math.floor(rnd()*60),0,0);
    const duration=5+Math.floor(rnd()*235);
    const end=new Date(start.getTime()+duration*60000);
    const stopped=rnd()>0.58;
    arr.push({
      id:id++,
      factory,line,department,machine,type,subject,
      description:"Geçmiş örnek arıza kaydı. Müdahale tamamlandı ve kayıt kapatıldı.",
      stopped,photoName:"",status:"done",
      createdAt:start.toISOString(),closedAt:end.toISOString()
    });
  }

  arr.push(
    {id:1001,factory:"1. Fabrika",line:"1. Hat",department:"Pres Bölümü",machine:"Presler",type:"Hidrolik",subject:"Yağ basıncı düşük",description:"Basınç normal seviyenin altında.",stopped:true,photoName:"",status:"open",createdAt:new Date(Date.now()-42*60000).toISOString(),closedAt:null},
    {id:1002,factory:"2. Fabrika B Blok",line:"2. Hat",department:"Paketleme",machine:"Etiket Yazıcı",type:"Elektrik",subject:"Etiket yazdırmıyor",description:"Yazıcı çevrimiçi ancak çıktı alınamıyor.",stopped:false,photoName:"",status:"progress",createdAt:new Date(Date.now()-18*60000).toISOString(),closedAt:null}
  );
  return arr;
}

let s={
  login:sessionStorage.getItem("eslogin")==="1",
  user:JSON.parse(sessionStorage.getItem("esuser")||"null"),
  page:"dashboard",
  faults:JSON.parse(localStorage.getItem(K)||"null")||generateHistory(),
  dashboardFactory:"Tümü",
  reportFactory:"Tümü",
  reportStart:"",
  reportEnd:"",
  layoutFactory:"1. Fabrika",
  layoutLine:"1. Hat",
  machineModal:null,
  machineTab:"overview",
  chartRangeUnit:"day",
  chartRangeValue:30
};

function save(){localStorage.setItem(K,JSON.stringify(s.faults))}
function isOperator(){
  return s.user?.role==="Operatör";
}
function roleHasCharts(){
  return !["Operatör","Bakım Personeli"].includes(s.user?.role);
}
function isManagementRole(){
  return ["Bölüm Yöneticisi","Bakım Formeni","Bakım Müdürü","Fabrika Müdürü","Genel Müdür"].includes(s.user?.role);
}
function roleIsDepartmentLimited(){
  return ["Bölüm Formeni","Bölüm Yöneticisi"].includes(s.user?.role);
}
function visibleFaults(base=s.faults){
  let a=[...base];
  if(roleIsDepartmentLimited() && s.user?.department){
    a=a.filter(x=>x.department===s.user.department);
  }
  if(s.user?.role==="Fabrika Müdürü" && s.user?.factory){
    a=a.filter(x=>x.factory===s.user.factory);
  }
  return a;
}
function rangeStartDate(){
  const now=new Date();
  const n=Math.max(1,Number(s.chartRangeValue)||1);
  if(s.chartRangeUnit==="hour")return new Date(now.getTime()-n*3600000);
  if(s.chartRangeUnit==="shift")return new Date(now.getTime()-n*8*3600000);
  if(s.chartRangeUnit==="day")return new Date(now.getTime()-n*86400000);
  const d=new Date(now);d.setMonth(d.getMonth()-n);return d;
}
function chartRangeFaults(base){
  const start=rangeStartDate();
  return visibleFaults(base).filter(x=>new Date(x.createdAt)>=start);
}
function chartRangeControls(){
  return `<div class="card chart-range">
    <div class="field"><label>Grafik Zaman Birimi</label>
      <select id="chartRangeUnit">
        <option value="hour" ${s.chartRangeUnit==="hour"?"selected":""}>Saat</option>
        <option value="shift" ${s.chartRangeUnit==="shift"?"selected":""}>Vardiya</option>
        <option value="day" ${s.chartRangeUnit==="day"?"selected":""}>Gün</option>
        <option value="month" ${s.chartRangeUnit==="month"?"selected":""}>Ay</option>
      </select>
    </div>
    <div class="field"><label>Son Kaç Birim?</label>
      <input id="chartRangeValue" type="number" min="1" max="365" value="${s.chartRangeValue}">
    </div>
    <div class="range-note">Grafikler seçilen zaman aralığına göre otomatik yenilenir.</div>
  </div>`;
}
function periodLabel(d){
  if(s.chartRangeUnit==="hour")return d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
  if(s.chartRangeUnit==="shift"){
    const h=d.getHours();
    const name=h<8?"00–08":h<16?"08–16":"16–00";
    return `${d.toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit"})} ${name}`;
  }
  if(s.chartRangeUnit==="day")return d.toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit"});
  return d.toLocaleDateString("tr-TR",{month:"short",year:"2-digit"});
}
function trendData(base){
  const a=chartRangeFaults(base);
  const now=new Date();
  const n=Math.max(1,Number(s.chartRangeValue)||1);
  const buckets=[];
  if(s.chartRangeUnit==="hour"){
    for(let i=n-1;i>=0;i--){const start=new Date(now.getTime()-(i+1)*3600000),end=new Date(now.getTime()-i*3600000);buckets.push({start,end,label:periodLabel(end),value:0});}
  }else if(s.chartRangeUnit==="shift"){
    for(let i=n-1;i>=0;i--){const end=new Date(now.getTime()-i*8*3600000),start=new Date(end.getTime()-8*3600000);buckets.push({start,end,label:periodLabel(start),value:0});}
  }else if(s.chartRangeUnit==="day"){
    for(let i=n-1;i>=0;i--){const start=new Date(now);start.setDate(now.getDate()-i);start.setHours(0,0,0,0);const end=new Date(start);end.setDate(start.getDate()+1);buckets.push({start,end,label:periodLabel(start),value:0});}
  }else{
    for(let i=n-1;i>=0;i--){const start=new Date(now.getFullYear(),now.getMonth()-i,1);const end=new Date(now.getFullYear(),now.getMonth()-i+1,1);buckets.push({start,end,label:periodLabel(start),value:0});}
  }
  a.forEach(f=>{const t=new Date(f.createdAt);const b=buckets.find(x=>t>=x.start&&t<x.end);if(b)b.value++});
  return buckets;
}

function esc(v=""){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function opts(a,p="Seçiniz",selected=""){return `<option value="">${p}</option>${a.map(x=>`<option ${x===selected?"selected":""}>${esc(x)}</option>`).join("")}`}
function nav(p,t){return `<button class="nav ${s.page===p?"active":""}" data-p="${p}">${t}</button>`}
function st(x){return x==="open"?"Yeni":x==="progress"?"İşlemde":"Tamamlandı"}
function fmtDate(iso){return iso?new Date(iso).toLocaleString("tr-TR"):"-"}
function durationMs(f){return Math.max(0,(f.closedAt?new Date(f.closedAt):new Date())-new Date(f.createdAt))}
function durationText(f){
  const mins=Math.floor(durationMs(f)/60000);
  const days=Math.floor(mins/1440),hours=Math.floor((mins%1440)/60),rem=mins%60;
  if(days)return `${days} gün ${hours} sa ${rem} dk`;
  if(hours)return `${hours} sa ${rem} dk`;
  return `${rem} dk`;
}
function shiftInfo(d=new Date()){
  const h=d.getHours();
  if(h<8)return {name:"00–08 Vardiyası",range:"00:00 - 08:00"};
  if(h<16)return {name:"08–16 Vardiyası",range:"08:00 - 16:00"};
  return {name:"16–00 Vardiyası",range:"16:00 - 00:00"};
}
function currentShiftWindow(now=new Date()){
  const start=new Date(now);
  const end=new Date(now);
  const h=now.getHours();

  if(h<8){
    start.setHours(0,0,0,0);
    end.setHours(8,0,0,0);
  }else if(h<16){
    start.setHours(8,0,0,0);
    end.setHours(16,0,0,0);
  }else{
    start.setHours(16,0,0,0);
    end.setDate(end.getDate()+1);
    end.setHours(0,0,0,0);
  }
  return {start,end};
}
function isInCurrentShift(f){
  const {start,end}=currentShiftWindow();
  const t=new Date(f.createdAt);
  return t>=start && t<end;
}
function liveDateTime(){
  const now=new Date();
  return {date:now.toLocaleDateString("tr-TR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"}),time:now.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit",second:"2-digit"}),shift:shiftInfo(now)};
}
function clockBlock(){
  const x=liveDateTime();
  return `<div class="livebox"><div><strong id="liveDate">${x.date}</strong><span id="liveTime">${x.time}</span></div><div class="shiftpill"><b id="liveShift">${x.shift.name}</b><small>${x.shift.range}</small></div></div>`;
}
function table(a,edit=false){

  <td>${x.stopped?"<strong class='stop'>DURDU</strong>":"Devam"}</td><td><span class="status ${x.status}">${st(x.status)}</span></td>
  <td><strong class="duration" data-id="${x.id}">${durationText(x)}</strong></td><td>${fmtDate(x.createdAt)}</td>
  ${edit?`<td><select class="sel" data-id="${x.id}"><option value="open" ${x.status==="open"?"selected":""}>Yeni</option><option value="progress" ${x.status==="progress"?"selected":""}>İşlemde</option><option value="done" ${x.status==="done"?"selected":""}>Tamamlandı</option></select></td>`:""}
  </tr>`).join("")}</tbody></table></div>`;
}
function filteredDashboardFaults(){return s.dashboardFactory==="Tümü"?s.faults:s.faults.filter(x=>x.factory===s.dashboardFactory)}
function countBy(arr,key){
  const m={};arr.forEach(x=>m[x[key]]=(m[x[key]]||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
function lineChartSVG(data,title){
  const w=620,h=210,p=35,max=Math.max(...data.map(x=>x.value),1);
  const pts=data.map((x,i)=>`${p+i*(w-2*p)/Math.max(data.length-1,1)},${h-p-x.value*(h-2*p)/max}`).join(" ");
  return `<div class="chartbox"><h4>${title}</h4><svg viewBox="0 0 ${w} ${h}" role="img">
    <line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" class="axis"/>
    <polyline points="${pts}" class="line"/>
    ${data.map((x,i)=>{const cx=p+i*(w-2*p)/Math.max(data.length-1,1),cy=h-p-x.value*(h-2*p)/max;return `<circle cx="${cx}" cy="${cy}" r="4" class="point"><title>${x.label}: ${x.value}</title></circle><text x="${cx}" y="${h-10}" text-anchor="middle">${x.label}</text>`}).join("")}
  </svg></div>`;
}
function barChartSVG(data,title){
  const w=620,h=230,p=40,max=Math.max(...data.map(x=>x.value),1);
  const bw=(w-2*p)/Math.max(data.length,1)*0.62;
  return `<div class="chartbox"><h4>${title}</h4><svg viewBox="0 0 ${w} ${h}" role="img">
    <line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" class="axis"/>
    ${data.map((x,i)=>{const xPos=p+i*(w-2*p)/data.length+((w-2*p)/data.length-bw)/2;const bh=x.value*(h-2*p)/max;return `<rect x="${xPos}" y="${h-p-bh}" width="${bw}" height="${bh}" rx="5" class="bar"><title>${x.label}: ${x.value}</title></rect><text x="${xPos+bw/2}" y="${h-12}" text-anchor="middle">${esc(x.label)}</text><text x="${xPos+bw/2}" y="${h-p-bh-6}" text-anchor="middle" class="val">${x.value}</text>`}).join("")}
  </svg></div>`;
}

  <div class="grid">

  ${isManagementRole()?`

      <div class="section-title-row">
